# Index config for the default `datadog` CloudPrem index
version: 0.9

index_id: datadog

ingest_settings:
  validate_docs: false

indexing_settings:
  commit_timeout_secs: 30

retention:
  period: 30 days
  schedule: hourly

search_settings:
  # Keep in sync with expand_virtual_fields() in quickwit-query/src/cloudprem/query.rs
  default_search_fields:
    - message
    - extra_fts

# TODO: replace ALL default tokenizer with ddg tokenizer
# There would be two tokenizers: ddg and ddg_ignore_case (for message and all)

# There is an additional truncation in fields that applies only to indexed logs: the value is truncated to 75 KiB for the message field and 25 KiB for non-message fields.
# Datadog still stores the full text, and it remains visible in regular list queries in the Logs Explorer. However, the truncated version will be displayed when performing
# a grouped query, such as when grouping logs by that truncated field or performing similar operations that display that specific field.
# => FF tokenizer truncation after 75Kb for message and 25Kb for other fields (seems quite high)

# Sources:
# https://datadoghq.atlassian.net/wiki/spaces/LB/pages/2484928615/Logs+payload+format
# https://github.com/DataDog/logs-backend/blob/prod/domains/event-platform/libs/percolation/src/main/resources/elasticsearch/mappings/event.conf
# https://github.com/DataDog/logs-backend/blob/prod/domains/event-platform/libs/percolation/src/main/resources/elasticsearch/mappings/_root_event.conf
# https://github.com/DataDog/logs-backend/blob/prod/domains/event-platform/libs/facets/src/main/java/com/dd/logs/facets/RootFacets.java#L85
# Note that not all fields in the sources (e.g. event.conf) are handled here yet

# TODO Check following field names:
# tiebreaker(i64): used to differentiate logs with the same timestamp, which are stored only as ms. QW stores timestamp as ns. https://datadoghq.atlassian.net/wiki/spaces/LB/pages/1885536545/FAQ#I-sent-events-in-the-same-millisecond-but-with-a-timestamp-attribute-with-different-nanoseconds.-All-the-events-are-mixed-up-in-the-explorer.-How-to-explain-this%3F
# host_id(u64): A number for the host_id. How is it generated? Is is required?
# random_draw(f64): a random float between 0 and 1 used for subsampling. In Pomsky, this is a virtual field (absent from doc mappings) remapped at query time to the tiebreaker
# source_fragment_id(string): a fragment is the Husky equivalent to a split. this might be the initial split for a document?
# trace_id_low(string): the low 64 bit of a trace_id, seemingly to help migrating from 64b trace ids to 128b

doc_mapping:
  # CAUTION: Update this UID (this is actually an ULID) when you modify the doc mapping.
  # It has no semantic meaning. The Datadog index doc mapping is only updated
  # if and only if this UID differs from the current doc mapping UID.
  doc_mapping_uid: "01KNAAQX06DX0JG559WD57797P"
  mode: dynamic
  field_mappings:
    # TODO: Add RFC3164
    # With the preprocessing in Pomsky, we can actually just use one
    - name: timestamp
      type: datetime
      fast: true
      input_formats:
        - rfc3339
        - iso8601
        - unix_timestamp
      fast_precision: milliseconds
      indexed: false
    - name: message
      type: text
      tokenizer: datadog # +lowercase case insensitive search on message
      record: position
      fast: true
      fieldnorms: false
    # Seems to be used only internally, e.g. for paging and fetch_one
    - name: id
      type: text
      tokenizer: raw
      record: basic
      fieldnorms: false
    - name: custom
      type: json
      tokenizer: raw
      record: basic
      fast: true

    - name: tag # contains normalized tags, e.g {"env": "prod"}
      type: json
      tokenizer: raw
      fast: true
      # We do not need to store tags in json format,
      # they are in the tags field
      stored: false
    - name: tags # we can completely drop it and reconstruct it from tag
      type: 'array<text>'
      stored: true
      indexed: false
      fast: false

    # FTS-indexed copies of custom.error.message, custom.error.stack, and
    # custom.title. The custom field uses the raw tokenizer (exact match),
    # so bare text queries won't find values inside these sub-fields.
    # PomChi emits these as flat top-level fields; the concatenate field
    # `extra_fts` combines them for single-field FTS queries.
    - name: extra_fts_error_message
      type: text
      tokenizer: datadog
      record: position
      fieldnorms: false
      indexed: true
      stored: false
    - name: extra_fts_error_stack
      type: text
      tokenizer: datadog
      record: position
      fieldnorms: false
      indexed: true
      stored: false
    - name: extra_fts_title
      type: text
      tokenizer: datadog
      record: position
      fieldnorms: false
      indexed: true
      stored: false
    - name: extra_fts
      type: concatenate
      concatenate_fields:
        - extra_fts_error_message
        - extra_fts_error_stack
        - extra_fts_title
      tokenizer: datadog
      record: position

    # other text like core attributes
    - name: service
      type: text
      indexed: true
      tokenizer: raw
      record: basic
      fieldnorms: false
      fast: true
    - name: source
      type: text
      tokenizer: raw
      fast: true
      fieldnorms: false
      record: basic
    - name: service_type
      type: text
      tokenizer: raw
      fast: true
      fieldnorms: false
      record: basic
    - name: status
      type: text
      tokenizer: raw
      fast: true
      record: basic
      fieldnorms: false
    - name: host
      type: text
      tokenizer: raw
      fast: true
      record: basic
      fieldnorms: false
    - name: trace_id
      type: text
      tokenizer: raw
      fast: true
      fieldnorms: false
      record: basic
    - name: span_id
      type: text
      indexed: true
      tokenizer: raw
      fieldnorms: false
      record: basic

   # TODO: normally there is an `sds_info` object. Check OP SDS scanner:
   # https://docs.datadoghq.com/observability_pipelines/processors/sensitive_data_scanner

    - name: all # ALL fields for *:search
      # we do not include message here, in order to avoid inflating
      # the index size.
      type: concatenate
      concatenate_fields:
        # This should contain all fields above except message.
        # - timestamp # Not supported in concat fields
        # TODO: Check if we need to cover queries addressing tags, e.g. tags `*:"env:prod"` or tag `*:prod`
        # Generally this could be extracted by a query processor
        # - tag OR tags
        # error field removed — FTS on error sub-fields now handled by extra_fts
        - source
        - service
        - service_type
        - status
        - host
        - trace_id
        - span_id
        - custom
      # this is not an error: the all field is case insensitive.
      tokenizer: raw_lowercase
      record: basic
    # ----------------------------------
    # Do we really need these?
    #
    # TODO: Check if discovery_timestamp is used anywhere, or if we can drop it after ingestion
    - name: discovery_timestamp
      type: datetime
      fast: false
      indexed: false
      input_formats:
        - unix_timestamp
        - rfc3339
        - iso8601
    # TODO: This is a special measure for metrics on logs, but unclear if this is also used in search.
    - name: ingest_size_in_bytes
      type: u64
      fast: true
      indexed: false
      stored: false
    - name: tiebreaker
      type: i64 # actually i32, is populated in ProcessedLog constructor
      fast: true
      indexed: false
      stored: true
    # ----------------------------------
  tag_fields: [] #  maybe add core attributes?
  timestamp_field: timestamp
  index_field_presence: true # For exists queries
