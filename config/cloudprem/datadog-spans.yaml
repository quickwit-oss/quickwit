# Index config for the default `datadog-spans` BYOC index
version: 0.9

index_id: datadog-spans

ingest_settings:
  validate_docs: false

indexing_settings:
  commit_timeout_secs: 30

search_settings:
  default_search_fields: []

retention:
  period: 30 days
  schedule: hourly

doc_mapping:
  # CAUTION: Update this UID (this is actually an ULID) when you modify the doc mapping.
  # It has no semantic meaning. The Datadog index doc mapping is only updated
  # if and only if this UID differs from the current doc mapping UID.
  doc_mapping_uid: "01KCKZM549X2BHRYZ330F5BMHA"
  mode: lenient

  field_mappings:
    - name: start_timestamp_nanos
      type: datetime
      input_formats: [unix_timestamp]
      output_format: unix_timestamp_nanos
      indexed: false
      fast: true
      fast_precision: milliseconds

    - name: trace_id
      type: bytes
      input_format: hex
      output_format: hex
      fast: true

    - name: span_id
      type: bytes
      input_format: hex
      output_format: hex
      fast: true

    - name: service
      type: text
      tokenizer: raw
      fast: true

    - name: name
      type: text
      tokenizer: raw
      fast: true

  tag_fields: []
  timestamp_field: start_timestamp_nanos
  index_field_presence: false
