schema-version: v2.2
dd-service: pomsky
team: logs-cloudprem
repos:
  - url: https://github.com/DataDog/pomsky
    name: pomsky
contacts:
  - name: logs-cloudprem-team
    type: slack
    contact: https://dd.enterprise.slack.com/archives/C080CR58077
extensions:
  datadoghq.com/devflow:
    integrate:
      env:
        staging-integrated:
          branch: pomsky/staging
  datadoghq.com/sdp:
    workday_team: Logs CloudPrem
    conductor:
      slack: logs-cloudprem-ops-staging
      schedule: '* * * * 1-5'
      targets:
        - name: staging-integrated
          branch: pomsky/staging
          parent_environments:
            - staging
          deploy_only: true
          artifacts:
            - pomsky/staging-integrated
