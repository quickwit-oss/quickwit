schema-version: v2.2
dd-service: pomsky
team: logs-cloudprem
repos:
  - url: https://github.com/DataDog/pomsky
    name: pomsky
contacts:
  - name: logs-cloudprem-team
    type: slack
    contact: https://dd.enterprise.slack.com/archives/C080CR58077
extensions:
  datadoghq.com/devflow:
    integrate:
      env:
        staging:
          branch: main
        staging-integrated:
          branch: pomsky-staging
  datadoghq.com/sdp:
    workday_team: Logs CloudPrem
    conductor:
        targets:
          - name: staging
            branch: main
            schedule: '* * * * *'
            slack: logs-cloudprem-ops
          - name: staging-integrated
            branch: pomsky-staging
            schedule: '* * * * *'
            slack: logs-cloudprem-ops
