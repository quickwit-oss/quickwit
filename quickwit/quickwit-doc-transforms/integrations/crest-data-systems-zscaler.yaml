id: crest-data-systems-zscaler
metric_id: crest-data-systems-zscaler
backend_only: false
installation_sources: 
  - crest_data_systems_zia
  - crest_data_systems_zpa
facets:
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Geoip
    name: Destination City Name
    path: network.destination.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Destination Continent Code
    path: network.destination.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Destination Continent Name
    path: network.destination.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Destination Country ISO Code
    path: network.destination.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Country Name
    path: network.destination.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision ISO Code
    path: network.destination.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision Name
    path: network.destination.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
pipeline:
  type: pipeline
  name: Crest Data Systems Zscaler
  enabled: true
  filter:
    query: source:(crest_data_systems_zia OR crest_data_systems_zpa)
  processors:
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: date-remapper
      name: Define `LogTimestamp`, `CreationTime` as the official date of the log
      enabled: true
      sources:
        - LogTimestamp
        - CreationTime
    - type: pipeline
      name: ZPA Private Service Edge Status
      enabled: true
      filter:
        query: service:cd.zpa.private_service_edge_status
      processors:
        - type: attribute-remapper
          name: Map `PublicIP` to `network.client.ip`
          enabled: true
          sources:
            - PublicIP
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: ZPA App Connector Status
      enabled: true
      filter:
        query: service:cd.zpa.app_connector_status
      processors:
        - type: attribute-remapper
          name: Map `PublicIP` to `network.client.ip`
          enabled: true
          sources:
            - PublicIP
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: ZPA App Protection Logs
      enabled: true
      filter:
        query: service:cd.zpa.app_protection
      processors:
        - type: attribute-remapper
          name: Map `ClientPublicIp` to `network.client.ip`
          enabled: true
          sources:
            - ClientPublicIp
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - name: Create `DoubleEncryptionStatus` based on the value of `DoubleEncryption`
          enabled: true
          source: DoubleEncryption
          target: DoubleEncryptionStatus
          lookupTable: |-
            0,Off
            1,On
          defaultLookup: Off
          type: lookup-processor
        - type: user-agent-parser
          name: Parse The `UserAgent` field
          enabled: true
          sources:
            - UserAgent
          target: http.useragent_details
          encoded: false
          combineVersionDetails: false
    - type: pipeline
      name: ZPA Audit
      enabled: true
      filter:
        query: service:cd.zpa.audit
      processors:
        - name: Create `UserType` based on the value of `ClientAuditUpdate`
          enabled: true
          source: ClientAuditUpdate
          target: UserType
          lookupTable: |-
            0,Admin
            1,Client
          defaultLookup: Admin
          type: lookup-processor
    - type: pipeline
      name: ZPA Browser Access
      enabled: true
      filter:
        query: service:cd.zpa.browser_access
      processors:
        - type: attribute-remapper
          name: Map `ClientPublicIp` to `network.client.ip`
          enabled: true
          sources:
            - ClientPublicIp
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - type: user-agent-parser
          name: Parse The `UserAgent` field
          enabled: true
          sources:
            - UserAgent
          target: http.useragent_details
          encoded: false
          combineVersionDetails: false
        - type: string-builder-processor
          name: Create Full Version for `http.useragent_details.os`
          enabled: true
          template:
            "%{http.useragent_details.os.major}.%{http.useragent_details.os.minor\
            }.%{http.useragent_details.os.patch}"
          target: http.useragent_details.os.version
          replaceMissing: true
        - type: string-builder-processor
          name: Create Full Version for `http.useragent_details.browser`
          enabled: true
          template:
            "%{http.useragent_details.browser.major}.%{http.useragent_details.bro\
            wser.minor}.%{http.useragent_details.browser.patch}"
          target: http.useragent_details.browser.version
          replaceMissing: true
    - type: pipeline
      name: ZPA User Activity
      enabled: true
      filter:
        query: service:cd.zpa.user_activity
      processors:
        - type: attribute-remapper
          name: Map `Application` to `ClientApplication`
          enabled: true
          sources:
            - Application
          sourceType: attribute
          target: ClientApplication
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ClientPublicIP` to `network.client.ip`
          enabled: true
          sources:
            - ClientPublicIP
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: ZPA User Status
      enabled: true
      filter:
        query: service:cd.zpa.user_status
      processors:
        - type: attribute-remapper
          name: Map `PublicIP` to `network.client.ip`
          enabled: true
          sources:
            - PublicIP
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: ZIA DNS Logs
      enabled: true
      filter:
        query: service:cds.zia.dns
      processors:
        - type: attribute-remapper
          name: Map `event.cip` to `network.client.ip`
          enabled: true
          sources:
            - event.cip
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `event.sip` to `network.destination.ip`
          enabled: true
          sources:
            - event.sip
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - type: geo-ip-parser
          name: GeoIp Parser for `network.destination.ip`
          enabled: true
          sources:
            - network.destination.ip
          target: network.destination.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: ZIA Web Logs
      enabled: true
      filter:
        query: service:cds.zia.web
      processors:
        - type: attribute-remapper
          name: Map `event.cip` to `network.client.ip`
          enabled: true
          sources:
            - event.cip
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `event.sip` to `network.destination.ip`
          enabled: true
          sources:
            - event.sip
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - type: geo-ip-parser
          name: GeoIp Parser for `network.destination.ip`
          enabled: true
          sources:
            - network.destination.ip
          target: network.destination.geoip
          ip_processing_behavior: do-nothing
