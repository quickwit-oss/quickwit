pipeline:
  type: pipeline
  name: CyberArk Identity by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_cyberark_identity
  processors:
    - name: Lookup mfa-initiator to category
      enabled: true
      source: mfa-initiator
      target: category
      lookupTable: |-
        Authentication,MFA Login
        Challenge,Challenge
        Radius,Radius Login
        IWA,IWA Login
        Certificate,Certificate Login
        Passcode,Passcode Login
        SAML,SAML Login
        Zso,Certificate Login
        OAuthToken,OAuth Token Login
      type: lookup-processor
    - type: attribute-remapper
      name: Map `category` to `cds.cyberark.identity.category`
      enabled: true
      sources:
        - category
      sourceType: attribute
      target: cds.cyberark.identity.category
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `auth-method` to `cds.cyberark.identity.auth-method`
      enabled: true
      sources:
        - auth-method
      sourceType: attribute
      target: cds.cyberark.identity.auth-method
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `az-role-name` to `cds.cyberark.identity.az-role-name`
      enabled: true
      sources:
        - az-role-name
      sourceType: attribute
      target: cds.cyberark.identity.az-role-name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoLocation from ip-address, client-ip-address
      enabled: true
      sources:
        - ip-address
        - client-ip-address
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `user-id` to `usr.id`
      enabled: true
      sources:
        - user-id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user-name`, `owner` to `usr.name`
      enabled: true
      sources:
        - user-name
        - owner
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `ip-address`, `client-ip-address` to `network.client.ip`
      enabled: true
      sources:
        - ip-address
        - client-ip-address
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: date-remapper
      name: Define `when-occurred` as the official date of the log
      enabled: true
      sources:
        - when-occurred
    - type: attribute-remapper
      name: Map `email` to `usr.email`
      enabled: true
      sources:
        - email
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `model-name` to `http.useragent_details.device.family`
      enabled: true
      sources:
        - model-name
      sourceType: attribute
      target: http.useragent_details.device.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `os-version` to `http.useragent_details.os.family`
      enabled: true
      sources:
        - os-version
      sourceType: attribute
      target: http.useragent_details.os.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
