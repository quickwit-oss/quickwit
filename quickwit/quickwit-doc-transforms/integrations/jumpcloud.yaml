id: jumpcloud
metric_id: jumpcloud
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
pipeline:
  type: pipeline
  name: JumpCloud
  enabled: true
  filter:
    query: source:jumpcloud
  processors:
    - type: attribute-remapper
      name: Map `client_ip` to `network.client.ip`
      enabled: true
      sources:
        - client_ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event_type` to `evt.name`
      enabled: true
      sources:
        - event_type
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `success` to `evt.outcome`
      enabled: true
      sources:
        - success
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `initiated_by.email` to `usr.email`
      enabled: true
      sources:
        - initiated_by.email
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `initiated_by.type` to `usr.type`
      enabled: true
      sources:
        - initiated_by.type
      sourceType: attribute
      target: usr.type
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `initiated_by.id` to `usr.id`
      enabled: true
      sources:
        - initiated_by.id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `initiated_by.username` to `usr.name`
      enabled: true
      sources:
        - initiated_by.username
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `geoip.continent_code` to `network.client.geoip.continent.code`
      enabled: true
      sources:
        - geoip.continent_code
      sourceType: attribute
      target: network.client.geoip.continent.code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `geoip.country_code` to `network.client.geoip.country.iso_code`
      enabled: true
      sources:
        - geoip.country_code
      sourceType: attribute
      target: network.client.geoip.country.iso_code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `geoip.region_code` to `network.client.geoip.subdivision.iso_code`
      enabled: true
      sources:
        - geoip.region_code
      sourceType: attribute
      target: network.client.geoip.subdivision.iso_code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `geoip.region_name` to `network.client.geoip.subdivision.name`
      enabled: true
      sources:
        - geoip.region_name
      sourceType: attribute
      target: network.client.geoip.subdivision.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user_agent.os` to `http.useragent_details.os.family`
      enabled: true
      sources:
        - user_agent.os
      sourceType: attribute
      target: http.useragent_details.os.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user_agent.device` to `http.useragent_details.device.family`
      enabled: true
      sources:
        - user_agent.device
      sourceType: attribute
      target: http.useragent_details.device.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: geo-ip-parser
      name: Fetching GeoIp data from client_ip
      enabled: true
      sources:
        - client_ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: service-remapper
      name: Define `insights_service` as the official service of the log
      enabled: true
      sources:
        - insights_service
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: "1.3.0"
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "JumpCloud Directory Insights API"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "JumpCloud"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `insights_service` to `ocsf.metadata.log_name`
          enabled: true
          sources:
            - insights_service
          sourceType: attribute
          target: ocsf.metadata.log_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `id` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `event_type` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - event_type
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: grok-parser
          name: Parse timestamp to ocsf.time
          enabled: true
          source: timestamp
          samples:
            - "2025-04-28T09:48:14Z"
          grok:
            supportRules: ""
            matchRules: |-
              nine %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSS'Z'"):ocsf.time}
              eight %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSSS'Z'"):ocsf.time}
              seven %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'"):ocsf.time}
              six %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"):ocsf.time}
              five %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSS'Z'"):ocsf.time}
              four %{date("yyyy-MM-dd'T'HH:mm:ss.SSSS'Z'"):ocsf.time}
              three %{date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"):ocsf.time}
              two %{date("yyyy-MM-dd'T'HH:mm:ss.SS'Z'"):ocsf.time}
              one %{date("yyyy-MM-dd'T'HH:mm:ss.S'Z'"):ocsf.time}
              zero %{date("yyyy-MM-dd'T'HH:mm:ss'Z'"):ocsf.time}
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: "1"
          target: ocsf.severity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.severity_id` to `ocsf.severity_id`
          enabled: true
          sources:
            - ocsf.severity_id
          sourceType: attribute
          target: ocsf.severity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: "Informational"
          target: ocsf.severity
          replaceMissing: false
        - type: attribute-remapper
          name: Map `client_ip`, `src_ip` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - client_ip
            - src_ip
          sourceType: attribute
          target: ocsf.src_endpoint.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `success` to `ocsf.status`
          enabled: true
          sources:
            - success
          sourceType: attribute
          target: ocsf.status
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: Status mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.status:true"
              name: "1"
            - filter:
                query: "@ocsf.status:false"
              name: "2"
          target: ocsf.status_id
        - type: category-processor
          name: Status name mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.status:true"
              name: "Success"
            - filter:
                query: "@ocsf.status:false"
              name: "Failure"
          target: ocsf.status
    - type: pipeline
      name: OCSF sub pipeline for class Account Change [3001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(admin_create OR admin_delete OR admin_password_reset_request OR admin_update OR admin_totp_start_enrollment OR admin_totp_finish_enrollment OR admin_totp_disable OR totp_start_enrollment OR totp_finish_enrollment OR totp_delete_enrollment OR user_create OR user_delete OR user_lockout OR user_mfa_exclusion_expired OR user_password_expired OR user_password_reset_request OR user_password_warning_email OR user_update OR user_password_change OR user_activated OR user_activation_email OR user_password_set OR user_unlocked OR user_suspended OR user_unsuspended OR admin_password_change OR user_create_provision OR user_update_provision OR user_delete_provision OR admin_unsuspend OR admin_lockout OR admin_suspended)"
      processors:
        - type: attribute-remapper
          name: Map `ocsf.metadata.event_code` to `ocsf.activity_name`
          enabled: true
          sources:
            - ocsf.metadata.event_code
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:(admin_create OR user_create OR user_create_provision)"
              name: "1"
            - filter:
                query: "@ocsf.metadata.event_code:(admin_password_change OR user_password_change)"
              name: "3"
            - filter:
                query: "@ocsf.metadata.event_code:(admin_password_reset_request OR user_password_reset_request)"
              name: "4"
            - filter:
                query: "@ocsf.metadata.event_code:(admin_delete OR user_delete)"
              name: "6"
            - filter:
                query: "@ocsf.metadata.event_code:(user_lockout OR admin_lockout)"
              name: "9"
            - filter:
                query: "@ocsf.metadata.event_code:*"
              name: "99"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@ocsf.activity_id:1"
              name: "Create"
            - filter:
                query: "@ocsf.activity_id:3"
              name: "Password Change"
            - filter:
                query: "@ocsf.activity_id:4"
              name: "Password Reset"
            - filter:
                query: "@ocsf.activity_id:6"
              name: "Delete"
            - filter:
                query: "@ocsf.activity_id:9"
              name: "Lock"
          target: ocsf.activity_name
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Identity & Access Management"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3001"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "Account Change"
          target: ocsf.class_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `initiated_by.user_id`, `initiated_by.id` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - initiated_by.user_id
            - initiated_by.id
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `initiated_by.type` to `ocsf.actor.user.type`
          enabled: true
          sources:
            - initiated_by.type
          sourceType: attribute
          target: ocsf.actor.user.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: User type mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.actor.user.type:user"
              name: "1"
            - filter:
                query: "@ocsf.actor.user.type:admin"
              name: "2"
            - filter:
                query: "@ocsf.actor.user.type:*"
              name: "99"
          target: ocsf.actor.user.type_id
        - type: attribute-remapper
          name: Map `ocsf.actor.user.type_id` to `ocsf.actor.user.type_id`
          enabled: true
          sources:
            - ocsf.actor.user.type_id
          sourceType: attribute
          target: ocsf.actor.user.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: User type name mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.actor.user.type:user"
              name: "User"
            - filter:
                query: "@ocsf.actor.user.type:admin"
              name: "Admin"
          target: ocsf.actor.user.type
        - type: attribute-remapper
          name: Map `initiated_by.email` to `ocsf.actor.user.email_addr`
          enabled: true
          sources:
            - initiated_by.email
          sourceType: attribute
          target: ocsf.actor.user.email_addr
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ocsf.actor.user.email_addr to extract user name
          enabled: true
          source: ocsf.actor.user.email_addr
          samples:
            - "user@example.com"
          grok:
            supportRules: ""
            matchRules: extract_username_from_email %{regex("[^@]*"):ocsf.actor.user.name}@%{regex("[^@]*")}
        - type: attribute-remapper
          name: Map `initiated_by.username` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - initiated_by.username
          sourceType: attribute
          target: ocsf.actor.user.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `resource.username`, `username` to `ocsf.user.name`
          enabled: true
          sources:
            - resource.username
            - username
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(admin_login_attempt OR user_login_attempt OR radius_auth OR sso_auth OR login_attempt)"
      processors:
        - type: string-builder-processor
          name: activity_id
          enabled: true
          template: "1"
          target: ocsf.activity_id
          replaceMissing: false
        - type: string-builder-processor
          name: activity_name
          enabled: true
          template: "Logon"
          target: ocsf.activity_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Identity & Access Management"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3002"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "Authentication"
          target: ocsf.class_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `service` to `ocsf.service.name`
          enabled: true
          sources:
            - service
          sourceType: attribute
          target: ocsf.service.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `initiated_by.user_id`, `initiated_by.id` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - initiated_by.user_id
            - initiated_by.id
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `initiated_by.type` to `ocsf.actor.user.type`
          enabled: true
          sources:
            - initiated_by.type
          sourceType: attribute
          target: ocsf.actor.user.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: User type mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.actor.user.type:user"
              name: "1"
            - filter:
                query: "@ocsf.actor.user.type:admin"
              name: "2"
            - filter:
                query: "@ocsf.actor.user.type:*"
              name: "99"
          target: ocsf.actor.user.type_id
        - type: attribute-remapper
          name: Map `ocsf.actor.user.type_id` to `ocsf.actor.user.type_id`
          enabled: true
          sources:
            - ocsf.actor.user.type_id
          sourceType: attribute
          target: ocsf.actor.user.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: User type name mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.actor.user.type:user"
              name: "User"
            - filter:
                query: "@ocsf.actor.user.type:admin"
              name: "Admin"
          target: ocsf.actor.user.type
        - type: attribute-remapper
          name: Map `initiated_by.email` to `ocsf.actor.user.email_addr`
          enabled: true
          sources:
            - initiated_by.email
          sourceType: attribute
          target: ocsf.actor.user.email_addr
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ocsf.actor.user.email_addr to extract user name
          enabled: true
          source: ocsf.actor.user.email_addr
          samples:
            - "user@example.com"
          grok:
            supportRules: ""
            matchRules: extract_username_from_email %{regex("[^@]*"):ocsf.actor.user.name}@%{regex("[^@]*")}
        - type: attribute-remapper
          name: Map `initiated_by.username` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - initiated_by.username
          sourceType: attribute
          target: ocsf.actor.user.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: true
        - type: category-processor
          name: MFA mapping
          enabled: true
          categories:
            - filter:
                query: "@mfa:true"
              name: "true"
            - filter:
                query: "@mfa:false"
              name: "false"
          target: ocsf.is_mfa
        - type: grok-parser
          name: Convert `ocsf.is_mfa` to boolean type
          enabled: true
          source: ocsf.is_mfa
          samples:
            - "true"
            - "false"
          grok:
            supportRules: ""
            matchRules: |
              convert_to_boolean %{boolean("true","false"):ocsf.is_mfa}
        - type: attribute-remapper
          name: Map `ocsf.auth_protocol_id` to `ocsf.auth_protocol_id`
          enabled: true
          sources:
            - ocsf.auth_protocol_id
          sourceType: attribute
          target: ocsf.auth_protocol_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `resource.username`, `username`, `ocsf.actor.user.name` to `ocsf.user.name`
          enabled: true
          sources:
            - resource.username
            - username
            - ocsf.actor.user.name
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: OCSF sub pipeline for class User Access Management [3005]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(user_group_admin_grant OR user_admin_granted)"
      processors:
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:(user_group_admin_grant OR user_admin_granted)"
              name: "1"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@ocsf.activity_id:1"
              name: "Assign Privileges"
          target: ocsf.activity_name
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Identity & Access Management"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3005"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "User Access Management"
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[host]"
          target: ocsf.metadata.profiles
