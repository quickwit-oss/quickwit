id: crest_data_systems_cyberark_pam
metric_id: crest-data-systems-cyberark-pam
backend_only: false
facets:
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: CyberArk PAM Batch
    path: cyberark.pam.batch
    source: tag
    type: string
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: Event ID
    path: cyberark.pam.event_id
    source: log
    type: string
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: Host
    path: cyberark.pam.host
    source: tag
    type: string
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: Safe Name
    path: cyberark.pam.safe_name
    source: log
    type: string
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: Severity
    path: cyberark.pam.severity
    source: log
    type: string
  - facetType: list
    groups:
      - Crest Data Systems CyberArk PAM
    name: Source Action
    path: cyberark.pam.source_action
    source: log
    type: string
pipeline:
  type: pipeline
  name: CyberArk PAM by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_cyberark_pam
  processors:
    - type: grok-parser
      name: Parsing CyberArk PAM Logs
      enabled: true
      source: message
      samples:
        - <5>1 2023-07-12T09:10:54Z VAULT
          CEF:0|Cyber-Ark|Vault|12.6.0006|357|Monitor FW rules
          start|5|act=Monitor FW rules start suser=Batch fname= dvc=
          shost=0.0.0.0 dhost= duser= externalId= app= reason=
          cs1Label="Affected User Name" cs1= cs2Label="Safe Name" cs2=
          cs3Label="Device Type" cs3= cs4Label="Database" cs4= cs5Label="Other
          info" cs5= cn1Label="Request Id" cn1= cn2Label="Ticket Id" cn2=  msg=
      grok:
        supportRules: log_prefix <%{word:}>%{word:} (%{date("MMM d
          HH:mm:ss"):}|%{date("yyyy-MM-dd'T'HH:mm:ssZ"):timestamp})
          (%{notSpace:})
          (%{word:}):(%{word:})\|%{regex("[^|]*"):vendor.name}\|%{word:vendor.product.name}\|%{regex("[0-9.]*"):vendor.product.version}\|%{word:event_id}\|%{regex("[a-zA-Z:,
          ]*"):action}\|%{word:severity}\|
        matchRules: rule1 %{log_prefix}%{data::keyvalue("=", "\\]\\[{}\"\"
          :;,/!''\\(\\)*~#&$%^?\\\\")}
    - name: Lookup for `event_id` to `source_type`
      enabled: true
