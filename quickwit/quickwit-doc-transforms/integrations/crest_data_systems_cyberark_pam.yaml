    - name: Lookup for `severity` to `cyberark.pam.severity`
      enabled: true
      source: severity
      target: cyberark.pam.severity
      lookupTable: |-
        1,Informational
        2,Informational
        3,Informational
        4,Medium
        5,Medium
        6,High
        7,High
        8,High
        9,Critical
        10,Critical
      type: lookup-processor
    - type: attribute-remapper
      name: Map `event_id` to `cyberark.pam.event_id`
      enabled: true
      sources:
        - event_id
      sourceType: attribute
      target: cyberark.pam.event_id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cs2`, `safe-name` to `cyberark.pam.safe_name`
      enabled: true
      sources:
        - cs2
        - safe-name
      sourceType: attribute
      target: cyberark.pam.safe_name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cs5` to `cyberark.pam.source_action`
      enabled: true
      sources:
        - cs5
      sourceType: attribute
      target: cyberark.pam.source_action
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: category-processor
      name: CyberArk PAM Severity Processor
      enabled: true
      categories:
        - filter:
            query: "@cyberark.pam.severity:Informational"
          name: info
        - filter:
            query: "@cyberark.pam.severity:Critical"
          name: critical
        - name: warning
          filter:
            query: "@cyberark.pam.severity:Medium"
        - name: error
          filter:
            query: "@cyberark.pam.severity:High"
      target: status
    - type: status-remapper
      name: Define `status` as the official status of the log
      enabled: true
      sources:
        - status
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      preserveSource: true
      enabled: true
      sources:
        - timestamp
