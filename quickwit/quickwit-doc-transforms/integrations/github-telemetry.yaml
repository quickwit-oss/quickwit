id: github-telemetry
backend_only: false
installation_sources:
  - github-telemetry
  - github.audit.streaming
facets:
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Github
    name: Github Workflow ID
    path: github.workflow.id
    source: log
  - groups:
      - Github
    name: Github Organization
    path: github.org
    source: log
  - groups:
      - Event
    name: Action
    path: evt.action
    source: log
  - groups:
      - Github
    name: Github Team
    path: github.team
    source: log
  - groups:
      - Github
    name: Github Repository
    path: github.repository
    source: log
  - groups:
      - Github
    name: Github Workflow Run ID
    path: github.workflow.run.id
    source: log
  - groups:
      - Github
    name: Github Transport Protocol Name
    path: github.transport_protocol_name
    source: log
  - groups:
      - Github
    name: Github Name
    path: github.name
    source: log
  - groups:
      - Github
    name: Github Visibility
    path: github.visibility
    source: tag
  - groups:
      - Github
    name: Github Actor
    path: github.actor
    source: log
  - groups:
      - Github
    name: Actor Location Country Code
    path: actor_location.country_code
    source: log
pipeline:
  type: pipeline
  name: Github Telemetry
  enabled: true
  filter:
    query: source:(github-telemetry OR github.audit.streaming)
  processors:
    - type: attribute-remapper
      name: Map `event` to `evt.category`
      enabled: true
      sources:
        - event
      sourceType: attribute
      target: evt.category
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `_document_id` to `github.document.id`
      enabled: true
      sources:
        - _document_id
      sourceType: attribute
      target: github.document.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user` to `usr.name`
      enabled: true
      sources:
        - user
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user_id` to `usr.id`
      enabled: true
      sources:
        - user_id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `team` to `github.team`
      enabled: true
      sources:
        - team
      sourceType: attribute
      target: github.team
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `action` to `evt.action`
      enabled: true
      sources:
        - action
      sourceType: attribute
      target: evt.action
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actor` to `github.actor`
      enabled: true
      sources:
        - actor
      sourceType: attribute
      target: github.actor
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `conclusion` to `evt.outcome`
      enabled: true
      sources:
        - conclusion
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: message-remapper
      name: Define `Message` as the official message of the log
      enabled: true
      sources:
        - Message
    - type: attribute-remapper
      name: Map `org` to `github.org`
      enabled: true
      sources:
        - org
      sourceType: attribute
      target: github.org
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `transport_protocol_name` to `github.transport_protocol_name`
      enabled: true
      sources:
        - transport_protocol_name
      sourceType: attribute
      target: github.transport_protocol_name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `repo` to `github.repository`
      enabled: true
      sources:
        - repo
      sourceType: attribute
      target: github.repository
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `name` to `github.name`
      enabled: true
      sources:
        - name
      sourceType: attribute
      target: github.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `visibility` to `github.visibility`
      enabled: true
      sources:
        - visibility
      sourceType: attribute
      target: github.visibility
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `workflow_id` to `github.workflow.id`
      enabled: true
      sources:
        - workflow_id
      sourceType: attribute
      target: github.workflow.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `workflow_run_id` to `github.workflow.run.id`
      enabled: true
      sources:
        - workflow_run_id
      sourceType: attribute
      target: github.workflow.run.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: attribute-remapper
      name: Map `user_agent` to `http.useragent`
      enabled: true
      sources:
        - user_agent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: user-agent-parser
      name: ""
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
      combineVersionDetails: false
    - type: attribute-remapper
      name: Map `actor_ip` to `network.client.ip`
      enabled: true
      sources:
        - actor_ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: attribute-remapper
          name: Map `actor` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - actor
          sourceType: attribute
          target: ocsf.actor.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_id` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - actor_id
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_session` to `ocsf.actor.session.uid`
          enabled: true
          sources:
            - actor_session
          sourceType: attribute
          target: ocsf.actor.session.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `external_identity_nameid` to `ocsf.actor.user.email_addr`
          enabled: true
          sources:
            - external_identity_nameid
          sourceType: attribute
          target: ocsf.actor.user.email_addr
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `issuer` to `ocsf.actor.session.issuer`
          enabled: true
          sources:
            - issuer
          sourceType: attribute
          target: ocsf.actor.session.issuer
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `org` to `ocsf.actor.user.account.name`
          enabled: true
          sources:
            - org
          sourceType: attribute
          target: ocsf.actor.user.account.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `org_id` to `ocsf.actor.user.account.uid`
          enabled: true
          sources:
            - org_id
          sourceType: attribute
          target: ocsf.actor.user.account.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `action` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `_document_id` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - _document_id
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Github Audit Log
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: GitHub
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: 1.3.0
          target: ocsf.metadata.version
        - type: attribute-remapper
          name: Map `@timestamp` to `ocsf.time`
          enabled: true
          sources:
            - "@timestamp"
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `user_agent` to `ocsf.http_request.user_agent`
          enabled: true
          sources:
            - "user_agent"
          sourceType: attribute
          target: ocsf.http_request.user_agent
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `method` to `ocsf.http_request.http_method`
          enabled: true
          sources:
            - "method"
          sourceType: attribute
          target: ocsf.http_request.http_method
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `referrer` to `ocsf.http_request.referrer`
          enabled: true
          sources:
            - "referrer"
          sourceType: attribute
          target: ocsf.http_request.referrer
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `url` to `ocsf.http_request.url.url_string`
          enabled: true
          sources:
            - "url"
          sourceType: attribute
          target: ocsf.http_request.url.url_string
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `url_path` to `ocsf.http_request.url.url_path`
          enabled: true
          sources:
            - "url_path"
          sourceType: attribute
          target: ocsf.http_request.url.url_path
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `query_string` to `ocsf.http_request.url.query_string`
          enabled: true
          sources:
            - "query_string"
          sourceType: attribute
          target: ocsf.http_request.url.query_string
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_ip` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - "actor_ip"
          sourceType: attribute
          target: ocsf.src_endpoint.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_location.city` to `ocsf.src_endpoint.location.city`
          enabled: true
          sources:
            - "actor_location.city"
          sourceType: attribute
          target: ocsf.src_endpoint.location.city
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_location.country_code` to `ocsf.src_endpoint.location.country`
          enabled: true
          sources:
            - "actor_location.country_code"
          sourceType: attribute
          target: ocsf.src_endpoint.location.country
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor_location.postal_code` to `ocsf.src_endpoint.location.postal_code`
          enabled: true
          sources:
            - "actor_location.postal_code"
          sourceType: attribute
          target: ocsf.src_endpoint.location.postal_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: GitHub OCSF sub pipeline for class Account Change [3001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@action:(business.revoke_external_identity OR business.revoke_sso_session OR org.block_user OR org.invite_member OR org.invite_to_business OR org.unblock_user OR organization_role.assign OR organization_role.create OR organization_role.destroy OR role.create OR role.destroy OR two_factor_authentication.add_factor OR two_factor_authentication.disabled OR two_factor_authentication.enabled OR user.block_user OR user.change_password OR user.create OR user.delete OR user.destroy OR user.reset_password OR user.suspend OR user.unblock_user OR user.unsuspend)"
      processors:
        - type: attribute-remapper
          name: Map `action` to `ocsf.activity_name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@action:(organization_role.create OR role.create OR user.create)"
              name: "1"
            - filter:
                query: "@action:(user.change_password)"
              name: "3"
            - filter:
                query: "@action:(user.reset_password)"
              name: "4"
            - filter:
                query: "@action:(organization_role.destroy OR role.destroy OR user.delete OR user.destroy)"
              name: "6"
            - filter:
                query: "@action:(organization_role.assign)"
              name: "7"
            - filter:
                query: "@action:(two_factor_authentication.add_factor)"
              name: "10"
            - filter:
                query: "@action:*"
              name: "99"
          target: ocsf.activity_id
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@action:(organization_role.create OR role.create OR user.create)"
              name: "Create"
            - filter:
                query: "@action:(user.change_password)"
              name: "Password Change"
            - filter:
                query: "@action:(user.reset_password)"
              name: "Password Reset"
            - filter:
                query: "@action:(organization_role.destroy OR role.destroy OR user.delete OR user.destroy)"
              name: "Delete"
            - filter:
                query: "@action:(organization_role.assign)"
              name: "Attach Policy"
            - filter:
                query: "@action:(two_factor_authentication.add_factor)"
              name: "MFA Factor Enable"
          target: ocsf.activity_name
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3001"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Account Change
          target: ocsf.class_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `user` to `ocsf.user.name`
          enabled: true
          sources:
            - "user"
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `user_id` to `ocsf.user.uid`
          enabled: true
          sources:
            - "user_id"
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: GitHub OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@action:(business.recovery_code_failed OR business.recovery_code_used OR business.sso_response OR org.sso_response OR user.failed_login OR user.login OR user.logout)"
      processors:
        - type: attribute-remapper
          name: Map `action` to `ocsf.activity_name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@action:(business.sso_response OR org.sso_response OR user.login)"
              name: "1"
            - filter:
                query: "@action:(user.logout)"
              name: "2"
            - filter:
                query: "@action:*"
              name: "99"
          target: ocsf.activity_id
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@action:(business.sso_response OR org.sso_response OR user.login)"
              name: "Logon"
            - filter:
                query: "@action:(user.logout)"
              name: "Logoff"
          target: ocsf.activity_name
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3002"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Authentication
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add service name
          enabled: true
          template: GitHub
          target: ocsf.service.name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `user` to `ocsf.user.name`
          enabled: true
          sources:
            - "user"
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `user_id` to `ocsf.user.uid`
          enabled: true
          sources:
            - "user_id"
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: GitHub OCSF sub pipeline for class Entity Management [3004]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@action:(business.advanced_security_policy_update OR business.create OR business.delete OR org.create OR org.delete OR org.rename OR organization_role.update OR role.update) @org:*"
      processors:
        - type: attribute-remapper
          name: Map `action` to `ocsf.activity_name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@action:(business.create OR org.create)"
              name: "1"
            - filter:
                query: "@action:(business.advanced_security_policy_update OR org.rename OR organization_role.update OR role.update)"
              name: "3"
            - filter:
                query: "@action:(business.delete OR org.delete)"
              name: "4"
            - filter:
                query: "@action:*"
              name: "99"
          target: ocsf.activity_id
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@action:(business.create OR org.create)"
              name: "Create"
            - filter:
                query: "@action:(business.advanced_security_policy_update OR org.rename OR organization_role.update OR role.update)"
              name: "Update"
            - filter:
                query: "@action:(business.delete OR org.delete)"
              name: "Delete"
          target: ocsf.activity_name
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3004"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Entity Management
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[host]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[date,time]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: attribute-remapper
          name: Map `org` to `ocsf.entity.name`
          enabled: true
          sources:
            - "org"
          sourceType: attribute
          target: ocsf.entity.name
          targetType: attribute
