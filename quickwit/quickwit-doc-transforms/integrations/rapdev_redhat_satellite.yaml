id: rapdev_redhat_satellite
metric_id: rapdev-redhat-satellite
backend_only: false
facets:
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Web Access
    name: Method
    path: http.method
    source: log
  - groups:
      - Web Access
    name: Status Code
    path: http.status_code
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Source Code
    name: Thread Name
    path: logger.thread_name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Candlepin Request Target Organization
    path: candlepin.request.org
    source: log
    type: string
  - facetType: range
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Foreman ActiveRecored Duration
    path: foreman.activerecord
    source: log
    type: double
    unit:
      family: time
      name: millisecond
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Foreman Process Status
    path: foreman.process_status
    source: log
    type: string
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Foreman Processor
    path: foreman.processor
    source: log
    type: string
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Foreman Views Duration
    path: foreman.views
    source: log
    type: double
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Goferd Connection Status
    path: goferd.connection_status
    source: log
    type: string
  - facetType: list
    groups:
      - RapDev RedHat Satellite
    name: RedHat Satellite Pulp Task Name
    path: pulp.task.name
    source: log
    type: string
pipeline:
  type: pipeline
  name: RedHat Satellite by RapDev
  enabled: true
  filter:
    query: source:rapdev_redhat_satellite
  processors:
    - type: pipeline
      name: Foreman Pipeline
      enabled: true
      filter:
        query: "service:foreman"
      processors:
        - type: grok-parser
          name: Foreman Grok Parser
          enabled: true
          source: message
          samples:
            - 2024-05-10T19:31:50 [I|app|d7a18a1c]   Rendering
              /opt/theforeman/tfm/root/usr/share/gems/gems/katello-3.14.0.32/app/views/katello/api/v2/repository_sets/index.json.rabl
              within katello/api/v2/layouts/collection
            - "2024-05-10T19:32:47 [I|app|adce461d] Completed 200 OK in 1298ms
              (Views: 857.3ms | ActiveRecord: 313.1ms)"
            - 2024-05-10T21:22:23 [I|app|cd1444bb]   Rendering
              api/v2/ping/ping.json.rabl
            - 2024-05-10T19:46:34 [I|app|6cd48b5b]   Rendered
              /opt/theforeman/tfm/root/usr/share/gems/gems/katello-3.14.0.32/app/views/katello/api/v2/repository_sets/index.json.rabl
              within katello/api/v2/layouts/collection (1572.5ms)
            - "2024-05-11T14:15:09 [I|app|9b9196e9] Completed 404 Not Found in
              147ms (Views: 1.7ms | ActiveRecord: 19.6ms)"
          grok:
            supportRules: >-
              _timestamp %{date("yyyy-MM-dd'T'HH:mm:ss"):timestamp}

              _level_context \[%{word:log.level}\|%{word:log.context}\|%{word:log.id}\]

              _prefix %{_timestamp} %{_level_context}

              _process_status %{word:foreman.process_status}

              _params %{data:http.parameters:rubyhash}

              _render (\s+)%{_process_status} %{notSpace:foreman.template_file}(?> within %{notSpace:foreman.layout})?
            matchRules: >-
              render_rule %{_prefix} %{_render}(?> \(%{number:foreman.duration}ms\))?

              completed_rule %{_prefix} %{_process_status} %{integer:http.status_code}(?: (?:%{word}|Internal Server Error|Not Found))? in %{number:foreman.duration}ms \((?>Views: %{number:foreman.views}ms \| )?ActiveRecord: %{number:foreman.activerecord}ms\)

              processing_rule %{_prefix} %{_process_status} by %{notSpace:foreman.processor}.*

              user_rule %{_prefix} (?>Current user set to |%{_process_status} user )?%{word:foreman.user.name}(\s)?\(%{data:foreman.user.scope}\)

              api_rule %{_prefix} %{_process_status} %{word:http.method} "%{notSpace:http.url_details.path}" for %{ipOrHost:network.client.ip}.*

              params_rule %{_prefix}\s+Parameters: %{_params}

              activerecord %{_prefix} %{data:error.message}
        - type: url-parser
          name: Parse `http.url_details.path`
          enabled: true
          sources:
            - http.url_details.path
          target: http.url_details
          normalizeEndingSlashes: false
        - type: attribute-remapper
          name: Map `foreman.duration` to `duration`
          enabled: true
          sources:
            - foreman.duration
          sourceType: attribute
          target: duration
          targetType: attribute
          targetFormat: double
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Candlepin Pipeline
      enabled: true
      filter:
        query: "service:candlepin"
      processors:
        - type: grok-parser
          name: Candlepin Grok Parser
          enabled: true
          source: message
          samples:
            - '2024-05-15 19:23:12,039 [thread=http-bio-8443-exec-10] 
              [req=81733d7e-6872-4ec0-9428-cf343a0c8f79, org=Default_Organization, csid=] 
              INFO  org.candlepin.common.filter.LoggingFilter - Response: status=200, 
              content-type="application/json", time=8'
            - "2024-05-10 21:56:39,839 [thread=http-bio-8443-exec-4]
              [req=64157f39-1aee-47c7-8c1e-40c6deeba6e6, org=, csid=]
              INFO  org.candlepin.common.filter.LoggingFilter - Request:
              verb=GET, uri=/candlepin/status"
            - "2024-05-10 22:05:00,039 [thread=QuartzScheduler_Worker-1]
              [job=SweepBarJob-cb28be9f-146e-4ede-ad0a-4844755bb050, org=,
              csid=] INFO  org.candlepin.pinsetter.tasks.KingpinJob - Job
              completed: time=5"
            - "2024-05-14 14:40:00,019 [thread=QuartzScheduler_Worker-10] 
              [job=SweepBarJob-cb28be9f-146e-4ede-ad0a-4844755bb050, org=, csid=] 
              INFO  org.candlepin.pinsetter.tasks.KingpinJob - Starting job: 
              org.candlepin.pinsetter.tasks.SweepBarJob"
          grok:
            supportRules: |-
              _timestamp %{date("yyyy-MM-dd HH:mm:ss,SSS"):timestamp}
              _thread \[%{notSpace:logger.thread_name}\]
              _req \[%{data:candlepin.request:keyvalue}\]
              _level %{word:log.level}
              _logger %{notSpace:logger.name}
              _prefix %{_timestamp} %{_thread} %{_req} %{_level}\s+%{_logger}
            matchRules: >-
              response_rule %{_prefix} - %{word:http_type}: %{data:http:keyvalue("=", "/\"", ", ")}

              job_completed_rule %{_prefix} - Job completed: %{data::keyvalue}

              starting_job_rule %{_prefix} - Starting job: %{notSpace:candlepin.request.job_name}
        - type: attribute-remapper
          name: Map `http.verb` to `http.method`
          enabled: true
          sources:
            - http.verb
          sourceType: attribute
          target: http.method
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `http.uri` to `http.url_details.path`
          enabled: true
          sources:
            - http.uri
          sourceType: attribute
          target: http.url_details.path
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `http.status` to `http.status_code`
          enabled: true
          sources:
            - http.status
          sourceType: attribute
          target: http.status_code
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `http.time`, `time` to `duration`
          enabled: true
          sources:
            - http.time
            - time
          sourceType: attribute
          target: duration
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `candlepin.request.req` to `candlepin.request.id`
          enabled: true
          sources:
            - candlepin.request.req
          sourceType: attribute
          target: candlepin.request.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `http_type` to `http.type`
          enabled: true
          sources:
            - http_type
          sourceType: attribute
          target: http.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `logger.thread` to `logger.thread_name`
          enabled: true
          sources:
            - logger.thread
          sourceType: attribute
          target: logger.thread_name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Pulp Pipeline
      enabled: true
      filter:
        query: "service:pulp"
      processors:
        - type: grok-parser
          name: Pulp Grok Parser
          enabled: true
          source: message
          samples:
            - "May 11 17:47:43 ip-172-31-6-109 pulp: kombu.transport.qpid:INFO:
              Connected to qpid with SASL mechanism ANONYMOUS"
            - "May 11 17:48:35 ip-172-31-6-109 pulp:
              celery.worker.strategy:INFO: Received task:
              pulp.server.controllers.repository.download_deferred[5b261258-f6a\
              1-4548-a54d-ad41f5be7d3f]"
            - "May 11 17:58:35 ip-172-31-6-109 pulp: celery.app.trace:INFO:
              [e3e200dc] Task
              pulp.server.controllers.repository.download_deferred[e3e200dc-51b\
              9-42b4-b3a9-a2aabf13ccf5] succeeded in 0.0168318429496s: None"
            - "May 11 17:58:35 ip-172-31-6-109 pulp: celery.beat:INFO:
              Scheduler: Sending due task download_deferred_content
              (pulp.server.controllers.repository.queue_download_deferred)"
          grok:
            supportRules: >-
              _timestamp %{date("MMM dd HH:mm:ss"):timestamp}

              _client (%{hostname:pulp.client.host}|%{ip:pulp.client.ip})

              _service %{word:service}:

              _logger %{notSpace:logger.name}:%{word:log.level}:(?> \[%{notSpace:logger.thread_name}\])?

              _task %{notSpace:pulp.task.name}\[%{uuid:pulp.task.id}\]

              _prefix %{_timestamp} %{_client} %{_service}
            matchRules: >-
              received_task_rule %{_prefix} %{_logger} Received task: %{_task}

              succeeded_task_rule %{_prefix} %{_logger} Task %{_task} succeeded in %{number:pulp.task.duration}s.*

              sending_task_rule %{_prefix} %{_logger} %{word:pulp.component}: Sending due task %{word:pulp.task.short_name} \(%{notSpace:pulp.task.name}\)

              message_catch_rule %{_prefix} %{_logger} %{data:message}
        - type: attribute-remapper
          name: Map `pulp.task.duration` to `duration`
          enabled: true
          sources:
            - pulp.task.duration
          sourceType: attribute
          target: duration
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `pulp.client.ip` to `network.client.ip`
          enabled: true
          sources:
            - pulp.client.ip
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Goferd Pipeline
      enabled: true
      filter:
        query: "service:goferd"
      processors:
        - type: grok-parser
          name: Goferd Grok Parser
          enabled: true
          source: message
          samples:
            - "May 11 19:20:21 ip-172-31-92-238 goferd:
              [INFO][pulp.agent.548ed552-5831-470e-b87a-9778defdd4b5]
              gofer.messaging.adapter.connect:30 - connected:
              proton+amqps://ip-172-31-6-109.ec2.internal:5647"
            - "May 11 19:21:07 ip-172-31-92-238 goferd: [WARNING][MainThread]
              gofer.agent.plugin:647 - plugin:demo, DISABLED"
            - "May 11 18:11:45 ip-172-31-92-238 goferd: [INFO][worker-0]
              gofer.messaging.adapter.proton.connection:87 - open: URL:
              amqps://ip-172-31-6-109.ec2.internal:5647|SSL: ca:
              /etc/rhsm/ca/katello-default-ca.pem|key: None|certificate:
              /etc/pki/consumer/bundle.pem|host-validation: None"
            - "May 11 18:35:14 ip-172-31-92-238 goferd: [INFO][MainThread]
              rhsm.connection:924 - Connection built:
              host=ip-172-31-6-109.ec2.internal port=443 handler=/rhsm
              auth=identity_cert ca_dir=/etc/rhsm/ca/ insecure=False"
          grok:
            supportRules: >-
              _timestamp %{date("MMM dd HH:mm:ss"):timestamp}

              _client (%{hostname:goferd.client.host}|%{ip:goferd.client.ip})

              _service %{word:service}:

              _logger \[%{word:log.level}\]\[%{notSpace:logger.thread_name}\] %{notSpace:logger.name}:%{integer:logger.line}

              _conn_status %{word:goferd.connection_status}

              _opened %{notSpace:goferd.connection.protocol}://(%{hostname:goferd.connection.host}|%{ip:goferd.connection.ip}):%{port:goferd.connection.port}

              _open_url %{data:goferd.connection:keyvalue(": ", ":/", "", "|")}

              _connection_built %{data:goferd.connection:keyvalue("=", "/")}

              _prefix %{_timestamp} %{_client} %{_service}
            matchRules: >-
              opened_rule %{_prefix} %{_logger} - %{_conn_status}: %{_opened}

              attached_rule %{_prefix} %{_logger} - plugin:%{word:goferd.plugin}, %{_conn_status}(?> => %{notSpace:goferd.agent})?

              connection_built_rule %{_prefix} %{_logger} - Connection %{_conn_status}: %{_connection_built}

              open_url_rule %{_prefix} %{_logger} - %{_conn_status}: %{_open_url}
        - type: attribute-remapper
          name: Map `goferd.client.ip` to `network.client.ip`
          enabled: true
          sources:
            - goferd.client.ip
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `goferd.destination.ip` to `network.destination.ip`
          enabled: true
          sources:
            - goferd.destination.ip
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: message-remapper
      name: Define `message` as the official message of the log
      enabled: true
      sources:
        - message
    - type: status-remapper
      name: Define `log.level` as the official status of the log
      enabled: true
      sources:
        - log.level
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
