id: transitgateway
metric_id: amazon-transit-gateway
backend_only: false
facets:
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - AWS Transit Gateway
    name: Account ID
    path: transit_gateway.account_id
    source: log
  - groups:
      - AWS Transit Gateway
    name: Transit Gateway ID
    path: transit_gateway.id
    source: log
  - groups:
      - AWS Transit Gateway
    name: Transit Gateway Attachment
    path: transit_gateway.attachment
    source: log
  - groups:
      - AWS Transit Gateway
    name: Transit Gateway Pair Attachment
    path: transit_gateway.pair-attachement
    source: log
  - groups:
      - AWS Transit Gateway
    name: Region
    path: transit_gateway.region
    source: log
  - groups:
      - AWS Transit Gateway
    name: Network Direction
    path: network.direction
    source: log
  - groups:
      - AWS Transit Gateway
    name: Network TCP Flags
    path: network.tcp_flags
    source: log
  - groups:
      - AWS Transit Gateway
    name: Packets lost - black hole
    path: network.packets_lost.black_hole
    source: log
  - groups:
      - AWS Transit Gateway
    name: Packets lost - TTL expired
    path: network.packets_lost.ttl_expired
    source: log
  - groups:
      - AWS Transit Gateway
    name: Packets lost - MTU exceeded
    path: network.packets_lost.mtu_exceeded
    source: log
  - groups:
      - AWS Transit Gateway
    name: Packets lost - no route
    path: network.packets_lost.no_route
    source: log
  - groups:
      - AWS Transit Gateway
    name: Packets
    path: network.packets
    source: log
  - facetType: range
    groups:
      - Web Access
    name: Bytes Written
    path: network.bytes_written
    source: log
    type: double
    unit:
      family: bytes
      name: byte
  - groups:
      - AWS Transit Gateway
    name: Start Time
    path: network.interval.start
    source: log
  - groups:
      - AWS Transit Gateway
    name: End Time
    path: network.interval.end
    source: log
  - groups:
      - AWS Transit Gateway
    name: Destination Availability Zone
    path: network.destination.availability_zone
    source: log
  - groups:
      - AWS Transit Gateway
    name: Destination Subnet
    path: network.destination.subnet
    source: log
  - groups:
      - AWS Transit Gateway
    name: Destination Account ID
    path: network.destination.account_id
    source: log
  - groups:
      - AWS Transit Gateway
    name: Destination ENI
    path: network.destination.eni
    source: log
  - groups:
      - AWS Transit Gateway
    name: Destination VPC
    path: network.destination.vpc
    source: log
  - groups:
      - AWS Transit Gateway
    name: Client Availability Zone
    path: network.client.availability_zone
    source: log
  - groups:
      - AWS Transit Gateway
    name: Client Subnet
    path: network.client.subnet
    source: log
  - groups:
      - AWS Transit Gateway
    name: Client Account ID
    path: network.client.account_id
    source: log
  - groups:
      - AWS Transit Gateway
    name: Client ENI
    path: network.client.eni
    source: log
  - groups:
      - AWS Transit Gateway
    name: Client VPC
    path: network.client.vpc
    source: log
pipeline:
  type: pipeline
  name: AWS Transit Gateway Flow Logs
  enabled: true
  filter:
    query: source:transitgateway
  processors:
    - type: grok-parser
      name: Parsing Transit Gateway flow logs
      enabled: true
      source: message
      samples:
        - 6 TransitGateway 601427279990 tgw-004f004c35544e4bb tgw-attach-04fd0b1f746624ca9 601427279990 601427279990 vpc-0a43eeec01705c3bb vpc-08254c48dd910e268 subnet-071d59121d65ba614 subnet-080fcc1cf7ce9117b eni-09d43c8e26c74c6ed eni-065bdf3463532c3d0 use1-az1 use1-az2 tgw-attach-0bc5327361aef1ca2 10.1.0.50 10.2.0.50 60172 0 1 84 504 1657141742 1657141798 OK IPv4 0 0 0 0 0 us-east-1 ingress - -
        - 6 TransitGateway 601427279990 tgw-004f004c35544e4bb tgw-attach-04fd0b1f746624ca9 601427279990 601427279990 vpc-08254c48dd910e268 vpc-0a43eeec01705c3bb subnet-080fcc1cf7ce9117b subnet-071d59121d65ba614 eni-065bdf3463532c3d0 eni-09d43c8e26c74c6ed use1-az2 use1-az1 tgw-attach-0bc5327361aef1ca2 10.2.0.50 10.1.0.50 60172 0 1 84 504 1657214940 1657214998 OK IPv4 0 0 0 0 0 us-east-1 egress - -
      grok:
        supportRules: |
        matchRules: |
          transit_gateway_flow_logs %{integer:flow_log.version} %{notSpace:flow_log.resource_type} %{notSpace:transit_gateway.account_id} %{notSpace:transit_gateway.id} %{notSpace:transit_gateway.attachment} %{notSpace:network.client.account_id:nullIf("-")} %{notSpace:network.destination.account_id:nullIf("-")} %{notSpace:network.client.vpc:nullIf("-")} %{notSpace:network.destination.vpc:nullIf("-")} %{notSpace:network.client.subnet:nullIf("-")} %{notSpace:network.destination.subnet:nullIf("-")} %{notSpace:network.client.eni:nullIf("-")} %{notSpace:network.destination.eni:nullIf("-")} %{notSpace:network.client.availability_zone:nullIf("-")} %{notSpace:network.destination.availability_zone:nullIf("-")} %{notSpace:transit_gateway.pair-attachment:nullIf("-")} %{notSpace:network.client.ip:nullIf("-")} %{notSpace:network.destination.ip:nullIf("-")} %{notSpace:network.client.port:nullIf("-")} %{notSpace:network.destination.port:nullIf("-")} %{notSpace:network.protocol_number:nullIf("-")} %{notSpace:network.packets:nullIf("-")} %{notSpace:network.bytes_written:nullIf("-")} %{notSpace:network.interval.start:nullIf("-")} %{notSpace:network.interval.end:nullIf("-")} %{notSpace:flow_log.status:nullIf("-")} %{notSpace:network.protocol_type:nullIf("-")} %{notSpace:network.packets_lost.no_route:nullIf("-")} %{notSpace:network.packets_lost.black_hole:nullIf("-")} %{notSpace:network.packets_lost.mtu_exceeded:nullIf("-")} %{notSpace:network.packets_lost.ttl_expired:nullIf("-")} %{notSpace:network.tcp_flags:nullIf("-")} %{notSpace:transit_gateway.region:nullIf("-")} %{notSpace:network.direction:nullIf("-")} %{notSpace:network.client.aws_service:nullIf("-")} %{notSpace:network.destination.aws_service:nullIf("-")}.*
    - type: attribute-remapper
      name: Map `network.bytes_written` to `network.bytes_written`
      enabled: true
      sources:
        - network.bytes_written
      target: network.bytes_written
      targetFormat: double
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
