id: microsoft-365
metric_id: microsoft-365
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Microsoft 365
    name: User Description
    path: UserDescription
    source: log
  - groups:
      - Microsoft 365
    name: Authentication Method
    path: AuthenticationMethod
    source: log
  - groups:
      - Microsoft 365
    name: Request Type
    path: ExtendedProperties.RequestType
    source: log
  - groups:
      - Microsoft 365
    name: Object Id
    path: ObjectId
    source: log
  - groups:
      - Microsoft 365
    name: Filename
    path: SourceFileName
    source: log
  - groups:
      - Microsoft 365
    name: Target User/Group
    path: TargetUserOrGroupName
    source: log
  - groups:
      - Microsoft 365
    name: AddOn Name
    path: AddOnName
    source: log
pipeline:
  type: pipeline
  name: Microsoft 365
  enabled: true
  filter:
    query: source:microsoft-365
  processors:
    - type: date-remapper
      name: Define `CreationTime` as the official date of the log
      enabled: true
      sources:
        - CreationTime
    - type: service-remapper
      name: Define `Workload` as the official service of the log
      enabled: true
      sources:
        - Workload
    - type: grok-parser
      name: Parsing IP address from ClientIP
      enabled: true
      source: ClientIP
      grok:
        supportRules: |
        matchRules: |
          ipv4_rule %{ipv4:network.client.ip}(:%{port:network.client.port})?
          ipv6_rule \[?%{ipv6:network.client.ip}\]?(:%{port:network.client.port})?
      samples:
        - 15.113.255.209
        - 15.113.255.209:21341
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    - type: attribute-remapper
      name: Map `Operation`, `Action` to `evt.name`
      enabled: true
      sources:
        - Operation
        - Action
      target: evt.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `ResultStatus` to `evt.outcome`
      enabled: true
      sources:
        - ResultStatus
      target: evt.outcome
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: pipeline
      name: Security and Compliance Alerts
      enabled: true
      filter:
        query: "@UserKey:SecurityComplianceAlerts @evt.name:AlertTriggered"
      processors:
        - type: attribute-remapper
          name: Map `Category` to `evt.category`
          enabled: true
          sources:
            - Category
          target: evt.category
          preserveSource: true
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute
        - type: grok-parser
          name: Parsing Data object for user email
          enabled: true
          source: Data
          grok:
            supportRules: |
            matchRules: |
              data_rule %{data:Data:json}
          samples:
            - |
              {"f3u":"example@example.com","ts":"2023-05-30T23:49:00.0000000Z","te":"2023-05-30T23:50:00.0000000Z","op":"DLPRuleMatch","wl":"SharePoint","tid":"1111-1111-111-1111","tdc":"1","reid":"11111--11111-1","dpn":"test policy","sitmi":"testvalue","von":"example.doc","sict":"Content","rid":"1111-111-11-11111-1111","cid":"11111-1-11111-1111","ad":"1","lon":"DLPRuleMatch","an":"DLP-alert-report","sev":"High"}
            - |
              {"riskyUserId":"1111-11111","userPrincipalName":"exampleuser@test.com","activationDateTimeUtc":"2023-05-29T13:11:54.6598124Z"}
        - type: attribute-remapper
          name: Map `Data.f3u`, `Data.userPrincipalName` to `usr.email`
          enabled: true
          sources:
            - Data.f3u
            - Data.userPrincipalName
          target: usr.email
          preserveSource: true
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute
        - type: attribute-remapper
          name: Map `Data.f3u`, `Data.userPrincipalName` to `usr.id`
          enabled: true
          sources:
            - Data.f3u
            - Data.userPrincipalName
          target: usr.id
          preserveSource: true
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute
    - type: attribute-remapper
      name: Map `UserId` to `usr.id`
      enabled: true
      sources:
        - UserId
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `UserId` to `usr.email`
      enabled: true
      sources:
        - UserId
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `UserAgent`, `ExtendedProperties.UserAgent` to `http.useragent`
      enabled: true
      sources:
        - UserAgent
        - ExtendedProperties.UserAgent
      target: http.useragent
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: user-agent-parser
      name: ""
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
    - type: lookup-processor
      name: Map UserDescription based on UserType
      enabled: true
      source: UserType
      target: UserDescription
      lookupTable: "0,A regular user\n1,A reserved user\n2,An administrator\n3,A Microsoft datacenter operator\n4,A system account\n5,An application\n6,A service principal\n7,A custom policy\n8,A system policy"
      defaultLookup: Unknown User Type
    - type: lookup-processor
      name: Map LogonUserDescription based on LogonType
      enabled: true
      source: LogonType
      target: LogonUserDescription
      lookupTable: "0, The mailbox owner\n1, A person with administrative privileges for someone's mailbox\n2, A person with the delegate privileges for someone's mailbox\t\n3, A transport service in the Microsoft datacenter\n4, A service account in the Microsoft datacenter\n5, Reserved for internal use\n6, A delegated administrator"
      defaultLookup: Unknown User Type
    - type: lookup-processor
      name: Map AuthenticationMethod based on ExtendedProperties.UserAuthenticationMethod
      enabled: true
      source: ExtendedProperties.UserAuthenticationMethod
      target: AuthenticationMethod
      lookupTable: "1, Password\n2, Digest\n3, ProxyAuth\n4, InfoCard\n5, DAToken\n6, Sha1RememberMyPassword\n7, LMPasswordHash\n8, ADFSFederatedToken\n9, EID\n10, DeviceID\n11, MD5\n12, EncProxyPasswordHash\n13, LWAFederation\n14, Sha1HashedPassword\n15, SecurePin\n16, SecurePinReset\n17, SAML20PostSimpleSign\n18, SAML20Post\n19, OneTimeCode"
      defaultLookup: Unknown Authentication Method
    - type: string-builder-processor
      name: Setting title attribute using usr.id, evt.name and country.name
      enabled: true
      template: "%{usr.id}(%{UserDescription}) performed %{evt.name} from %{network.client.geoip.country.name}"
      target: title
      replaceMissing: false
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: attribute-remapper
          name: Map `Id` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - Id
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `CreationTime` to `ocsf.time_dt`
          enabled: true
          sources:
            - CreationTime
          sourceType: attribute
          target: ocsf.time_dt
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse CreationTime to ocsf.time
          enabled: true
          source: CreationTime
          samples:
            - "2025-04-28T09:48:14"
          grok:
            supportRules: ""
            matchRules: parsing_time %{date("yyyy-MM-dd'T'HH:mm:ss"):ocsf.time}
        - type: attribute-remapper
          name: Map `Operation`, `Action` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - Operation
            - Action
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: "1.3.0"
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add log name
          enabled: true
          template: "Office 365 Management Activity API"
          target: ocsf.metadata.log_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[datetime]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[date]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Microsoft 365"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Microsoft"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ClientIPAddress`, `ClientIP`, `ActorIpAddress` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - ClientIPAddress
            - ClientIP
            - ActorIpAddress
          sourceType: attribute
          target: ocsf.src_endpoint.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parsing IP address from ocsf.src_endpoint.ip
          enabled: true
          source: ocsf.src_endpoint.ip
          grok:
            supportRules: |
            matchRules: |
              ipv4_rule %{ipv4:ocsf.src_endpoint.ip}(:%{port:ocsf.src_endpoint.port})?
              ipv6_rule \[?%{ipv6:ocsf.src_endpoint.ip}\]?(:%{port:ocsf.src_endpoint.port})?
          samples:
            - 15.113.255.209
            - 15.113.255.209:21341
    - type: pipeline
      name: OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(UserLoggedIn OR UserLoginFailed)"
      processors:
        - type: attribute-remapper
          name: Map `ocsf.metadata.event_code` to `ocsf.activity_name`
          enabled: true
          sources:
            - ocsf.metadata.event_code
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:(UserLoggedIn OR UserLoginFailed)"
              name: "1"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@ocsf.activity_id:1"
              name: "Logon"
          target: ocsf.activity_name
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Identity & Access Management"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3002"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "Authentication"
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add service name
          enabled: true
          template: "Microsoft Entra ID"
          target: ocsf.service.name
          replaceMissing: false
        - type: category-processor
          name: User type mapping
          enabled: true
          categories:
            - filter:
                query: "@UserType:(0)"
              name: "1"
            - filter:
                query: "@UserType:(2 OR 3)"
              name: "2"
            - filter:
                query: "@UserType:(4)"
              name: "3"
            - filter:
                query: "@UserType:*"
              name: "99"
          target: ocsf.user.type_id
        - type: category-processor
          name: User type name mapping
          enabled: true
          categories:
            - filter:
                query: "@UserType:(0)"
              name: "User"
            - filter:
                query: "@UserType:(2 OR 3)"
              name: "Administrator"
            - filter:
                query: "@UserType:(4)"
              name: "System"
            - filter:
                query: "@UserType:5"
              name: "Application"
            - filter:
                query: "@UserType:6"
              name: "Service Principal"
            - filter:
                query: "@UserType:7"
              name: "Custom Policy"
            - filter:
                query: "@UserType:8"
              name: "System Policy"
            - filter:
                query: "@UserType:9"
              name: "PartnerTechnician"
            - filter:
                query: "@UserType:10"
              name: "Guest"
          target: ocsf.user.type
        - type: attribute-remapper
          name: Map `ocsf.user.type_id` to `ocsf.user.type_id`
          enabled: true
          sources:
            - ocsf.user.type_id
          sourceType: attribute
          target: ocsf.user.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `UserKey` to `ocsf.user.uid`
          enabled: true
          sources:
            - UserKey
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `UserId` to `ocsf.user.email_addr`
          enabled: true
          sources:
            - UserId
          sourceType: attribute
          target: ocsf.user.email_addr
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ocsf.user.email_addr to extract user name
          enabled: true
          source: ocsf.user.email_addr
          grok:
            supportRules: ""
            matchRules: extract_username_from_email %{regex("[^@]*"):ocsf.user.name}@%{regex("[^@]*")}
          samples:
            - "user@example.com"
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: Informational
          target: ocsf.severity
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity id
          enabled: true
          template: "1"
          target: ocsf.severity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ResultStatus` to `ocsf.status`
          enabled: true
          sources:
            - ResultStatus
          sourceType: attribute
          target: ocsf.status
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Status mapping
          enabled: true
          categories:
            - filter:
                query: "-@LogonError:*"
              name: "1"
            - filter:
                query: "@LogonError:*"
              name: "2"
          target: ocsf.status_id
        - type: category-processor
          name: Status mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.status_id:1"
              name: "Success"
            - filter:
                query: "@ocsf.status_id:2"
              name: "Failure"
          target: ocsf.status
        - type: category-processor
          name: User type mapping
          enabled: true
          categories:
            - filter:
                query: "@UserType:(0)"
              name: "1"
            - filter:
                query: "@UserType:(2 OR 3)"
              name: "2"
            - filter:
                query: "@UserType:(4)"
              name: "3"
            - filter:
                query: "@UserType:*"
              name: "99"
          target: ocsf.actor.user.type_id
        - type: category-processor
          name: User type name mapping
          enabled: true
          categories:
            - filter:
                query: "@UserType:(0)"
              name: "User"
            - filter:
                query: "@UserType:(2 OR 3)"
              name: "Administrator"
            - filter:
                query: "@UserType:(4)"
              name: "System"
            - filter:
                query: "@UserType:5"
              name: "Application"
            - filter:
                query: "@UserType:6"
              name: "Service Principal"
            - filter:
                query: "@UserType:7"
              name: "Custom Policy"
            - filter:
                query: "@UserType:8"
              name: "System Policy"
            - filter:
                query: "@UserType:9"
              name: "PartnerTechnician"
            - filter:
                query: "@UserType:10"
              name: "Guest"
          target: ocsf.actor.user.type
        - type: attribute-remapper
          name: Map `ocsf.actor.user.type_id` to `ocsf.actor.user.type_id`
          enabled: true
          sources:
            - ocsf.actor.user.type_id
          sourceType: attribute
          target: ocsf.actor.user.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `UserKey` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - UserKey
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `UserId` to `ocsf.actor.user.email_addr`
          enabled: true
          sources:
            - UserId
          sourceType: attribute
          target: ocsf.actor.user.email_addr
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ocsf.actor.user.email_addr to extract user name
          enabled: true
          source: ocsf.actor.user.email_addr
          grok:
            supportRules: ""
            matchRules: extract_username_from_email %{regex("[^@]*"):ocsf.actor.user.name}@%{regex("[^@]*")}
          samples:
            - "user@example.com"
        - type: attribute-remapper
          name: Map `AppAccessContext.ClientAppName` to `ocsf.actor.app_name`
          enabled: true
          sources:
            - AppAccessContext.ClientAppName
          sourceType: attribute
          target: ocsf.actor.app_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `AppAccessContext.ClientAppId` to `ocsf.actor.app_id`
          enabled: true
          sources:
            - AppAccessContext.ClientAppId
          sourceType: attribute
          target: ocsf.actor.app_id
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `UserAgent`, `ExtendedProperties.UserAgent` to `ocsf.http_request.user_agent`
          enabled: true
          sources:
            - UserAgent
            - ExtendedProperties.UserAgent
          sourceType: attribute
          target: ocsf.http_request.user_agent
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: OCSF sub pipeline for class File Hosting Activity [6006]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "service:(SharePoint OR OneDrive) @SourceFileName:* @ocsf.metadata.event_code:File*"
      processors:
        - type: attribute-remapper
          name: Map `ocsf.metadata.event_code` to `ocsf.activity_name`
          enabled: true
          sources:
            - ocsf.metadata.event_code
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:FileUploaded"
              name: "1"
            - filter:
                query: "@ocsf.metadata.event_code:FileDownloaded"
              name: "2"
            - filter:
                query: "@ocsf.metadata.event_code:(FileModified OR FileModifiedExtended OR FileUpdateDescription OR FileUpdateName)"
              name: "3"
            - filter:
                query: "@ocsf.metadata.event_code:(FileDeleted OR FileDeletedFirstStageRecycleBin OR FileDeletedSecondStageRecycleBin)"
              name: "4"
            - filter:
                query: "@ocsf.metadata.event_code:FileRenamed"
              name: "5"
            - filter:
                query: "@ocsf.metadata.event_code:FileCopied"
              name: "6"
            - filter:
                query: "@ocsf.metadata.event_code:FileMoved"
              name: "7"
            - filter:
                query: "@ocsf.metadata.event_code:FileRestored"
              name: "8"
            - filter:
                query: "@ocsf.metadata.event_code:FilePreviewed"
              name: "9"
            - filter:
                query: "@ocsf.metadata.event_code:FileShared"
              name: "12"
            - filter:
                query: "@ocsf.metadata.event_code:(FileAccessFailure OR FileAccessed OR FileAccessedExtended)"
              name: "14"
            - filter:
                query: "@ocsf.metadata.event_code:(FileSyncDownloadedFull OR FileSyncDownloadedPartial OR FileSyncUploadedFull OR FileSyncUploadedPartial)"
              name: "15"
            - filter:
                query: "@ocsf.metadata.event_code:*"
              name: "99"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:FileUploaded"
              name: "Upload"
            - filter:
                query: "@ocsf.metadata.event_code:FileDownloaded"
              name: "Download"
            - filter:
                query: "@ocsf.metadata.event_code:(FileModified OR FileModifiedExtended OR FileUpdateDescription OR FileUpdateName)"
              name: "Update"
            - filter:
                query: "@ocsf.metadata.event_code:(FileDeleted OR FileDeletedFirstStageRecycleBin OR FileDeletedSecondStageRecycleBin)"
              name: "Delete"
            - filter:
                query: "@ocsf.metadata.event_code:FileRenamed"
              name: "Rename"
            - filter:
                query: "@ocsf.metadata.event_code:FileCopied"
              name: "Copy"
            - filter:
                query: "@ocsf.metadata.event_code:FileMoved"
