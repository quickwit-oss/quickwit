id: netskope
metric_id: netskope
backend_only: false
facets:
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
pipeline:
  type: pipeline
  name: Netskope Sketch Pipeline
  enabled: true
  filter:
    query: source:netskope
  processors:
    - type: attribute-remapper
      name: "Map `cs-username` to `usr.name`"
      enabled: true
      sources:
        - cs-username
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cs-method` to `evt.name`
      enabled: true
      sources:
        - cs-method
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `c-ip` to `network.client.ip`
      enabled: true
      sources:
        - c-ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `sc-status` to `evt.outcome`
      enabled: true
      sources:
        - sc-status
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
