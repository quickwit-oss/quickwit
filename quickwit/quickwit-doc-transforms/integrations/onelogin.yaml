pipeline:
  type: pipeline
  name: Onelogin
  enabled: true
  filter:
    query: source:onelogin
  processors:
    - type: attribute-remapper
      name: Map `actor_user_id` to `actor_user_id`
      enabled: true
      sources:
        - actor_user_id
      target: actor_user_id
      targetFormat: string
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `user_id` to `usr.id`
      enabled: true
      sources:
        - user_id
      target: usr.id
      targetFormat: string
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `actor_user_id` to `usr.id`
      enabled: true
      sources:
        - actor_user_id
      target: usr.id
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `user_name` to `usr.name`
      enabled: true
      sources:
        - user_name
      target: usr.name
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: date-remapper
      name: Define `created_at` as the official date of the log
      enabled: true
      sources:
        - created_at
    - type: attribute-remapper
      name: Map `ipaddr` to `network.client.ip`
      enabled: true
      sources:
        - ipaddr
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Client IP
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    - type: attribute-remapper
      name: Map `event_type_id` to `evt.id`
      enabled: true
      sources:
        - event_type_id
      target: evt.id
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: lookup-processor
      name: Map evt.id to evt.description
      enabled: true
      source: evt.id
      target: evt.description
