    - type: attribute-remapper
      name: Map `event_type` to `evt`
      enabled: true
      sources:
        - event_type
      target: evt
      targetFormat: auto
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: category-processor
      name: Categorize evt.id as evt.category:authentication
      enabled: true
      categories:
        - filter:
            query: '@evt.id:(5 OR 8 OR 900 OR 904 OR 140 OR 6 OR 9)'
          name: authentication
      target: evt.category
    - type: category-processor
      name: Categorize evt.id in evt.outcome
      enabled: true
      categories:
        - filter:
            query: '@evt.id:(6 OR 9)'
          name: failure
        - filter:
            query: '@evt.id:(5 OR 8 OR 140 OR 900 OR 904)'
          name: success
      target: evt.outcome
