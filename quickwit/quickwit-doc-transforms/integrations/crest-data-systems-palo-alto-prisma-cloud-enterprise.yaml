pipeline:
  type: pipeline
  name: Palo Alto Prisma Cloud Enterprise
  enabled: true
  filter:
    query: source:crest-data-systems-palo-alto-prisma-cloud-enterprise
  processors:
    - type: pipeline
      name: Cloud Security Alerts
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_alerts
      processors:
        - type: attribute-remapper
          name: Map `id` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `reason` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.reason`
          enabled: true
          sources:
            - reason
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.reason
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `status` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.status`
          enabled: true
          sources:
            - status
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.status
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup for
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.status`
            to `status`
          enabled: true
          source: cd_palo_alto_prisma_cloud_enterprise.cloud_security_alerts.status
          target: status
          lookupTable: |-
            open, alert
            dismissed, info
            snoozed, info
            resolved, info
            pending_resolution, debug
          type: lookup-processor
        - type: status-remapper
          name: Define `status` as the official status of the log
          enabled: true
          sources:
            - status
        - type: attribute-remapper
          name: Map `lastSeen` to `timestamp`
          enabled: true
          sources:
            - lastSeen
          sourceType: attribute
          target: timestamp
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Cloud Security Vulnerabilities
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_vulnerabilities
      processors:
        - type: attribute-remapper
          name: Map `cveId` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_vulnerabilities.cveId`
          enabled: true
          sources:
            - cveId
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_vulnerabilities.cveId
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `severity` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_vulnerabilities.severity`
          enabled: true
          sources:
            - severity
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_vulnerabilities.severity
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Cloud Security Assets
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_assets
      processors:
        - type: attribute-remapper
          name: Map `id` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_assets.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_assets.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `name` to
