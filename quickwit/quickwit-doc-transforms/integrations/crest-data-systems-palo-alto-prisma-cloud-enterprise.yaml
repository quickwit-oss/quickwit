          overrideOnConflict: false
    - type: pipeline
      name: Cloud Security Applications
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_applications
      processors:
        - type: attribute-remapper
          name: Map `id` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `summary.alertCountsBySeverity.critical` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.critical_alert_counts`
          enabled: true
          sources:
            - summary.alertCountsBySeverity.critical
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.critical_alert_counts
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `summary.vulnCountsBySeverity.critical` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.critical_vulnerability_counts`
          enabled: true
          sources:
            - summary.vulnCountsBySeverity.critical
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.critical_vulnerability_counts
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Define
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.application_name`
            equal to %{metadata.displayName}
          enabled: true
          template: "%{metadata.displayName}"
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_applications.application_name
          replaceMissing: false
    - type: pipeline
      name: Cloud Security Compliance
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_compliance_standards
      processors:
        - type: attribute-remapper
          name: Map `id` to
            `cd_palo_alto_prisma_cloud_enterprise.cloud_security_compliance_standards.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_compliance_standards.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `name` to
