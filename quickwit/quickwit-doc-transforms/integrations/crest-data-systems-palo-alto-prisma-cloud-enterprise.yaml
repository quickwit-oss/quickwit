    - type: pipeline
      name: Runtime Security Images
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.runtime_security_images
      processors:
        - type: string-builder-processor
          name: Define
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_images.hostname`
            equal to %{instances.host}
          enabled: true
          template: "%{instances.host}"
          target: cd_palo_alto_prisma_cloud_enterprise.runtime_security_images.hostname
          replaceMissing: false
    - type: service-remapper
      name: "Define `service` as the official service of the log"
      enabled: true
      sources:
        - service
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
