          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Runtime Security Packages
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.runtime_security_packages
      processors:
        - type: attribute-remapper
          name: Map `name` to
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_packages.name`
          enabled: true
          sources:
