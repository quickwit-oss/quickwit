          enabled: true
          sources:
            - name
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.cloud_security_compliance_standards.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Cloud Security Audits
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.cloud_security_audits
      processors:
        - type: attribute-remapper
          name: Map `ipAddress` to `network.client.ip`
          enabled: true
          sources:
            - ipAddress
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `user` to `usr.email`
          enabled: true
          sources:
            - user
          sourceType: attribute
          target: usr.email
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Runtime Security Vulnerabilities
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.runtime_security_vulnerabilities
      processors:
        - type: attribute-remapper
          name: Map `cve` to
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.cve`
          enabled: true
          sources:
            - cve
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.cve
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `severity` to
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.severity`
          enabled: true
          sources:
            - severity
          sourceType: attribute
          target: cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.severity
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup for
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.severity`
            to `status`
          enabled: true
          source: cd_palo_alto_prisma_cloud_enterprise.runtime_security_vulnerabilities.severity
          target: status
          lookupTable: |-
            critical, critical
            high, warning
            medium, warning
            low, notice
            negligible, info
            unassigned, notice
            unimportant, info
          type: lookup-processor
        - type: status-remapper
          name: Define `status` as the official status of the log
          enabled: true
          sources:
            - status
        - type: grok-parser
          name: "Grok Parser: extract vulnerability status"
          enabled: true
          source: vulnerability_status
          samples:
            - Fixed in SH28222
            - fixed in BS86869
            - Fixed in VL879992
          grok:
            supportRules: ""
            matchRules: rule %{regex("^Fixed|^fixed"):vulnerability_status:lowercase} .*?
    - type: pipeline
      name: Runtime Security Compliances
      enabled: true
      filter:
        query: service:cd.palo.alto.prisma.cloud.enterprise.runtime_security_compliance_issues
      processors:
        - type: attribute-remapper
          name: Map `id` to
            `cd_palo_alto_prisma_cloud_enterprise.runtime_security_compliance_issues.id`
          enabled: true
          sources:
