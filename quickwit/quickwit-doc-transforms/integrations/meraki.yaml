id: meraki
metric_id: meraki
backend_only: false
facets:
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - Network
    name: Client MAC
    path: network.client.mac
    source: log
  - groups:
      - Network
    name: Destination MAC
    path: network.destination.mac
    source: log
  - groups:
      - Meraki
    name: Device Name
    path: deviceName
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - File
    name: SHA256 File Hash
    path: file.hash.sha256
    source: log
  - groups:
      - Meraki
    name: Canonical Name
    path: canonicalName
    source: log
pipeline:
  type: pipeline
  name: Cisco Meraki
  enabled: true
  filter:
    query: source:meraki
  processors:
    - type: date-remapper
      name: Define `occurredAt` as the official date of the log
      enabled: true
      sources:
        - occurredAt
    - type: pipeline
      name: Security Appliance Events
      enabled: true
      filter:
        query: "@eventType:* @ts:*"
      processors:
        - type: date-remapper
          name: Define `ts` as the official date of the log
          enabled: true
          sources:
            - ts
        - type: attribute-remapper
          name: Map `eventType` to `evt.category`
          enabled: true
          sources:
            - eventType
          sourceType: attribute
          target: evt.category
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse Client IP and port
          enabled: true
          source: srcIp
          samples:
            - 10.43.112.119:61819
            - 8.8.8.8:53
            - 2001:db8:3333:4444:5555:6666:7777:8888:1234
          grok:
            supportRules: |
            matchRules: |
              ip_rule %{ip:network.client.ip}(:%{port:network.client.port})?
        - type: grok-parser
          name: Parse Destination IP and port
          enabled: true
          source: destIp
          samples:
            - 10.43.112.119:61819
            - 8.8.8.8:53
            - 2001:db8:3333:4444:5555:6666:7777:8888:1234
          grok:
            supportRules: |
            matchRules: |
              ip_rule %{ip:network.destination.ip}(:%{port:network.destination.port})?
        - type: attribute-remapper
          name: Map `protocol` to `network.protocol`
          enabled: true
          sources:
            - protocol
          sourceType: attribute
          target: network.protocol
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `uri` to `http.url`
          enabled: true
          sources:
            - uri
          sourceType: attribute
          target: http.url
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: url-parser
          name: URL parser
          enabled: true
          sources:
            - http.url
          target: http.url_details
        - type: attribute-remapper
          name: Map `fileHash` to `file.hash.sha256`
          enabled: true
          sources:
            - fileHash
          sourceType: attribute
          target: file.hash.sha256
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `fileSizeBytes` to `file.size`
          enabled: true
          sources:
            - fileSizeBytes
          sourceType: attribute
          target: file.size
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `destinationPort` to `network.destination.port`
          enabled: true
          sources:
            - destinationPort
          sourceType: attribute
          target: network.destination.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: message-remapper
          name: Define `message` as the official message of the log
          enabled: true
          sources:
            - message
    - type: string-builder-processor
      name: Defining title as %{description} on Device %{deviceName} on Network %{networkId}
      enabled: true
      template: "%{description} on Device %{deviceName} on Network %{networkId}"
      target: title
      replaceMissing: false
    - type: attribute-remapper
      name: Map `type` to `evt.name`
      enabled: true
      sources:
        - type
      target: evt.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `eventData.ip`, `eventData.client_ip`, `eventData.source_client_ip` to `network.client.ip`
      enabled: true
      sources:
        - eventData.ip
        - eventData.client_ip
        - eventData.source_client_ip
      target: network.client.ip
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    - type: attribute-remapper
      name: Map `clientMac`, `eventData.client_mac`, `eventData.src`, `eventData.source_client_mac` to `network.client.mac`
      enabled: true
      sources:
        - clientMac
        - eventData.client_mac
        - eventData.src
        - eventData.source_client_mac
      target: network.client.mac
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `eventData.dst_ip`, `eventData.server_ip` to `network.destination.ip`
      enabled: true
      sources:
        - eventData.dst_ip
        - eventData.server_ip
      target: network.destination.ip
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `eventData.dst`, `eventData.server_mac` to `network.destination.mac`
      enabled: true
      sources:
        - eventData.dst
        - eventData.server_mac
      target: network.destination.mac
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `eventData.identity` to `usr.email`
      enabled: true
      sources:
        - eventData.identity
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: grok-parser
      name: Parsing duration
      enabled: true
      source: eventData.duration
      grok:
        supportRules: ""
        matchRules: |
          duration %{number:duration:scale(1000000000)}
      samples:
        - 60.06
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: "1.3.0"
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Cisco"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Cisco Meraki"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `type` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - type
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: OCSF sub pipeline for class Network Activity [4001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@eventType:"IDS Alert" @ts:*'
      processors:
        - type: category-processor
          name: Map blocked to action_id
          enabled: true
          categories:
            - filter:
                query: "@blocked:false"
              name: "1"
            - filter:
                query: "@blocked:true"
              name: "2"
          target: ocsf.action_id
        - type: category-processor
          name: Map blocked to action
          enabled: true
          categories:
            - filter:
                query: "@blocked:false"
              name: "Allowed"
            - filter:
                query: "@blocked:true"
              name: "Denied"
          target: ocsf.action
        - type: attribute-remapper
          name: Map `ocsf.action_id` to `ocsf.action_id`
          enabled: true
          sources:
            - ocsf.action_id
          sourceType: attribute
          target: ocsf.action_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add activity_id
          enabled: true
          template: "99"
          target: ocsf.activity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `eventType` to `ocsf.activity_name`
          enabled: true
          sources:
            - eventType
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "4"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Network Activity"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "4001"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "Network Activity"
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[security_control]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[security_control]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: grok-parser
          name: Parse destIp to ocsf.dst_endpoint.ip and port
          enabled: true
          source: destIp
          samples:
            - "10.43.112.119:61819"
            - "8.8.8.8:53"
            - "2001:db8:3333:4444:5555:6666:7777:8888:1234"
          grok:
            supportRules: ""
            matchRules: |
              ip_rule %{ip:ocsf.dst_endpoint.ip}(:%{port:ocsf.dst_endpoint.port})?
        - type: attribute-remapper
          name: Map `ocsf.dst_endpoint.port` to `ocsf.dst_endpoint.port`
          enabled: true
          sources:
            - ocsf.dst_endpoint.port
          sourceType: attribute
          target: ocsf.dst_endpoint.port
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: Map blocked to disposition_id
          enabled: true
          categories:
            - filter:
                query: "@blocked:false"
              name: "1"
            - filter:
                query: "@blocked:true"
              name: "2"
          target: ocsf.disposition_id
        - type: category-processor
          name: Map blocked to disposition
          enabled: true
          categories:
            - filter:
                query: "@blocked:true"
              name: "Blocked"
          target: ocsf.disposition
        - type: attribute-remapper
          name: Map `ocsf.disposition_id` to `ocsf.disposition_id`
          enabled: true
          sources:
            - ocsf.disposition_id
          sourceType: attribute
          target: ocsf.disposition_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ruleId` to `ocsf.firewall_rule.uid`
          enabled: true
          sources:
            - ruleId
          sourceType: attribute
          target: ocsf.firewall_rule.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse srcIp to ocsf.src_endpoint.ip and port
          enabled: true
          source: srcIp
          samples:
            - "10.43.112.119:61819"
            - "8.8.8.8:53"
            - "2001:db8:3333:4444:5555:6666:7777:8888:1234"
          grok:
            supportRules: ""
            matchRules: |
              ip_rule %{ip:ocsf.src_endpoint.ip}(:%{port:ocsf.src_endpoint.port})?
        - type: attribute-remapper
          name: Map `ocsf.src_endpoint.port` to `ocsf.src_endpoint.port`
          enabled: true
          sources:
            - ocsf.src_endpoint.port
          sourceType: attribute
          target: ocsf.src_endpoint.port
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `network.client.mac` to `ocsf.src_endpoint.mac`
          enabled: true
          sources:
            - network.client.mac
          sourceType: attribute
          target: ocsf.src_endpoint.mac
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ts to ocsf.time
          enabled: true
          source: ts
          samples:
            - "2025-06-05T09:31:34.751966Z"
          grok:
            supportRules: ""
            matchRules: parsing_time %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"):ocsf.time}
        - type: attribute-remapper
          name: Map `priority` to `ocsf.severity`
          enabled: true
          sources:
            - priority
          sourceType: attribute
          target: ocsf.severity
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Map priority to severity_id
          enabled: true
          categories:
            - filter:
                query: "@priority:4"
              name: "1"
            - filter:
                query: "@priority:3"
              name: "2"
            - filter:
                query: "@priority:2"
              name: "3"
            - filter:
                query: "@priority:1"
              name: "4"
            - filter:
                query: "@priority:*"
              name: "99"
          target: ocsf.severity_id
        - type: category-processor
          name: Map priority to severity
          enabled: true
          categories:
            - filter:
                query: "@priority:4"
              name: "Informational"
            - filter:
                query: "@priority:3"
              name: "Low"
            - filter:
                query: "@priority:2"
              name: "Medium"
            - filter:
                query: "@priority:1"
              name: "High"
          target: ocsf.severity
        - type: attribute-remapper
          name: Map `ocsf.severity_id` to `ocsf.severity_id`
          enabled: true
          sources:
            - ocsf.severity_id
          sourceType: attribute
          target: ocsf.severity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: OCSF sub pipeline for class Network Activity [4001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@eventType:"File Scanned" @ts:*'
      processors:
        - type: attribute-remapper
          name: Map `action` to `ocsf.action`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.action
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Map action to action_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.action:Blocked"
              name: "2"
            - filter:
                query: "@ocsf.action:*"
              name: "99"
          target: ocsf.action_id
        - type: category-processor
          name: Map blocked to action
          enabled: true
          categories:
            - filter:
                query: "@ocsf.action_id:2"
              name: "Denied"
          target: ocsf.action
        - type: attribute-remapper
          name: Map `ocsf.action_id` to `ocsf.action_id`
          enabled: true
          sources:
            - ocsf.action_id
          sourceType: attribute
          target: ocsf.action_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add activity_id
          enabled: true
          template: "99"
          target: ocsf.activity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `eventType` to `ocsf.activity_name`
          enabled: true
          sources:
            - eventType
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "4"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: "Network Activity"
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "4001"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: "Network Activity"
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[security_control,host]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[security_control,host]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: attribute-remapper
          name: Map `network.destination.ip` to `ocsf.dst_endpoint.ip`
          enabled: true
          sources:
            - network.destination.ip
          sourceType: attribute
          target: ocsf.dst_endpoint.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `network.destination.port` to `ocsf.dst_endpoint.port`
          enabled: true
          sources:
            - network.destination.port
          sourceType: attribute
          target: ocsf.dst_endpoint.port
          targetType: attribute
          targetFormat: integer
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ocsf.dst_endpoint.port` to `ocsf.dst_endpoint.port`
          enabled: true
          sources:
            - ocsf.dst_endpoint.port
          sourceType: attribute
          target: ocsf.dst_endpoint.port
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ocsf.action` to `ocsf.disposition`
          enabled: true
          sources:
            - ocsf.action
          sourceType: attribute
          target: ocsf.disposition
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Map ocsf.action_id to disposition_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.action_id:2"
              name: "2"
            - filter:
                query: "@ocsf.action_id:*"
              name: "99"
          target: ocsf.disposition_id
        - type: category-processor
          name: Map ocsf.action_id to disposition
          enabled: true
          categories:
            - filter:
                query: "@ocsf.action_id:2"
              name: "Blocked"
          target: ocsf.disposition
        - type: attribute-remapper
          name: Map `ocsf.disposition_id` to `ocsf.disposition_id`
          enabled: true
          sources:
            - ocsf.disposition_id
          sourceType: attribute
          target: ocsf.disposition_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `clientName` to `ocsf.device.name`
          enabled: true
          sources:
            - clientName
          sourceType: attribute
          target: ocsf.device.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add device type_id
          enabled: true
          template: "0"
          target: ocsf.device.type_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.device.type_id` to `ocsf.device.type_id`
          enabled: true
          sources:
            - ocsf.device.type_id
          sourceType: attribute
          target: ocsf.device.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add device type
          enabled: true
          template: "Unknown"
          target: ocsf.device.type
          replaceMissing: false
        - type: attribute-remapper
          name: Map `network.client.ip` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - network.client.ip
          sourceType: attribute
          target: ocsf.src_endpoint.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `network.client.mac` to `ocsf.src_endpoint.mac`
          enabled: true
          sources:
            - network.client.mac
          sourceType: attribute
          target: ocsf.src_endpoint.mac
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse ts to ocsf.time
          enabled: true
          source: ts
          samples:
            - "2025-06-05T09:31:34.751966Z"
          grok:
            supportRules: ""
            matchRules: parsing_time %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"):ocsf.time}
        - type: attribute-remapper
          name: Map `uri` to `ocsf.url.url_string`
          enabled: true
          sources:
            - uri
          sourceType: attribute
          target: ocsf.url.url_string
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: "Informational"
          target: ocsf.severity
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity_id
