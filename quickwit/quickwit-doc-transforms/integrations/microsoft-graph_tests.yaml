              "tenantId": "4d3bac44-0230-4732-9e70-cc00736f0a97",
              "title": "Suspicious incoming RDP network activity",
              "description": "Network traffic analysis detected anomalous incoming Remote Desktop Protocol (RDP) communication to 52.224.88.41, associated with your resource Test-FW01, from 46.219.77.107. When the compromised resource is a load balancer or an application gateway, the suspected incoming traffic has been forwarded to one or more of the resources in the backend pool (of the load balancer or application gateway).Specifically, sampled network data shows 435.0 incoming connections to your resource, which is considered abnormal for this environment.This activity may indicate an attempt to brute force your RDP end point",
              "recommendedActions": "When the compromised resource is a load balancer or an application gateway, you may want to trace which resources behind it have been impacted by the suspicious traffic, by following these steps:\r\n1. Find the suspicious machines, by reviewing the load balancer / application gateway backend pools.\r\nhttps://docs.microsoft.com/en-us/azure/load-balancer/\r\nhttps://docs.microsoft.com/en-us/azure/application-gateway/\r\n2.  When the compromised resource is a load balancer, review the configured load balancing rules in order to reach the affected machines.\r\nhttps://docs.microsoft.com/en-us/azure/load-balancer/\r\n3. To filter the relevant machines you can:\r\n• Check the active status of the machine during the suspicious activity using machine logs / current status.\r\n• Check for additional alerts on the resources during the suspicious activity which may indicate the machines that were compromised.\r\n• Check for unfamiliar processes running on the machine\r\n• Check for traces in other log sources (if they exist) such as: firewall logs, activity logs, WAF and more...\r\n4. Run the following remediation steps for each machine which might have been compromised by the suspicious activity.\r\n1. Add 46.219.77.107 to a Network Security Group block list for 24 hours. (See https://azure.microsoft.com/en-us/documentation/articles/virtual-networks-nsg/)\r\n2. Enforce the use of strong passwords and do not reuse them across multiple resources. (See http://windows.microsoft.com/en-us/Windows7/Tips-for-creating-strong-passwords-and-passphrases) \r\n3. Create an allow list for RDP access in NSG. (See https://azure.microsoft.com/en-us/documentation/articles/virtual-networks-nsg/)",
              "category": "InitialAccess",
