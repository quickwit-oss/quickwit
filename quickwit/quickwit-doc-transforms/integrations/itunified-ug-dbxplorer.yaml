        - logger_name
      sourceType: attribute
      target: logger.name
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
    - type: attribute-remapper
      name: Map `thread_name` to `logger.thread_name`
      enabled: true
      sources:
        - thread_name
      sourceType: attribute
      target: logger.thread_name
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `@timestamp` to `timestamp`
      enabled: true
      sources:
        - "@timestamp"
      sourceType: attribute
      target: timestamp
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - "timestamp"
    - type: attribute-remapper
      name: Map `@version` to `logger.version`
