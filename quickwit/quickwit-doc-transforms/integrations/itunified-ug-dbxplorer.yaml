      sourceType: attribute
      target: dbx.oracledb.instance_id
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `sql_id` to `dbx.oracledb.sql.sql_id`
      enabled: true
      sources:
        - sql_id
      sourceType: attribute
      target: dbx.oracledb.sql.sql_id
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `plan_hash_value` to `dbx.oracledb.sql.plan_hash_value`
      enabled: true
      sources:
        - plan_hash_value
      sourceType: attribute
      target: dbx.oracledb.sql.plan_hash_value
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cluster_name` to `dbx.oracledb.cluster_name`
      enabled: true
      sources:
        - cluster_name
      sourceType: attribute
      target: dbx.oracledb.cluster_name
