id: wiz
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
pipeline:
  type: pipeline
  name: Wiz
  enabled: true
  filter:
    query: source:wiz
  processors:
    - type: date-remapper
      name: Define `timestamp`, `statusChangedAt` as the official date of the log
      enabled: true
      sources:
        - timestamp
        - statusChangedAt
    - type: attribute-remapper
      name: Map `serviceAccount.id` to `usr.id`
      enabled: true
      sources:
        - serviceAccount.id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `serviceAccount.name` to `usr.name`
      enabled: true
      sources:
        - serviceAccount.name
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actionParameters.userEmail` to `usr.email`
      enabled: true
      sources:
        - actionParameters.userEmail
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `action`, `sourceRule.name` to `evt.name`
      enabled: true
      sources:
        - action
        - sourceRule.name
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `type` to `evt.category`
      enabled: true
      sources:
        - type
      sourceType: attribute
      target: evt.category
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `status` to `evt.outcome`
      enabled: true
      sources:
        - status
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `severity` to `evt.severity`
      enabled: true
      sources:
        - severity
      sourceType: attribute
      target: evt.severity
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userAgent` to `http.useragent`
      enabled: true
      sources:
        - userAgent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `sourceIP` to `network.client.ip`
      enabled: true
      sources:
        - sourceIP
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: pipeline
      name: Webhook - issueUpdate Log
      enabled: true
      filter:
        query: "@issue.status:IN_PROGRESS @trigger.integration:webhook"
      processors:
        - type: date-remapper
          name: Define `trigger.issueUpdate` as the official date of the log
          enabled: true
          sources:
            - trigger.issueUpdate
    - type: pipeline
      name: Webhook - issueCreate Log
      enabled: true
      filter:
        query: "@issue.status:OPEN @trigger.integration:webhook"
      processors:
        - type: date-remapper
          name: Define `trigger.issueCreate` as the official date of the log
          enabled: true
          sources:
            - trigger.issueCreate
    - type: pipeline
      name: Webhook - issueResolved Log
      enabled: true
      filter:
        query: "@issue.status:RESOLVED @trigger.integration:webhook"
      processors:
        - type: date-remapper
          name: Define `trigger.issueResolve` as the official date of the log
          enabled: true
          sources:
            - trigger.issueResolve
