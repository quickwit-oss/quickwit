          sources:
            - debugContext.debugData.url
          sourceType: attribute
          target: ocsf.http_request.url.path
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `client.userAgent.rawUserAgent` to `ocsf.http_request.user_agent`
          enabled: true
          sources:
            - client.userAgent.rawUserAgent
          sourceType: attribute
          target: ocsf.http_request.user_agent
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: OCSF - activity_id mapping
          enabled: true
          categories:
            - filter:
                query: "@eventType:(app.inbound_del_auth.login_success OR
                  user.authentication.auth OR
                  user.authentication.auth_unconfigured_identifier OR
                  user.authentication.auth_via_AD_agent OR
