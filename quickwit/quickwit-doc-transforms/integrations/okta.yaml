id: okta
metric_id: okta
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: Request ID
    path: http.request_id
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Okta
    name: Target App
    path: target_app
    source: log
pipeline:
  type: pipeline
  name: Okta
  enabled: true
  filter:
    query: source:okta
  processors:
    - type: date-remapper
      name: Define `published` as the official date of the log
      enabled: true
      sources:
        - published
    - type: attribute-remapper
      name: Map `displayMessage` to `title`
      enabled: true
      sources:
        - displayMessage
      sourceType: attribute
      target: title
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: message-remapper
      name: Define `displayMessage` as the official message of the log
      enabled: true
      sources:
        - displayMessage
    - type: attribute-remapper
      name: Map `eventType` to `evt.name`
      enabled: true
      sources:
        - eventType
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `outcome.result` to `evt.outcome`
      enabled: true
      sources:
        - outcome.result
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: category-processor
      name: remap @evt.name:user.session.start to evt.category:authentication
      enabled: true
      categories:
        - filter:
            query: '@evt.name:user.session.start'
          name: authentication
      target: evt.category
    - type: attribute-remapper
      name: Map `debugContext.debugData.requestId` to `http.request_id`
      enabled: true
      sources:
        - debugContext.debugData.requestId
      sourceType: attribute
      target: http.request_id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `debugContext.debugData.url` to `http.url`
      enabled: true
      sources:
        - debugContext.debugData.url
      sourceType: attribute
      target: http.url
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: url-parser
      name: ''
      enabled: true
      sources:
        - http.url
      target: http.url_details
    - type: attribute-remapper
      name: Map `client.userAgent.rawUserAgent` to `http.useragent`
      enabled: true
      sources:
        - client.userAgent.rawUserAgent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: user-agent-parser
      name: ''
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
      combineVersionDetails: false
    - type: attribute-remapper
      name: Map `actor.id` to `usr.id`
      enabled: true
      sources:
        - actor.id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actor.alternateId` to `usr.email`
      enabled: true
      sources:
        - actor.alternateId
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actor.displayName` to `usr.name`
      enabled: true
      sources:
        - actor.displayName
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actor.type` to `usr.type`
      enabled: true
      sources:
        - actor.type
      sourceType: attribute
      target: usr.type
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `actor.detailEntry` to `usr.details`
      enabled: true
      sources:
        - actor.detailEntry
      sourceType: attribute
      target: usr.details
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `client.ipAddress` to `network.client.ip`
      enabled: true
      sources:
        - client.ipAddress
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoIP Parser
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `client.geographicalContext.city` to `network.client.geoip.city.name`
      enabled: true
      sources:
        - client.geographicalContext.city
      sourceType: attribute
      target: network.client.geoip.city.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `client.geographicalContext.country` to `network.client.geoip.country.name`
      enabled: true
      sources:
        - client.geographicalContext.country
      sourceType: attribute
      target: network.client.geoip.country.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `client.geographicalContext.state` to `network.client.geoip.subdivision.name`
      enabled: true
      sources:
        - client.geographicalContext.state
      sourceType: attribute
      target: network.client.geoip.subdivision.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: grok-parser
      name: Extracting Login app from requestUri
      enabled: true
      source: http.url_details.path
      samples:
        - /app/snowflake/exk51zugrjS17P5nv356/sso/saml
      grok:
        supportRules: ""
        matchRules: target_app /app/%{word:target_app}.*
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Okta System Log
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: Okta
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: grok-parser
          name: Parsing published
          enabled: true
          source: published
          samples:
            - "2024-08-13T15:58:20.353Z"
          grok:
            supportRules: ""
            matchRules: parsing_time %{date("yyyy-MM-dd'T'HH:mm:ss.SSSZ"):ocsf.time}
        - type: attribute-remapper
          name: Map `displayMessage` to `ocsf.message`
          enabled: true
          sources:
            - displayMessage
          sourceType: attribute
          target: ocsf.message
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventType` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - eventType
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `version` to `ocsf.metadata.product.version`
          enabled: true
          sources:
            - version
          sourceType: attribute
          target: ocsf.metadata.product.version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `uuid` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - uuid
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `outcome.result` to `ocsf.status`
          enabled: true
          sources:
            - outcome.result
          sourceType: attribute
          target: ocsf.status
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: OCSF - status_id mapping
          enabled: true
          categories:
            - filter:
                query: "@outcome.result:SUCCESS"
              name: "1"
            - filter:
                query: "@outcome.result:FAILURE"
              name: "2"
            - filter:
                query: "@outcome.result:*"
              name: "99"
          target: ocsf.status_id
          replaceMissing: false
        - type: category-processor
          name: OCSF - status mapping
          enabled: true
          categories:
            - filter:
                query: "@outcome.result:SUCCESS"
              name: "Success"
            - filter:
                query: "@outcome.result:FAILURE"
              name: "Failure"
          target: ocsf.status
        - type: attribute-remapper
          name: Map `ocsf.status_id` to `ocsf.status_id`
          enabled: true
          sources:
            - ocsf.status_id
          sourceType: attribute
          target: ocsf.status_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Okta OCSF sub pipeline for class Detection Finding [2004]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@eventType:(security.threat.detected OR user.risk.*)"
      processors:
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: 1.3.0
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "2"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Finding
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "2004"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[security_control,datetime]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[date,time]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Detection Finding
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: Informational
          target: ocsf.severity
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity id
          enabled: true
          template: "1"
          target: ocsf.severity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `outcome.result` to `ocsf.action`
          enabled: true
          sources:
            - outcome.result
          sourceType: attribute
          target: ocsf.action
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `outcome.result` to `ocsf.disposition`
          enabled: true
          sources:
            - outcome.result
          sourceType: attribute
          target: ocsf.disposition
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `outcome.reason` to `ocsf.finding_info.title`
          enabled: true
          sources:
            - outcome.reason
          sourceType: attribute
          target: ocsf.finding_info.title
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `uuid` to `ocsf.finding_info.uid`
          enabled: true
          sources:
            - uuid
          sourceType: attribute
          target: ocsf.finding_info.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: OCSF - activity_id mapping
          enabled: true
          categories:
            - filter:
                query: "@eventType:(security.threat.detected OR user.risk.detect)"
              name: Create[1]
            - filter:
                query: "@eventType:(user.risk.change)"
              name: Update[2]
            - filter:
                query: "@eventType:(*)"
              name: Other[99]
          target: activity_id_name
    - type: pipeline
      name: Okta OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@eventType:(app.generic.unauth_app_access_attempt OR
          app.inbound_del_auth.login_success OR app.kerberos_rich_client.* OR
          app.oauth2.authorize OR app.oauth2.authorize.code OR
          application.policy.sign_on.deny_access OR
          system.push.send_factor_verify_push OR user.authentication.* OR
          user.mfa.attempt_bypass OR user.mfa.okta_verify.* OR
          user.session.access_admin_app OR user.session.end OR
          user.session.expire OR user.session.start)"
      processors:
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: 1.3.0
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3002"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Authentication
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: Informational
          target: ocsf.severity
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity id
          enabled: true
          template: "1"
          target: ocsf.severity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `actor.displayName` to `ocsf.user.name`
          enabled: true
          sources:
            - actor.displayName
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.id` to `ocsf.user.uid`
          enabled: true
          sources:
            - actor.id
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `authenticationContext.issuer.id` to `ocsf.actor.session.issuer`
          enabled: true
          sources:
            - authenticationContext.issuer.id
          sourceType: attribute
          target: ocsf.actor.session.issuer
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `debugContext.debugData.url` to `ocsf.dst_endpoint.svc_name`
          enabled: true
          sources:
            - debugContext.debugData.url
          sourceType: attribute
          target: ocsf.dst_endpoint.svc_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `debugContext.debugData.url` to `ocsf.dst_endpoint.svc_name`
          enabled: true
          sources:
            - debugContext.debugData.url
          sourceType: attribute
          target: ocsf.dst_endpoint.svc_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.type` to `ocsf.user.type`
          enabled: true
          sources:
            - actor.type
          sourceType: attribute
          target: ocsf.user.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.displayName` to `ocsf.user.name`
          enabled: true
          sources:
            - actor.displayName
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
