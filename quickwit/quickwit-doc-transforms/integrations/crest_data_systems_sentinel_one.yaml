pipeline:
  type: pipeline
  name: SentinelOne by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_sentinel_one
  processors:
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: geo-ip-parser
      name: Extracting geolocation information from `externalIp`
      enabled: true
      sources:
        - externalIp
      target: externalIp.geoip
      ip_processing_behavior: do-nothing
    - type: geo-ip-parser
      name: Extracting geolocation information from `agentDetectionInfo.externalIp`
      enabled: true
      sources:
        - agentDetectionInfo.externalIp
      target: agentDetectionInfo.externalIp.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `data.srcip` to `network.client.ip`
      enabled: true
      sources:
        - data.srcip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `domain` to `cds.sentinelone.domain`
      enabled: true
      sources:
        - domain
      sourceType: attribute
      target: cds.sentinelone.domain
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.srcport` to `network.client.port`
      enabled: true
      sources:
        - data.srcport
      sourceType: attribute
      target: network.client.port
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.dstip` to `network.destination.ip`
      enabled: true
      sources:
        - data.dstip
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.dstport` to `network.destination.port`
      enabled: true
      sources:
        - data.dstport
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.userId` to `usr.id`
      enabled: true
      sources:
        - data.userId
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.userName`, `agentDetectionInfo.agentLastLoggedInUserName` to `usr.name`
      enabled: true
      sources:
        - data.userName
        - agentDetectionInfo.agentLastLoggedInUserName
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `agentDetectionInfo.agentLastLoggedInUserMail` to `usr.email`
      enabled: true
      sources:
        - agentDetectionInfo.agentLastLoggedInUserMail
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
