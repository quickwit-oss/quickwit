id: akamai
backend_only: true
facets:
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Web Access
    name: Method
    path: http.method
    source: log
  - groups:
      - Web Access
    name: Referer
    path: http.referer
    source: log
  - groups:
      - Web Access
    name: Request ID
    path: http.request_id
    source: log
  - groups:
      - Web Access
    name: Status Code
    path: http.status_code
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Web Access
    name: Version
    path: http.version
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
pipeline:
  type: pipeline
  name: Akamai
  enabled: true
  filter:
    query: source:akamai
  processors:

    # Duration
    - type: arithmetic-processor
      name: Calculate Duration to satisfy the request (in nanoseconds)
      enabled: true
      expression: (netPerf.clientRTT + netPerf.downloadTime) * 1000000
      target: duration
      replaceMissing: false

    # Date
    - type: attribute-remapper
      name: Map `start` to `timestamp`
      enabled: true
      sources:
        - start
      target: timestamp
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp

    # Network fields
    - type: attribute-remapper
      name: Map `cliIP` to `network.client.ip`
      enabled: true
      sources:
        - cliIP
      target: network.client.ip
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `netPerf.edgeIP` to `network.destination.ip`
      enabled: true
      sources:
        - netPerf.edgeIP
      target: network.destination.ip
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `bytes` to `network.bytes_written`
      enabled: true
      sources:
        - bytes
      target: network.bytes_written
      preserveSource: false
      overrideOnConflict: true

    # Geo-location fields
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `geo.country` to `network.client.geoip.country.iso_code`
      enabled: true
      sources:
        - geo.country
      target: network.client.geoip.country.iso_code
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `geo.region` to `network.client.geoip.subdivision.iso_code`
      enabled: true
      sources:
        - geo.region
      target: network.client.geoip.subdivision.iso_code
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `geo.city` to `network.client.geoip.city.name`
      enabled: true
      sources:
        - geo.city
      target: network.client.geoip.city.name
      preserveSource: false
      overrideOnConflict: true

    # HTTP fields
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `reqHdr.referer` to `http.referer`
      enabled: true
      sources:
        - reqHdr.referer
      target: http.referer
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `reqMethod` to `http.method`
      enabled: true
      sources:
        - reqMethod
      target: http.method
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `httpVer` to `http.version`
      enabled: true
      sources:
        - httpVer
      target: http.version
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `reqid` to `http.request_id`
      enabled: true
      sources:
        - reqid
      target: http.request_id
      preserveSource: false
      overrideOnConflict: true

    # HTTP Response Status
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `status` to `http.status_code`
      enabled: true
      sources:
        - status
      target: http.status_code
      targetFormat: integer
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: category-processor
      name: HTTP Status category processor
      enabled: true
      categories:
        # Default is INFO, used for any value not in the following ranges.
        - filter:
            query: '@http.status_code:[200 TO 299]'
          name: Success
        - filter:
            #Values 300-399: JSON Log message view (UI component used by the whole DD) shows it in orange -WARNING- whereas Log Search message pop-up (used only by DD Logs) shows it in grey -NOTICE-
            query: '@http.status_code:[300 TO 399]'
          name: Notice
        - filter:
            query: '@http.status_code:[400 TO 499]'
          name: Warning
        - filter:
            query: '@http.status_code:[500 TO 599]'
          name: Error
      target: http.status_category
    - type: status-remapper
      name: Define `http.status_category` as the official status of the log
      enabled: true
      sources:
        - http.status_category

    # HTTP User-Agent
    - type: attribute-remapper
      name: Map `UA` to `http.useragent`
      enabled: true
      sources:
        - UA
      target: http.useragent
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: user-agent-parser
      name: HTTP User-Agent parser
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false

    # HTTP URL details fields
    - type: attribute-remapper
      name: Map `reqHost` to `http.url_details.host`
      enabled: true
      sources:
      # The value of the Host header of the request. It specifies the domain name of the server, and optionally the TCP port number on which the server is listening.
        - reqHost
      target: http.url_details.host
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `reqPort` to `http.url_details.port`
      enabled: true
      sources:
        - reqPort
      target: http.url_details.port
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `reqPath` to `http.url_details.path`
      enabled: true
      sources:
        - reqPath
      target: http.url_details.path
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `proto` to `http.url_details.scheme`
      enabled: true
      sources:
        - proto
      target: http.url_details.scheme
      preserveSource: false
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
