id: guardduty
backend_only: true # For now guardduty integtation is a sub-integration of the generic AWS integration. However we dont want to install the main AWS integration if we get guardduty logs. So we declare it as backend-only until it has its own tile.
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Geoip
    name: Destination City Name
    path: network.destination.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Destination Continent Code
    path: network.destination.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Destination Continent Name
    path: network.destination.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Destination Country ISO Code
    path: network.destination.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Country Name
    path: network.destination.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision ISO Code
    path: network.destination.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision Name
    path: network.destination.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Web Access
    name: Network Transport
    path: network.transport
    source: log
  - groups:
      - User
    name: User Type
    path: usr.type
    source: log
  - groups:
      - AWS
    name: API Call
    path: detail.service.action.awsApiCallAction.api
    source: log
  - groups:
      - AWS
    name: API Error Code
    path: detail.service.action.awsApiCallAction.errorCode
    source: log
  - groups:
      - AWS
    name: Resource Type
    path: resource.type
    source: log
    type: string
  - groups:
      - AWS EKS
    name: EKS User Group
    path: detail.resource.kubernetesDetails.kubernetesUserDetails.groups
    source: log
  - groups:
      - AWS EKS
    name: EKS Username
    path: detail.resource.kubernetesDetails.kubernetesUserDetails.username
    source: log
  - groups:
      - AWS EKS
    name: EKS Verb
    path: detail.service.action.kubernetesApiCallAction.verb
    source: log
  - groups:
      - AWS EKS
    name: EKS API Call
    path: detail.service.action.kubernetesApiCallAction.parameters
    source: log
  - groups:
      - AWS EKS
    name: EKS API Request URI
    path: detail.service.action.kubernetesApiCallAction.requestUri
    source: log
  - groups:
      - AWS EC2 Network
    name: EC2 Blocked Connection
    path: detail.service.action.networkConnectionAction.blocked
    source: log
  - groups:
      - AWS EC2 Network
    name: EC2 Connection Direction
    path: detail.service.action.networkConnectionAction.connectionDirection
    source: log
  - groups:
      - AWS EKS
    name: EKS Cluster Name
    path: detail.resource.eksClusterDetails.name
    source: log
  - groups:
      - AWS
    name: S3 Bucket
    path: aws.s3.bucket
    source: log
    type: string
  - groups:
      - AWS
    name: S3 Bucket ARN
    path: detail.resource.s3BucketDetails.arn
    source: log
  - groups:
      - AWS
    name: RDS DB Instance ARN
    path: detail.resource.rdsDbInstanceDetails.dbInstanceArn
    source: log
  - groups:
      - AWS
    name: ECS Cluster ARN
    path: detail.resource.ecsClusterDetails.arn
    source: log
  - groups:
      - AWS
    name: Lambda Function ARN
    path: detail.resource.lambdaDetails.functionArn
    source: log
  - groups:
      - AWS
    name: Container Name
    path: detail.resource.containerDetails.name
    source: log
pipeline:
  type: pipeline
  name: AWS Guardduty
  enabled: true
  filter:
    query: source:guardduty
  processors:
    - type: date-remapper
      name: Define `time` as the official date of the log
      enabled: true
      sources:
        - time
    - type: message-remapper
      name: Define `detail.description` as the official message of the log
      enabled: true
      sources:
        - detail.description

    - type: attribute-remapper
      name: Map `detail.title` to `title`
      enabled: true
      sources:
        - detail.title
      target: title
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.resource.s3BucketDetails.name` to `aws.s3.bucket`
      enabled: true
      sources:
        - detail.resource.s3BucketDetails.name
      target: aws.s3.bucket
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.type` to `evt.name`
      enabled: true
      sources:
        - detail.type
      target: evt.name
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.service.action.networkConnectionAction.protocol` to `network.transport`
      enabled: true
      sources:
        - detail.service.action.networkConnectionAction.protocol
      target: network.transport
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.resource.accessKeyDetails.userType` to `usr.type`
      enabled: true
      sources:
        - detail.resource.accessKeyDetails.userType
      target: usr.type
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.resource.accessKeyDetails.principalId` to `usr.id`
      enabled: true
      sources:
        - detail.resource.accessKeyDetails.principalId
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: attribute-remapper
      name: Map `detail.resource.resourceType` to `resource.type`
      enabled: true
      sources:
        - detail.resource.resourceType
      target: resource.type
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute

    - type: pipeline
      name: Inbound API Calls
      enabled: true
      filter:
        query: '@detail.service.action.actionType:AWS_API_CALL @detail.service.action.awsApiCallAction.callerType:"Remote IP"'
      processors:
        - type: attribute-remapper
          name: Map `detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4` to `network.client.ip`
          enabled: true
          sources:
            - detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4
          target: network.client.ip
          preserveSource: true
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

    - type: pipeline
      name: Inbound Connections
      enabled: true
      filter:
        query: '@detail.service.action.networkConnectionAction.connectionDirection:INBOUND'
      processors:
        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4` to `network.client.ip`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4
          target: network.client.ip
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remotePortDetails.port` to `network.client.port`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remotePortDetails.port
          target: network.client.port
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remotePortDetails.portName` to `network.client.port.name`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remotePortDetails.portName
          target: network.client.port.name
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

    - type: pipeline
      name: Outbound Connections
      enabled: true
      filter:
        query: '@detail.service.action.networkConnectionAction.connectionDirection:OUTBOUND'
      processors:
        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4` to `network.destination.ip`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4
          target: network.destination.ip
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remotePortDetails.port` to `network.destination.port`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remotePortDetails.port
          target: network.destination.port
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

        - type: attribute-remapper
          name: Map `detail.service.action.networkConnectionAction.remotePortDetails.portName` to `network.destination.port.name`
          enabled: true
          sources:
            - detail.service.action.networkConnectionAction.remotePortDetails.portName
          target: network.destination.port.name
          preserveSource: false
          overrideOnConflict: false
          sourceType: attribute
          targetType: attribute

    - type: attribute-remapper
      name: Map attribute `detail.resource.instanceDetails.availabilityZone` to tag `availability-zone`
      enabled: true
      sources:
        - detail.resource.instanceDetails.availabilityZone
      target: availability-zone
      targetType: tag
      preserveSource: true
      overrideOnConflict: false

      sourceType: attribute
    - type: attribute-remapper
      name: Map attribute `detail.resource.instanceDetails.imageId` to tag `image`
      enabled: true
      sources:
        - detail.resource.instanceDetails.imageId
      target: image
      targetType: tag
      preserveSource: true
      overrideOnConflict: false

      sourceType: attribute
    - type: attribute-remapper
      name: Map attribute `detail.resource.instanceDetails.instanceId` to tag `instance-id`
      enabled: true
      sources:
        - detail.resource.instanceDetails.instanceId
      target: instance-id
      targetType: tag
      preserveSource: true
      overrideOnConflict: false

      sourceType: attribute
    - type: attribute-remapper
      name: Map attribute `detail.resource.instanceDetails.instanceType` to tag `instance-type`
      enabled: true
      sources:
        - detail.resource.instanceDetails.instanceType
      target: instance-type
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute

    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip

    - type: geo-ip-parser
      name: Fetching GeoIp data for destination ip
      enabled: true
      sources:
        - network.destination.ip
      target: network.destination.geoip
