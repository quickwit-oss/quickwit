id: gsuite
metric_id: gsuite
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Gsuite
    name: Email Forwarding Destination
    path: evt.forwarding_destination_email
    source: log
  - groups:
      - GSuite
    name: Event Parameters User Email
    path: event.parameters.USER_EMAIL
    source: log
  - groups:
      - User
    name: User Role Name
    path: usr.role
    source: log
  - groups:
      - Event
    name: Event Resource
    path: evt.resource
    source: log
pipeline:
  type: pipeline
  name: GSuite
  enabled: true
  filter:
    query: source:gsuite
  processors:
    - type: date-remapper
      name: Define `id.time` as the official date of the log
      enabled: true
      sources:
        - id.time
    - type: service-remapper
      name: Define `id.applicationName` as the official service of the log
      enabled: true
      sources:
        - id.applicationName
    - type: attribute-remapper
      name: Map `event.name` to `evt.name`
      enabled: true
      sources:
        - event.name
      target: evt.name
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `event.type` to `evt.category`
      enabled: true
      sources:
        - event.type
      target: evt.category
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `actor.email`, `event.parameters.affected_email_address` to `usr.email`
      enabled: true
      sources:
        - actor.email
        - event.parameters.affected_email_address
      target: usr.email
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `event.parameters.email_forwarding_destination_address` to `evt.forwarding_destination_email`
      enabled: true
      sources:
        - event.parameters.email_forwarding_destination_address
      target: evt.forwarding_destination_email
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `event.parameters.ROLE_NAME` to `usr.role`
      enabled: true
      sources:
        - event.parameters.ROLE_NAME
      target: usr.role
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `event.parameters.resource_title` to `evt.resource`
      enabled: true
      sources:
        - event.parameters.resource_title
      target: evt.resource
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `actor.profileId` to `usr.id`
      enabled: true
      sources:
        - actor.profileId
      target: usr.id
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `ipAddress` to `network.client.ip`
      enabled: true
      sources:
        - ipAddress
      target: network.client.ip
      preserveSource: false
      overrideOnConflict: false

      sourceType: attribute
      targetType: attribute
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip

    - type: string-builder-processor
      name: Actor %{usr.email} performed an event %{evt.name} - in attribute title
      enabled: true
      target: title
      template: Actor "%{usr.email}" performed "%{evt.name}" event
      replaceMissing: true
