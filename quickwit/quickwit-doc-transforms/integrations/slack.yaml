          enabled: true
          sources:
            - id
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Slack OCSF sub pipeline for class Account Change [3001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query:
          "@ocsf.metadata.event_code:(organization_accepted_migration OR owner_transferred OR
          permissions_assigned OR permissions_removed OR
          pref.dm_retention_changed OR role_assigned OR role_change_to_admin OR
          role_change_to_guest OR role_change_to_owner OR role_change_to_user OR
          role_removed OR user_created OR user_deactivated OR user_email_updated
          OR user_joined_workspace OR user_password_reset_requested OR
          user_password_reset_slack_security OR user_reactivated)"
      processors:
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3001"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Account Change
          target: ocsf.class_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `action` to `ocsf.activity_name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.name` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - actor.user.name
          sourceType: attribute
          target: ocsf.actor.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.id` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - actor.user.id
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
