    name: Slack App ID
    path: slack.app.id
    source: log
  - groups:
      - Slack
    name: Slack App Name
    path: slack.app.name
    source: log
  - groups:
      - Slack
    name: Slack App Permission
    path: slack.app.permission
    source: log
pipeline:
  type: pipeline
  name: Slack Pipeline
  enabled: true
  filter:
    query: source:slack
  processors:
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: pipeline
      name: Audit Logs Service
      enabled: true
      filter:
        query: service:audit-logs-service
      processors:
        - type: arithmetic-processor
          name: Get a timestamp in milliseconds
          enabled: true
          expression: date_create * 1000
          target: date_create_milliseconds
          replaceMissing: true
        - type: date-remapper
          name: Define `date_create_milliseconds` as the official date of the log
          enabled: true
          sources:
            - date_create_milliseconds
        - type: attribute-remapper
          name: Map `context.ip_address` to `network.client.ip`
          enabled: true
          sources:
            - context.ip_address
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: Geoip parser
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - type: attribute-remapper
          name: Map `action` to `evt.name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: evt.name
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.email` to `usr.email`
          enabled: true
          sources:
            - actor.user.email
          sourceType: attribute
          target: usr.email
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.id` to `usr.id`
          enabled: true
          sources:
            - actor.user.id
          sourceType: attribute
          target: usr.id
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.name` to `usr.name`
          enabled: true
          sources:
            - actor.user.name
          sourceType: attribute
          target: usr.name
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.team` to `usr.team`
          enabled: true
          sources:
            - actor.user.team
          sourceType: attribute
          target: usr.team
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.type` to `usr.type`
          enabled: true
