          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: OCSF - activity_id mapping
          enabled: true
          categories:
            - filter:
                query: "@action:(user_created)"
              name: "1"
            - filter:
                query: "@action:(user_password_reset_requested OR
                  user_password_reset_slack_security)"
              name: "4"
            - filter:
                query: "@action:(*)"
              name: "99"
          target: ocsf.activity_id
        - type: category-processor
          name: OCSF - activity_name mapping
          enabled: true
          categories:
            - filter:
                query: "@ocsf.activity_id:(1)"
              name: Create
            - filter:
                query: "@ocsf.activity_id:(4)"
              name: Password Reset
          target: ocsf.activity_name
    - type: pipeline
