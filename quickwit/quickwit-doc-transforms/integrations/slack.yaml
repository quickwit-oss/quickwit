            - actor.type
          sourceType: attribute
          target: usr.type
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `context.ua` to `http.useragent`
          enabled: true
          sources:
