      "policy" : {
        "severity" : "high",
        "lastModifiedBy" : "test@gmail.com",
        "hasSearchExecutionSupport" : true,
        "description" : "This policy identifies Azure Virtual Machine disks that are configured with public network access.\n\nAllowing public access to Azure Virtual Machine disk resources increases the risk of unauthorized access and potential security breaches. Public network access exposes sensitive data to external threats, which attackers could exploit to compromise VM disks. Disabling public access and using Azure Private Link reduces exposure, ensuring only trusted networks have access and enhancing the security of your Azure environment by minimizing the risk of data leaks and breaches.\n\nAs a security best practice, it is recommended to disable public network access for Azure Virtual Machine disks.",
        "recommendation" : "1. Log in to the Azure portal\n2. Navigate to 'Disks'\n3. Click on the reported disk\n4. Under 'Settings', go to 'Networking'\n5. Ensure that Network access is NOT set to 'Enable public access from all networks'\n6. Click 'Save'",
        "remediable" : true,
        "labels" : [ "Prisma_Cloud" ],
        "lastModifiedOn" : 1730917214889,
        "systemDefault" : true,
        "remediation" : {
          "impact" : "Disable public network access for Azure Virtual Machine disk",
          "description" : "This CLI command requires 'Microsoft.Compute/disks/write' permission. Successful execution will disable public network access and sets the network access policy to DenyAll for the specified disk, blocking external access. \nNote: As a security best practice, we are disabling public and private access to the disk. However, you can choose between the following options based on your security requirements:\n- Disable public access and enable private access\n- Disable public and private access",
          "cliScriptTemplate" : "az disk update --name ${resourceName} --resource-group ${resourceGroup} --public-network-access Disabled --network-access-policy DenyAll"
        },
        "deleted" : false,
        "policyId" : "fa6e9e09-d02e-418a-baed692391ed",
        "policyType" : "config",
        "name" : "Azure VM disk configured with public network access"
      }
    }
