      policy:
        deleted: false
        description: |-
          This policy identifies Azure Virtual Machine disks that are configured with public network access.

          Allowing public access to Azure Virtual Machine disk resources increases the risk of unauthorized access and potential security breaches. Public network access exposes sensitive data to external threats, which attackers could exploit to compromise VM disks. Disabling public access and using Azure Private Link reduces exposure, ensuring only trusted networks have access and enhancing the security of your Azure environment by minimizing the risk of data leaks and breaches.

          As a security best practice, it is recommended to disable public network access for Azure Virtual Machine disks.
        hasSearchExecutionSupport: true
        labels:
         - "Prisma_Cloud"
        lastModifiedBy: "test@gmail.com"
        lastModifiedOn: 1730917214889
        name: "Azure VM disk configured with public network access"
        policyId: "fa6e9e09-d02e-418a-baed692391ed"
        policyType: "config"
        recommendation: |-
          1. Log in to the Azure portal
          2. Navigate to 'Disks'
          3. Click on the reported disk
          4. Under 'Settings', go to 'Networking'
          5. Ensure that Network access is NOT set to 'Enable public access from all networks'
          6. Click 'Save'
        remediable: true
        remediation:
          cliScriptTemplate: "az disk update --name ${resourceName} --resource-group ${resourceGroup} --public-network-access Disabled --network-access-policy DenyAll"
          description: "This CLI command requires 'Microsoft.Compute/disks/write' permission. Successful execution will disable public network access and sets the network access policy to DenyAll for the specified disk, blocking external access. \nNote: As a security best practice, we are disabling public and private access to the disk. However, you can choose between the following options based on your security requirements:\n- Disable public access and enable private access\n- Disable public and private access"
          impact: "Disable public network access for Azure Virtual Machine disk"
        severity: "high"
        systemDefault: true
