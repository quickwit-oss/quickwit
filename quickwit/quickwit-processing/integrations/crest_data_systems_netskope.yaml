pipeline:
  type: pipeline
  name: Netskope by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_netskope
  processors:
    - type: attribute-remapper
      name: Map `cds-netskope-browser` to `http.useragent_details.browser.family`
      enabled: true
      sources:
        - cds-netskope-browser
      sourceType: attribute
      target: http.useragent_details.browser.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-user` to `usr.email`
      enabled: true
      sources:
        - cds-netskope-user
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-device` to `http.useragent_details.device.family`
      enabled: true
      sources:
        - cds-netskope-device
      sourceType: attribute
      target: http.useragent_details.device.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-os` to `http.useragent_details.os.family`
      enabled: true
      sources:
        - cds-netskope-os
      sourceType: attribute
      target: http.useragent_details.os.family
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-destination-location` to
        `network.destination.geoip.city.name`
      enabled: true
      sources:
        - cds-netskope-destination-location
      sourceType: attribute
      target: network.destination.geoip.city.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-source-ip` to `network.client.ip`
      enabled: true
      sources:
        - cds-netskope-source-ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-domain` to `http.url_details.host`
      enabled: true
      sources:
        - cds-netskope-domain
      sourceType: attribute
      target: http.url_details.host
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-source-country` to
        `network.client.geoip.country.iso_code`
      enabled: true
      sources:
        - cds-netskope-source-country
      sourceType: attribute
      target: network.client.geoip.country.iso_code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-source-location` to `network.client.geoip.city.name`
      enabled: true
      sources:
        - cds-netskope-source-location
      sourceType: attribute
      target: network.client.geoip.city.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-destination-country` to
        `network.destination.geoip.country.iso_code`
      enabled: true
      sources:
        - cds-netskope-destination-country
      sourceType: attribute
      target: network.destination.geoip.country.iso_code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-destination-ip` to `network.destination.ip`
      enabled: true
      sources:
        - cds-netskope-destination-ip
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-destination-port` to `network.destination.port`
      enabled: true
      sources:
        - cds-netskope-destination-port
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `cds-netskope-activity` to `evt.name`
      enabled: true
      sources:
        - cds-netskope-activity
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: status-remapper
      name: Define `cds-netskope-severity-level` as the official status of the log
      enabled: true
      sources:
        - cds-netskope-severity-level
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - name: Lookup for `cds-netskope-severity`
      enabled: true
      source: cds-netskope-severity
      target: cds-netskope-severity
      lookupTable: |-
        critical,Critical
        high,High
        medium,Medium
        low,Low
        info,Info
      type: lookup-processor
