id: 1password
metric_id: onepassword
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Event
    name: Event Type
    path: evt.type
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: Geoip
    source: log
  - groups:
      - 1Password
    name: Session ID
    path: session.uuid
    source: log
  - groups:
      - 1Password
    name: Item ID
    path: item_uuid
    source: log
  - groups:
      - 1Password
    name: Vault ID
    path: vault_uuid
    source: log
  - groups:
      - 1Password
    name: Device ID
    path: session.device_uuid
    source: log
  - groups:
      - 1Password
    name: Object ID
    path: object_uuid
    source: log
  - groups:
      - 1Password
    name: Object Type
    path: object_type
    source: log
pipeline:
  type: pipeline
  name: 1Password
  enabled: true
  filter:
    query: source:1password
  processors:
    - type: attribute-remapper
      name: Map `action` to `evt.name`
      enabled: true
      sources:
        - action
      target: evt.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `activity_type` to `evt.type`
      enabled: true
      sources:
        - activity_type
      target: evt.type
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `type` to `evt.category`
      enabled: true
      sources:
        - type
      target: evt.category
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `category` to `evt.outcome`
      enabled: true
      sources:
        - category
      target: evt.outcome
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `client.ip_address`, `session.ip` to `network.client.ip`
      enabled: true
      sources:
        - client.ip_address
        - session.ip
      target: network.client.ip
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `location.city` to `network.client.geoip.city.name`
      enabled: true
      sources:
        - location.city
      target: network.client.geoip.city.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `location.country`, `country` to `network.client.geoip.country.name`
      enabled: true
      sources:
        - location.country
        - country
      target: network.client.geoip.country.name
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `location.region` to `network.client.geoip.subdivision.name`
      enabled: true
      sources:
        - location.region
      target: network.client.geoip.subdivision.name
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `location.latitude` to `network.client.geoip.location.latitude`
      enabled: true
      sources:
        - location.latitude
      target: network.client.geoip.location.latitude
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `location.longitude` to `network.client.geoip.location.latitude`
      enabled: true
      sources:
        - location.longitude
      target: network.client.geoip.location.latitude
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `target_user.email`, `user.email`, `actor_details.email` to `usr.email`
      enabled: true
      sources:
        - target_user.email
        - user.email
        - actor_details.email
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `target_user.name`, `user.name`, `actor_details.name` to `usr.name`
      enabled: true
      sources:
        - target_user.name
        - user.name
        - actor_details.name
      target: usr.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `target_user.uuid`, `actor_uuid`, `user.uuid`, `actor_details.uuid` to `usr.id`
      enabled: true
      sources:
        - target_user.uuid
        - actor_uuid
        - user.uuid
        - actor_details.uuid
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[datetime]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[date,time]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: attribute-remapper
          name: Map `uuid` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - uuid
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `timestamp` to `ocsf.time_dt`
          enabled: true
          sources:
            - timestamp
          sourceType: attribute
          target: ocsf.time_dt
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parsing event time
          enabled: true
          source: ocsf.time_dt
          samples:
            - "2025-05-01T12:15:39.043474332Z"
            - "2025-05-01T12:15:39.04347433Z"
            - "2025-05-01T12:15:39.0434743Z"
            - "2025-04-30T14:27:57.714605-04:00"
            - "2025-05-01T12:15:39.0434Z"
            - "2025-05-01T12:15:39.044Z"
            - "2025-05-01T12:15:39.04Z"
            - "2023-03-15T16:33:50-03:00"
          grok:
            supportRules: ""
            matchRules: |
              parsing_time %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ"):ocsf.time}
              parsing_time_1 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSZ"):ocsf.time}
              parsing_time_2 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSSZ"):ocsf.time}
              parsing_time_3 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"):ocsf.time}
              parsing_time_4 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSZ"):ocsf.time}
              parsing_time_5 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSZ"):ocsf.time}
              parsing_time_6 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSZ"):ocsf.time}
              parsing_time_7 %{date("yyyy-MM-dd'T'HH:mm:ss.SSZ"):ocsf.time}
              parsing_time_8 %{date("yyyy-MM-dd'T'HH:mm:ssZ"):ocsf.time}
        - type: attribute-remapper
          name: Map `action` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: 1.3.0
          target: ocsf.metadata.version
        - type: attribute-remapper
          name: Map `activity_type` to `ocsf.metadata.log_name`
          enabled: true
          sources:
            - activity_type
          sourceType: attribute
          target: ocsf.metadata.log_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: 1Password Events API
          target: ocsf.metadata.product.name
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: 1Password
          target: ocsf.metadata.product.vendor_name
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: Informational
          target: ocsf.severity
        - type: string-builder-processor
          name: Add severity id
          enabled: true
          template: "1"
          target: ocsf.severity_id
        - type: attribute-remapper
          name: Map `location.latitude` to `ocsf.src_endpoint.location.lat`
          enabled: true
          sources:
            - location.latitude
          sourceType: attribute
          target: ocsf.src_endpoint.location.lat
          targetType: attribute
          targetFormat: double
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `location.longitude` to `ocsf.src_endpoint.location.long`
          enabled: true
          sources:
            - location.longitude
          sourceType: attribute
          target: ocsf.src_endpoint.location.long
          targetType: attribute
          targetFormat: double
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `location.city` to `ocsf.src_endpoint.location.city`
          enabled: true
          sources:
            - location.city
          sourceType: attribute
          target: ocsf.src_endpoint.location.city
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add actor type id
          enabled: true
          template: "1"
          target: ocsf.actor.user.type_id
        - type: string-builder-processor
          name: Add actor type
          enabled: true
          template: User
          target: ocsf.actor.user.type
        - type: attribute-remapper
          name: Map `target_user.uuid`, `actor_uuid`, `user.uuid` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - target_user.uuid
            - actor_uuid
            - user.uuid
          target: ocsf.actor.user.uid
          sourceType: attribute
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `target_user.name`, `actor_details.name`, `user.name` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - target_user.name
            - actor_details.name
            - user.name
          target: ocsf.actor.user.name
          sourceType: attribute
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `target_user.email`, `actor_details.email`, `user.email` to `ocsf.actor.user.email_addr`
          enabled: true
          sources:
            - target_user.email
            - actor_details.email
            - user.email
          target: ocsf.actor.user.email_addr
          sourceType: attribute
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `client.app_name` to `ocsf.actor.app_name`
          enabled: true
          sources:
            - client.app_name
          sourceType: attribute
          target: ocsf.actor.app_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `client.ip_address`, `session.ip` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - client.ip_address
            - session.ip
          target: ocsf.src_endpoint.ip
          sourceType: attribute
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `client.os_name` to `ocsf.src_endpoint.os.name`
          enabled: true
          sources:
            - client.os_name
          sourceType: attribute
          target: ocsf.src_endpoint.os.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `client.os_name` to `ocsf.src_endpoint.os.type`
          enabled: true
          sources:
            - client.os_name
          sourceType: attribute
          target: ocsf.src_endpoint.os.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Map OS type ID
          enabled: true
          categories:
            - filter:
                query: "@ocsf.src_endpoint.os.name:Windows"
              name: "100"
            - filter:
                query: "@ocsf.src_endpoint.os.name:Linux"
              name: "200"
            - filter:
                query: "@ocsf.src_endpoint.os.name:Android"
              name: "201"
            - filter:
                query: "@ocsf.src_endpoint.os.name:MacOSX"
              name: "300"
            - filter:
                query: "@ocsf.src_endpoint.os.name:iOS"
              name: "301"
            - filter:
                query: "@ocsf.src_endpoint.os.name:*"
              name: "99"
          target: ocsf.src_endpoint.os.type_id
        - type: attribute-remapper
          name: Map `ocsf.src_endpoint.os.type_id` to `ocsf.src_endpoint.os.type_id`
          enabled: true
          sources:
            - ocsf.src_endpoint.os.type_id
          sourceType: attribute
          target: ocsf.src_endpoint.os.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: Map OS type
          enabled: true
          categories:
            - filter:
                query: "@ocsf.src_endpoint.os.name:Windows"
              name: "Windows"
            - filter:
                query: "@ocsf.src_endpoint.os.name:Linux"
              name: "Linux"
            - filter:
                query: "@ocsf.src_endpoint.os.name:Android"
              name: "Android"
            - filter:
                query: "@ocsf.src_endpoint.os.name:MacOSX"
              name: "macOS"
            - filter:
                query: "@ocsf.src_endpoint.os.name:iOS"
              name: "iOS"
          target: ocsf.src_endpoint.os.type
        - type: attribute-remapper
          name: Map `client.os_version` to `ocsf.src_endpoint.os.version`
          enabled: true
          sources:
            - client.os_version
          sourceType: attribute
          target: ocsf.src_endpoint.os.version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `details.value` to `ocsf.message`
          enabled: true
          sources:
            - details.value
          sourceType: attribute
          target: ocsf.message
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add status
          enabled: true
          template: Success
          target: ocsf.status
        - type: string-builder-processor
          name: Add status id
          enabled: true
          template: "1"
          target: ocsf.status_id
    - type: pipeline
      name: 1Password OCSF sub pipeline for class Account Change [3001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@object_type:user @ocsf.metadata.event_code:(enblmfa OR updatmfa OR disblmfa OR verify OR join OR activate OR reactive OR suspend OR delete OR beginr OR completr OR cancelr OR trvlaway OR trvlback OR changeks OR changemp OR changesk OR changenm OR changela OR tdvcsso OR sdvcsso)"
      processors:
        - type: attribute-remapper
          name: Map `action` to `ocsf.activity_name`
          enabled: true
          sources:
            - action
          sourceType: attribute
          target: ocsf.activity_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: activity_id
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:(join)"
              name: "1"
            - filter:
                query: "@ocsf.metadata.event_code:(activate)"
              name: "2"
            - filter:
                query: "@ocsf.metadata.event_code:(changemp)"
              name: "3"
            - filter:
                query: "@ocsf.metadata.event_code:(suspend)"
              name: "5"
            - filter:
                query: "@ocsf.metadata.event_code:(delete)"
              name: "6"
            - filter:
                query: "@ocsf.metadata.event_code:(enblmfa)"
              name: "10"
            - filter:
                query: "@ocsf.metadata.event_code:(disblmfa)"
              name: "11"
            - filter:
                query: "@ocsf.metadata.event_code:*"
              name: "99"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: category-processor
          name: activity_name
          enabled: true
          categories:
            - filter:
                query: "@ocsf.metadata.event_code:(join)"
              name: "Create"
            - filter:
                query: "@ocsf.metadata.event_code:(activate)"
              name: "Enable"
            - filter:
                query: "@ocsf.metadata.event_code:(changemp)"
              name: "Password Change"
            - filter:
                query: "@ocsf.metadata.event_code:(suspend)"
              name: "Disable"
            - filter:
                query: "@ocsf.metadata.event_code:(delete)"
              name: "Delete"
            - filter:
                query: "@ocsf.metadata.event_code:(enblmfa)"
              name: "MFA Factor enable"
            - filter:
                query: "@ocsf.metadata.event_code:(disblmfa)"
              name: "MFA Factor Disable"
          target: ocsf.activity_name
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3001"
          target: ocsf.class_uid
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Account Change
          target: ocsf.class_name
        - type: attribute-remapper
          name: Map `aux_uuid`, `object_details.uuid` to `ocsf.user.uid`
          enabled: true
          sources:
            - aux_uuid
            - object_details.uuid
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `aux_details.name`, `object_details.name` to `ocsf.user.name`
          enabled: true
          sources:
            - aux_details.name
            - object_details.name
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `aux_details.email`, `object_details.email` to `ocsf.user.email_addr`
          enabled: true
          sources:
            - aux_details.email
            - object_details.email
          sourceType: attribute
          target: ocsf.user.email_addr
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add user type id
          enabled: true
          template: "1"
          target: ocsf.user.type_id
        - type: string-builder-processor
          name: Add user type
          enabled: true
          template: User
          target: ocsf.user.type
    - type: pipeline
      name: 1Password OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:1password-sign-in-attempts"
      processors:
        - type: string-builder-processor
          name: Add activity id
          enabled: true
          template: "1"
          target: ocsf.activity_id
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add activity name
          enabled: true
          template: Logon
          target: ocsf.activity_name
        - type: attribute-remapper
          name: Map `category` to `ocsf.status`
          enabled: true
          sources:
            - category
          sourceType: attribute
          target: ocsf.status
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: status
          enabled: true
          categories:
            - filter:
                query: "@category:(success)"
              name: "1"
            - filter:
                query: "@category:(credentials_failed OR mfa_failed OR sso_failed OR modern_version_failed OR firewall_failed)"
              name: "2"
            - filter:
                query: "@category:*"
              name: "99"
          target: ocsf.status_id
        - type: category-processor
          name: status name
          enabled: true
          categories:
            - filter:
                query: "@category:(success)"
              name: "Success"
            - filter:
                query: "@category:(credentials_failed OR mfa_failed OR sso_failed OR modern_version_failed OR firewall_failed)"
              name: "Failure"
          target: ocsf.status
        - type: attribute-remapper
          name: Map `ocsf.metadata.log_name` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - ocsf.metadata.log_name
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `type` to `ocsf.status_detail`
          enabled: true
          sources:
            - type
          sourceType: attribute
          target: ocsf.status_detail
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "3"
          target: ocsf.category_uid
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Identity & Access Management
          target: ocsf.category_name
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "3002"
          target: ocsf.class_uid
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: Authentication
          target: ocsf.class_name
        - type: string-builder-processor
          name: Add service name
          enabled: true
          template: 1Password
          target: ocsf.service.name
        - type: attribute-remapper
          name: Map `target_user.uuid` to `ocsf.user.uid`
          enabled: true
          sources:
            - target_user.uuid
          sourceType: attribute
          target: ocsf.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `target_user.name` to `ocsf.user.name`
          enabled: true
          sources:
            - target_user.name
          sourceType: attribute
          target: ocsf.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `target_user.email` to `ocsf.user.email_addr`
          enabled: true
          sources:
            - target_user.email
          sourceType: attribute
          target: ocsf.user.email_addr
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add user type id
          enabled: true
