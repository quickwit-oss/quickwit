id: crowdstrike
metric_id: crowdstrike
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - Event
    name: Event Type
    path: evt.type
    source: log
  - groups:
      - Event
    name: Event Description
    path: event.detect_description
    source: log
  - groups:
      - Event
    name: Falcon Host Link
    path: event.falcon_host_link
    source: log
pipeline:
  type: pipeline
  name: CrowdStrike
  enabled: true
  filter:
    query: source:crowdstrike
  processors:
    - type: attribute-remapper
      name: Map `event.user_ip` to `network.client.ip`
      enabled: true
      sources:
        - event.user_ip
      target: network.client.ip
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: geo-ip-parser
      name: GeoIP enrichment
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      encoded: false
    - type: attribute-remapper
      name: Map `event.user_id` to `usr.id`
      enabled: true
      sources:
        - event.user_id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.user_name` to `usr.id`
      enabled: true
      sources:
        - event.user_name
      sourceType: attribute
      target: usr.id
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.computer_name` to `host`
      enabled: true
      sources:
        - event.computer_name
      sourceType: attribute
      target: host
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.success` to `evt.outcome`
      enabled: true
      sources:
        - event.success
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.operation_name` to `evt.name`
      enabled: true
      sources:
        - event.operation_name
      sourceType: attribute
      target: evt.name
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `metadata.event_type` to `evt.type`
      enabled: true
      sources:
        - metadata.event_type
      sourceType: attribute
      target: evt.type
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.service_name` to `evt.service`
      enabled: true
      sources:
        - event.service_name
      sourceType: attribute
      target: evt.service
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `metadata.event_creation_time` to `evt.timestamp`
      enabled: true
      sources:
        - metadata.event_creation_time
      sourceType: attribute
      target: evt.timestamp
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: date-remapper
      name: Define `evt.timestamp` as the official date of the log
      enabled: true
      sources:
        - evt.timestamp
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
