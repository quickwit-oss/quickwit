id: vpc
backend_only: true # For now vpc integtation is a sub-integration of the generic AWS integration. However we dont want to install the main AWS integration if we get guardduty logs. So we declare it as backend-only until it has its own tile.
facets:
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - facetType: range
    groups:
      - Web Access
    name: Bytes Written
    path: network.bytes_written
    source: log
    type: double
    unit:
      family: bytes
      name: byte
  - groups:
      - VPC
    name: Action
    path: vpc.action
    source: log
  - groups:
      - VPC
    name: Interface
    path: network.interface
    source: log
  - groups:
      - AWS
    name: Log Group
    path: aws.awslogs.logGroup
    source: log
pipeline:
  type: pipeline
  name: AWS VPC Flow Logs
  enabled: true
  filter:
    query: source:vpc
  processors:
    - type: grok-parser
      name: Parsing VPC flow logs
      enabled: true
      source: message
      samples:
        - 2 123456789010 eni-abc123de 172.31.16.139 172.31.16.21 20641 22 6 20 4249 1418530010 1418530070 ACCEPT OK
        - 2 123456789010 eni-abc123de 172.31.9.69 172.31.9.12 49761 3389 6 20 4249 1418530010 1418530070 REJECT OK
        - 2 123456789010 eni-1a2b3c4d - - - - - - - 1431280876 1431280934 - NODATA
        - 2 123456789010 eni-4b118871 - - - - - - - 1431280876 1431280934 - SKIPDATA
      grok:
        supportRules: |
        matchRules: |
          vpc_flow_logs %{integer:vpc.version} %{notSpace:aws.account_id} %{notSpace:network.interface:nullIf("-")} %{notSpace:network.client.ip:nullIf("-")} %{notSpace:network.destination.ip:nullIf("-")} (?>%{integer:network.client.port}|-) (?>%{integer:network.destination.port}|-) %{notSpace:network.protocol:nullIf("-")} (?>%{integer:network.packet}|-) (?>%{integer:network.bytes_written}|-) %{integer:vpc.interval.start} %{integer:vpc.interval.end} (?>%{word:vpc.action}|-) %{word:vpc.status}.*
    - type: attribute-remapper
      name: Map attribute `aws.account_id` to tag `account`
      enabled: true
      sources:
        - aws.account_id
      target: account
      targetType: tag
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
    - type: lookup-processor
      name: Map level based on vpc.status
      enabled: true
      source: vpc.status
      target: level
      lookupTable: "OK,OK\nNODATA,INFO\nSKIPDATA,WARNING\n"
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
