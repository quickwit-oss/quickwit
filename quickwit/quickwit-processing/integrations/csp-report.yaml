id: csp-report
backend_only: true # csp-report is an security integration not really living outside of logs-backend
facets:
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - CSP Report
    name: Blocked URI Host
    path: csp-report.blocked-uri_details.host
    source: log
  - groups:
      - CSP Report
    name: Blocked URI Path
    path: csp-report.blocked-uri_details.path
    source: log
  - groups:
      - CSP Report
    name: Blocked URI Scheme
    path: csp-report.blocked-uri_details.scheme
    source: log
  - groups:
      - CSP Report
    name: Disposition
    path: csp-report.disposition
    source: log
  - groups:
      - CSP Report
    name: Document URI Host
    path: csp-report.document-uri_details.host
    source: log
  - groups:
      - CSP Report
    name: Document URI Path
    path: csp-report.document-uri_details.path
    source: log
  - groups:
      - CSP Report
    name: Document URI Scheme
    path: csp-report.document-uri_details.scheme
    source: log
  - groups:
      - CSP Report
    name: Effective Directive
    path: csp-report.effective-directive
    source: log
  - groups:
      - CSP Report
    name: Referrer Host
    path: csp-report.referrer_details.host
    source: log
  - groups:
      - CSP Report
    name: Referrer Path
    path: csp-report.referrer_details.path
    source: log
  - groups:
      - CSP Report
    name: Referrer Scheme
    path: csp-report.referrer_details.scheme
    source: log
  - groups:
      - CSP Report
    name: Violated Directive
    path: csp-report.violated-directive
    source: log
pipeline:
  type: pipeline
  name: Content Security Policy Report
  enabled: true
  filter:
    query: source:csp-report
  processors:
    - type: string-builder-processor
      name: Defining title as Directive %{csp-report.violated-directive} was violated (%{csp-report.disposition}) at %{network.client.ip}
      enabled: true
      template: Directive %{csp-report.violated-directive} was violated (%{csp-report.disposition}) at %{network.client.ip}
      target: title
      replaceMissing: true
    - type: url-parser
      name: Blocked URI parser
      enabled: true
      sources:
        - csp-report.blocked-uri
      target: csp-report.blocked-uri_details
    - type: url-parser
      name: Document URI parser
      enabled: true
      sources:
        - csp-report.document-uri
      target: csp-report.document-uri_details
    - type: url-parser
      name: Referrer parser
      enabled: true
      sources:
        - csp-report.referrer
      target: csp-report.referrer_details
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      encoded: false
    - type: user-agent-parser
      name: HTTP User-Agent parser
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
    - type: attribute-remapper
      name: Map tag `service` to an attribute
      enabled: true
      sources:
        - service
      sourceType: tag
      target: service
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
