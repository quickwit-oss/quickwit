          grok:
            supportRules: ""
            matchRules: >-
              parsing_rule <%{number:syslog_severity}>%{date("yyyy-MM-dd'T'HH:mm:ssZ"):date} %{notSpace:hostname} %{word:program.name}\[%{number:program.id}\]\:\s\{"common":%{greedyData:common:json},"data":%{greedyData:data:json}.*?
