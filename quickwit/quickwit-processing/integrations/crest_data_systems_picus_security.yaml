          enabled: true
          sources:
            - common.ip
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: geo-ip-parser
          name: GeoIp Parser for `network.client.ip`
          enabled: true
          sources:
            - network.client.ip
          target: network.client.geoip
          ip_processing_behavior: do-nothing
        - type: attribute-remapper
          name: Map `common.user_id` to `cds.picus_security.user_id`
          enabled: true
          sources:
            - common.user_id
          sourceType: attribute
          target: cds.picus_security.user_id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `common.user_first_name` to `cds.picus_security.user_first_name`
          enabled: true
          sources:
            - common.user_first_name
          sourceType: attribute
          target: cds.picus_security.user_first_name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `common.user_last_name` to `cds.picus_security.user_last_name`
          enabled: true
          sources:
            - common.user_last_name
          sourceType: attribute
          target: cds.picus_security.user_last_name
          targetType: attribute
          preserveSource: false
