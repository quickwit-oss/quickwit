id: confluent-cloud-audit-logs
metric_id: confluent-cloud-audit-logs
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
    - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - Confluent Cloud Audit Logs
    name: Method Name
    path: methodName
    source: log
pipeline:
  type: pipeline
  name: Confluent Cloud Audit Logs
  enabled: true
  filter:
    query: source:confluent-cloud-audit-logs
  processors:
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: attribute-remapper
      name: Map `authenticationInfo.principal.email` to `usr.email`
      enabled: true
      sources:
        - authenticationInfo.principal.email
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `authenticationInfo.principal.confluentUser.resourceId` to `usr.id`
      enabled: true
      sources:
        - authenticationInfo.principal.confluentUser.resourceId
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `methodName` to `evt.name`
      enabled: true
      sources:
        - methodName
      target: evt.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute