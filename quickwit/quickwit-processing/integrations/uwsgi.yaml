id: uwsgi
backend_only: true
facets:
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Web Access
    name: Method
    path: http.method
    source: log
  - groups:
      - Web Access
    name: Referer
    path: http.referer
    source: log
  - groups:
      - Web Access
    name: Status Code
    path: http.status_code
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - uWSGI
    name: Switches
    path: async_switches
    source: log
  - groups:
      - uWSGI
    name: Core
    path: core
    source: log
  - groups:
      - uWSGI
    name: Request Number
    path: request_number
    source: log
pipeline:
  type: pipeline
  name: uWSGI
  enabled: true
  filter:
    query: source:uwsgi
  processors:
    - type: grok-parser
      name: Parsing uWSGI logs
      enabled: true
      source: message
      samples:
        - 172.17.0.1 - - [06/Jan/2017:16:16:37 +0000] "GET /datadoghq/company?test=var1%20Pl HTTP/1.1" 200 612 "http://www.perdu.com/" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.87 Safari/537.36" "-"
        - '[pid: 596|app: 0|req: 24/72] 222.127.73.32 () {50 vars in 1043 bytes} [Wed Jan 14 11:44:29 2015] POST /countries/ => generated 2 bytes in 149 msecs (HTTP/1.1 200) 3 headers in 112 bytes (1 switches on core 0)'
        - '[pid: 29191|app: 0|req: 454460/1817476] 0.0.0.0 () {40 vars in 576 bytes} [Wed Feb  6 01:07:34 2019] GET / => generated 123 bytes in 1 msecs (HTTP/1.1 200) 3 headers in 155 bytes (1 switches on core 8)'
      grok:
        supportRules: |
          _bytes_written %{integer:network.bytes_written}
          _auth %{notSpace:http.auth:nullIf("-")}
          _client_ip %{ipOrHost:network.client.ip}
          _version HTTP(S)?\/%{regex("\\d+\\.\\d+"):http.version}
          _url %{notSpace:http.url}
          _ident %{notSpace:http.ident:nullIf("-")}
          _user_agent %{regex("[^\\\"]*"):http.useragent}
          _referer %{notSpace:http.referer}
          _status_code %{integer:http.status_code}
          _method %{word:http.method}
          _date_access %{date("dd/MMM/yyyy:HH:mm:ss Z"):date_access}
          _uwsgi_date (%{date("EEE MMM dd HH:mm:ss yyyy"):date_access}|%{date("EEE MMM  d HH:mm:ss yyyy"):date_access})
          _x_forwarded_for %{regex("[^\\\"]*"):http._x_forwarded_for:nullIf("-")}
          _duration %{number:duration:scale(1000000)}
          _cgi_vars %{number:cgi_vars}
          _protocol %{notSpace:http.protocol}
          _headers %{number:http.headers}
          _header_size %{integer:network.header_size}
          _switches %{number:async_switches}
          _core %{notSpace:core}
          _request_number %{notSpace:request_number}
        matchRules: |
          ## This parser support two formats, the default uWSGI format and the access.comon format

          default_format \[pid:\s+%{number:pid}\|app:\s+%{number:app}\|req:\s+%{_request_number}] %{_client_ip} \((%{_ident})?\)\s+\{%{_cgi_vars} vars in %{_bytes_written} bytes\} \[%{_uwsgi_date}\] %{_method} %{_url} => generated %{number:network.body_size} bytes in %{_duration} msecs \(%{_version} %{_status_code}\) %{_headers} headers in %{_header_size} bytes \(%{_switches} switches on core %{_core}\).*

          access.common %{_client_ip} %{_ident} (?>%{_auth} )?\[%{_date_access}\] "(?>%{_method} |)%{_url}(?> %{_version}|)" %{_status_code} (?>%{_bytes_written}|-) "%{_referer}" "%{_user_agent}"( "%{_x_forwarded_for}")?.*

    - type: url-parser
      name: ''
      enabled: true
      sources:
        - http.url
      target: http.url_details
    - type: user-agent-parser
      name: ''
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
    - type: date-remapper
      name: Define `date_access` as the official date of the log
      enabled: true
      sources:
        - date_access
    - type: category-processor
      name: Categorise status code
      enabled: true
      categories:
        - filter:
            query: '@http.status_code:[200 TO 299]'
          name: OK
        - filter:
            query: '@http.status_code:[300 TO 399]'
          name: notice
        - filter:
            query: '@http.status_code:[400 TO 499]'
          name: warning
        - filter:
            query: '@http.status_code:[500 TO 599]'
          name: error
      target: http.status_category
    - type: status-remapper
      name: Define `http.status_category` as the official status of the log
      enabled: true
      sources:
        - http.status_category
