pipeline:
  type: pipeline
  name: Cloudflare
  enabled: true
  filter:
    query: source:cloudflare
  processors:
    - type: date-remapper
      name: Define `EdgeEndTimestamp` as the official date of the log
      enabled: true
      sources:
        - EdgeEndTimestamp
    - type: attribute-remapper
      name: Map `ClientIP`, `SourceIP`, `SourceInternalIP`, `SrcIP`, `ActorIP`, `IP Address` to `network.client.ip`
      enabled: true
      sources:
        - ClientIP
        - SourceIP
        - SourceInternalIP
        - SrcIP
        - ActorIP
        - IP Address
      target: network.client.ip
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `ClientRequestMethod` to `http.method`
      enabled: true
      sources:
        - ClientRequestMethod
      target: http.method
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `EdgeResponseStatus` to `http.status_code`
      enabled: true
      sources:
        - EdgeResponseStatus
      target: http.status_code
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `ClientRequestReferer` to `http.referer`
      enabled: true
      sources:
        - ClientRequestReferer
      target: http.referer
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `EdgeResponseBytes` to `network.bytes_written`
      enabled: true
      sources:
        - EdgeResponseBytes
      target: network.bytes_written
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: url-parser
      name: ""
      enabled: true
      sources:
        - ClientRequestURI
      target: http.url_details
    - type: attribute-remapper
      name: Map `HTTPHost`, `ClientRequestHost` to `http.url_details.host`
      enabled: true
      sources:
        - HTTPHost
        - ClientRequestHost
      target: http.url_details.host
      preserveSource: true
      overrideOnConflict: true
      sourceType: attribute
      targetType: attribute
    - type: user-agent-parser
      name: ""
      enabled: true
      sources:
        - ClientRequestUserAgent
      target: http.useragent_details
      encoded: false
    - type: category-processor
      name: Categorise status code
      enabled: true
      categories:
        - filter:
            query: "@http.status_code:[200 TO 299]"
          name: OK
        - filter:
            query: "@http.status_code:[300 TO 399]"
          name: notice
        - filter:
            query: "@http.status_code:[400 TO 499]"
          name: warning
        - filter:
            query: "@http.status_code:[500 TO 599]"
          name: error
      target: http.status_category
    - type: status-remapper
      name: Define `http.status_category` as the official status of the log
      enabled: true
      sources:
        - http.status_category
    - type: arithmetic-processor
      name: Calculate request response time
      enabled: true
      expression: EdgeEndTimestamp - EdgeStartTimestamp
      target: duration
      replaceMissing: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    - type: attribute-remapper
      name: Map `ClientASN` to `network.client.asn`
      enabled: true
      sources:
        - ClientASN
      target: network.client.asn
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `DeviceName` to `host`
      enabled: true
      sources:
        - DeviceName
      target: host
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `Email`, `ActorEmail` to `usr.email`
      enabled: true
      sources:
        - Email
        - ActorEmail
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `UserID`, `UserUID`, `ActorID` to `usr.id`
      enabled: true
      sources:
        - UserID
        - UserUID
        - ActorID
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `OriginIP`, `DstIP`, `DestinationIP` to `network.destination.ip`
      enabled: true
      sources:
        - OriginIP
        - DstIP
        - DestinationIP
      target: network.destination.ip
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `OriginPort`, `DstPort`, `DestinationPort` to `network.destination.port`
      enabled: true
      sources:
        - OriginPort
        - DstPort
        - DestinationPort
      target: network.destination.port
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `SourcePort`, `SrcPort` to `network.client.port`
      enabled: true
      sources:
        - SourcePort
        - SrcPort
      target: network.client.port
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `QueryName` to `dns.question.name`
      enabled: true
      sources:
        - QueryName
      target: dns.question.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `QuerySize` to `dns.question.size`
      enabled: true
      sources:
        - QuerySize
      target: dns.question.size
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `QueryTypeName` to `dns.question.type`
      enabled: true
      sources:
        - QueryTypeName
      target: dns.question.type
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `ResolvedIPs` to `dns.answer.name`
      enabled: true
      sources:
        - ResolvedIPs
      target: dns.answer.name
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `RCode` to `dns.flag.rcode`
      enabled: true
      sources:
        - RCode
      target: dns.flag.rcode
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `HTTPMethod` to `http.method`
      enabled: true
      sources:
        - HTTPMethod
      target: http.method
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `HTTPStatusCode` to `http.status_code`
      enabled: true
      sources:
        - HTTPStatusCode
      target: http.status_code
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `HTTPVersion` to `http.version`
      enabled: true
      sources:
        - HTTPVersion
      target: http.version
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `Referer` to `http.referer`
      enabled: true
      sources:
        - Referer
      target: http.referer
      preserveSource: false
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `RayID` to `http.request_id`
      enabled: true
      sources:
        - RayID
      target: http.request_id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `URL` to `http.url`
      enabled: true
      sources:
        - URL
      target: http.url
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `UserAgent` to `http.useragent`
      enabled: true
      sources:
        - UserAgent
      target: http.useragent
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `AssetMetadata.Email` to `usr.email`
      enabled: true
      sources:
        - AssetMetadata.Email
      target: usr.email
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `AssetMetadata.Name` to `usr.name`
      enabled: true
      sources:
        - AssetMetadata.Name
      target: usr.name
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    - type: attribute-remapper
      name: Map `AssetMetadata.Id` to `usr.id`
      enabled: true
      sources:
        - AssetMetadata.Id
      target: usr.id
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
      targetType: attribute
    # OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add OCSF version
          enabled: true
          template: "1.3.0"
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Cloudflare Logs
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: Cloudflare
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `RayID` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - RayID
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add severity
          enabled: true
          template: Informational
          target: ocsf.severity
          replaceMissing: false
        - type: string-builder-processor
          name: Add severity id
          enabled: true
          template: "1"
          target: ocsf.severity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.severity_id` to `ocsf.severity_id`
          enabled: true
          sources:
            - ocsf.severity_id
          sourceType: attribute
          target: ocsf.severity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ClientIP`, `SourceIP`, `SrcIP`, `ClientAddress`, `ActorIP`, `SrcAddr`, `IPSourceAddress`, `EgressIP`, `IPAddress` to `ocsf.src_endpoint.ip`
          enabled: true
          sources:
            - ClientIP
            - SourceIP
            - SrcIP
            - ClientAddress
            - ActorIP
            - SrcAddr
            - IPSourceAddress
            - EgressIP
            - IPAddress
          sourceType: attribute
          target: ocsf.src_endpoint.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ClientSrcPort`, `SrcPort`, `SourcePort`, `EgressPort` to `ocsf.src_endpoint.port`
          enabled: true
          sources:
            - ClientSrcPort
            - SrcPort
            - SourcePort
            - EgressPort
          sourceType: attribute
          target: ocsf.src_endpoint.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `DestinationIP`, `DstIP`, `DestAddr`, `OriginIP`, `ServerAddress` to `ocsf.dst_endpoint.ip`
          enabled: true
          sources:
            - DestinationIP
            - DstIP
            - DestAddr
            - OriginIP
            - ServerAddress
          sourceType: attribute
          target: ocsf.dst_endpoint.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `DestinationPort`, `DstPort`, `OriginPort` to `ocsf.dst_endpoint.port`
          enabled: true
          sources:
            - DestinationPort
            - DstPort
            - OriginPort
          sourceType: attribute
          target: ocsf.dst_endpoint.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Datetime`, `Timestamp`, `EdgeEndTimestamp`, `SessionStartTime`, `DetectedTimestamp`, `When`, `CreatedAt` to `ocsf.time`
          enabled: true
          sources:
            - Datetime
            - Timestamp
            - EdgeEndTimestamp
            - SessionStartTime
            - DetectedTimestamp
            - When
            - CreatedAt
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse time
          enabled: true
          source: ocsf.time
          samples:
            - "2024-03-19T21:25:09Z"
            - "1747491477930000000"
          grok:
            supportRules: ""
            matchRules: |-
              parsing_str_time %{date("yyyy-MM-dd'T'HH:mm:ssZ"):ocsf.time}
              convert_ns_to_ms %{regex("[0-9]{1,13}"):ocsf.time}[0-9]*
    - type: pipeline
      name: Cloudflare OCSF sub pipeline for Devices
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@DeviceID:*"
      processors:
        - type: attribute-remapper
          name: Map `DeviceID` to `ocsf.device.uid`
          enabled: true
          sources:
            - DeviceID
          sourceType: attribute
          target: ocsf.device.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `DeviceName` to `ocsf.device.hostname`
          enabled: true
          sources:
            - DeviceName
          sourceType: attribute
          target: ocsf.device.hostname
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add device type id
          enabled: true
          template: "0"
          target: ocsf.device.type_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.device.type_id` to `ocsf.device.type_id`
          enabled: true
          sources:
            - ocsf.device.type_id
          sourceType: attribute
          target: ocsf.device.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add device type name
          enabled: true
          template: "Unknown"
          target: ocsf.device.type
          replaceMissing: false
    - type: pipeline
      name: Cloudflare OCSF sub pipeline for class DNS Activity [4003]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@QueryName:*"
      processors:
        - type: string-builder-processor
          name: Add category uid
          enabled: true
          template: "4"
          target: ocsf.category_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add category name
          enabled: true
          template: Network Activity
          target: ocsf.category_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add class uid
          enabled: true
          template: "4003"
          target: ocsf.class_uid
          replaceMissing: false
        - type: string-builder-processor
          name: Add class name
          enabled: true
          template: DNS Activity
          target: ocsf.class_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add activity id
          enabled: true
          template: "6"
          target: ocsf.activity_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.activity_id` to `ocsf.activity_id`
          enabled: true
          sources:
            - ocsf.activity_id
          sourceType: attribute
          target: ocsf.activity_id
          targetType: attribute
          targetFormat: integer
          preserveSource: false
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add activity name
          enabled: true
          template: "Traffic"
          target: ocsf.activity_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `QueryName` to `ocsf.query.hostname`
          enabled: true
          sources:
            - QueryName
          sourceType: attribute
          target: ocsf.query.hostname
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `QueryTypeName` to `ocsf.query.type`
          enabled: true
          sources:
            - QueryTypeName
          sourceType: attribute
          target: ocsf.query.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `ResponseCode`, `Rcode` to `ocsf.rcode_id`
          enabled: true
          sources:
            - ResponseCode
            - Rcode
          sourceType: attribute
          target: ocsf.rcode_id
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: category-processor
          name: Map ocsf.rcode_id to rcode
          enabled: true
          categories:
            - filter:
                query: "@ocsf.rcode_id:0"
              name: "NoError"
            - filter:
                query: "@ocsf.rcode_id:1"
              name: "FormErr"
            - filter:
                query: "@ocsf.rcode_id:2"
              name: "ServFail"
            - filter:
                query: "@ocsf.rcode_id:3"
              name: "NXDomain"
            - filter:
                query: "@ocsf.rcode_id:4"
              name: "NotImp"
            - filter:
                query: "@ocsf.rcode_id:5"
              name: "Refused"
            - filter:
                query: "@ocsf.rcode_id:6"
              name: "YXDomain"
            - filter:
                query: "@ocsf.rcode_id:7"
              name: "YXRRSet"
            - filter:
                query: "@ocsf.rcode_id:8"
              name: "NXRRSet"
            - filter:
                query: "@ocsf.rcode_id:9"
              name: "NotAuth"
            - filter:
                query: "@ocsf.rcode_id:10"
              name: "NotZone"
            - filter:
                query: "@ocsf.rcode_id:11"
              name: "DSOTYPENI"
            - filter:
                query: "@ocsf.rcode_id:16"
              name: "BADSIG_VERS"
