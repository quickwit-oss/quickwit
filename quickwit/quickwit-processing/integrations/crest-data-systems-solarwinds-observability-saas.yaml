id: crest-data-systems-solarwinds-observability-saas
metric_id: crest-data-systems-solarwinds-observability-saas
backend_only: false
facets:
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Activity Log ID
    path: cds.solarwinds_observability_saas.activity_log.id
    source: log
    type: string
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Entity ID
    path: cds.solarwinds_observability_saas.entity.id
    source: log
    type: string
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Entity Name
    path: cds.solarwinds_observability_saas.entity.name
    source: log
    type: string
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Entity Type
    path: cds.solarwinds_observability_saas.entity.type
    source: log
    type: string
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Process Name
    path: cds.solarwinds_observability_saas.activity_log.process_name
    source: log
    type: string
  - 
    facetType: list
    groups:
      - Crest data systems SolarWinds Observability SaaS
    name: Session Type
    path: cds.solarwinds_observability_saas.activity_log.session_type
    source: log
    type: string
pipeline:
  type: pipeline
  name: Solarwinds Observability SaaS
  enabled: true
  filter:
    query: source:crest-data-systems-solarwinds-observability-saas
  processors:
    - type: pipeline
      name: Activity Logs
      enabled: true
      filter:
        query: service:cd.solarwinds.observability.saas.activity_logs
      processors:
        - type: grok-parser
          name: Session Open/Closed
          enabled: true
          source: message
          samples:
            - "Feb 17 06:31:39 ub22-50-12-87 dbus-daemon[994]: [system] Failed
              to activate service 'org.freedesktop.timedate1': timed out
              (service_start_timeout=25000ms)"
            - >
              Feb 14 06:16:57 AM ub22-50-9-251 2025-02-10 15:03:43 status
              half-configured python3-update-manager:all 1:22.04.21
          grok:
            supportRules: ""
            matchRules: >+
              rule %{date("MMM  d hh:mm:ss"):date} %{hostname:hostname}
              %{data:process_name}\[%{number:pid}\]: %{data:message}




              rule2 %{date("MMM dd hh:mm:ss a"):date} %{hostname:hostname} %{data:message}




              rule3 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname} %{data:process_name}\[%{number:pid}\]: pam_unix\(%{word:session_type} %{data:message}


              rule4 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname} %{data:process_name}\[%{number:pid}\]: %{data:message}

        - type: grok-parser
          name: Kernel Logs
          enabled: true
          source: message
          samples:
            - >
              Feb 18 14:55:29 ub22-50-2-88 kernel: [346.135888] audit:
              type=1400 audit(1739870729.233:82): apparmor='STATUS'
              operation='profile_replace' profile='unconfined'
              name='snap.lxd.buginfo' pid=2784 comm='apparmor_parser'
            - >
              Feb 18 14:55:29 ub22-50-2-88 kernel: [131232.4334] audit:
              type=1400 audit(1739870729.233:82): apparmor='STATUS'
              operation='profile_replace' profile='unconfined'
              name='snap.lxd.buginfo' pid=2784 comm='apparmor_parser'
          grok:
            supportRules: ""
            matchRules: >-
              rule %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname}
              %{word:process_name}: \[  %{number:pid}\] %{data:message}


              rule2 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname} %{word:process_name}: \[%{number:pid}\] %{data:message}
        - type: grok-parser
          name: Extract "User" Logs
          enabled: true
          source: message
          samples:
            - >
              Feb 10 12:09:33 ub22-50-2-88 sudo:     root : TTY=pts/2 ; PWD=/ ;
              USER=swagent ;
              COMMAND=/opt/solarwinds/uamsclient/sbin/uamsclient-ctl
              set-access-token -token
              tJi_O012P-sTRbx6sFHKtBbXXsnNS-c62BCBxillZEZA3NFNxgJRAWTNGV184FvGckww4cQ
              -work-dir $/opt/solarwinds/uamsclient/var -log-dir
              $/var/log/solarwinds/uamsclient -dynamic-config
              /opt/solarwinds/uamsclient/etc/dynamic_config.yaml
            - "Feb 18 14:52:01 ub22-50-2-88 sudo:     root : unable to resolve
              host ub22-50-9-251: Temporary failure in name resolution"
          grok:
            supportRules: ""
            matchRules: rule2 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname}
              %{data:message}
        - type: grok-parser
          name: Extract "Pam Unix" Logs
          enabled: true
          source: message
          samples:
            - >
              Feb  7 09:17:01 ub22-50-12-87 CRON[3376972]:
              pam_unix(cron:session): session opened for user root(uid=0) by
              (uid=0)
            - >
              Feb 17 09:17:01 ub22-50-12-87 CRON[3376972]:
              pam_unix(cron:session): session opened for user root(uid=0) by
              (uid=0)
            - "Feb 19 17:45:47 ub22-50-12-87 systemd:
              pam_unix(systemd-user:session): session opened for user
              root(uid=0) by (uid=0)"
          grok:
            supportRules: ""
            matchRules: >+
              rule1 %{date("MMM  d hh:mm:ss"):date} %{hostname:hostname}
              %{data:process_name}\[%{number:pid}\]:
              pam_unix\(%{data:session_type}:session\): %{data:message}


              rule2 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname} %{data:process_name}\[%{number:pid}\]: pam_unix\(%{data:session_type}:session\): %{data:message}


              rule3 %{date("MMM dd hh:mm:ss"):date} %{hostname:hostname} %{regex("[a-z]*"):process_name}: pam_unix\(%{data:session_type}:session\): %{data:message}

        - type: attribute-remapper
          name: Map `id` to `cds.solarwinds_observability_saas.activity_log.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cds.solarwinds_observability_saas.activity_log.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `session_type` to
            `cds.solarwinds_observability_saas.activity_log.session_type`
          enabled: true
          sources:
            - session_type
          sourceType: attribute
          target: cds.solarwinds_observability_saas.activity_log.session_type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `process_name` to
            `cds.solarwinds_observability_saas.activity_log.process_name`
          enabled: true
          sources:
            - process_name
          sourceType: attribute
          target: cds.solarwinds_observability_saas.activity_log.process_name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `time` to `timestamp`
          enabled: true
          sources:
            - time
          sourceType: attribute
          target: timestamp
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: status-remapper
          name: Define `severity` as the official status of the log
          enabled: true
          sources:
            - severity
    - type: pipeline
      name: Entities
      enabled: true
      filter:
        query: service:cd.solarwinds.observability.saas.entities
      processors:
        - type: attribute-remapper
          name: Map `id` to `cds.solarwinds_observability_saas.entity.id`
          enabled: true
          sources:
            - id
          sourceType: attribute
          target: cds.solarwinds_observability_saas.entity.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `type` to `cds.solarwinds_observability_saas.entity.type`
          enabled: true
          sources:
            - type
          sourceType: attribute
          target: cds.solarwinds_observability_saas.entity.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `name` to `cds.solarwinds_observability_saas.entity.name`
          enabled: true
          sources:
            - name
          sourceType: attribute
          target: cds.solarwinds_observability_saas.entity.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `updatedTime` to `timestamp`
          enabled: true
          sources:
            - updatedTime
          sourceType: attribute
          target: timestamp
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: service-remapper
      name: "Define `service` as the official service of the log"
      enabled: true
      sources:
        - service
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
