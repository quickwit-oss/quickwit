    - type: pipeline
      name: Traffic
      enabled: true
      filter:
        query: "@type:traffic"
      processors:
        - type: attribute-remapper
          name: Map `service` to `traffic_service`
          enabled: true
          sources:
            - service
          sourceType: attribute
          target: traffic_service
          targetType: attribute
