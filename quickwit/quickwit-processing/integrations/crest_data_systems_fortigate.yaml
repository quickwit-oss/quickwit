pipeline:
  type: pipeline
  name: Fortigate by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_fortigate
  processors:
    - type: grok-parser
      name: Parsing attributes for fortigate logs
      enabled: true
      source: message
      samples:
        - >
          date=2023-06-09 time=13:53:22 level='critical' vd='root'
          logid=0000000015 devid='fgvm02tm22028029'
          fortigate_devname='fgvm02tm22028029' severity='critical'
          network.client.ip=103.48.198.141 network.destination.ip=172.16.200.55
          srcintf='port7' dstintf='dmz1' service='crest_data_systems_fortigate'
          tz='+0530' type='event' subtype='wireless' action='fake-ap-on-air'
          apstatus='0' manuf='Fortinet, Inc.' bssid='90:6c:ac:89:e1:fa'
          security='WPA2 Personal' radioband='802.11n' channel=1
          sndetected='N/A' signal=-93 onwire='no' srcmac=8C-C6-81-3B-74-FB
          eventtime=1681966796846227594 logdesc='Threat feed updated'
          msg='progress IPsec phase 1' status='success' desc='threat-feed'
        - date=2023-06-09 time=13:53:22 level='information' vd='vdom1'
          logid=0001000014 devid='fgvm02tm22028030'
          fortigate_devname='fgvm02tm22028029' severity='critical'
          network.client.ip=103.48.198.141 network.destination.ip=103.48.198.141
          srcintf='port3' dstintf='dmz1' service='crest_data_systems_fortigate'
          tz='+0530' type='utm' subtype='webfilter' profile='test-webfilter'
          reqtype='direct' sentbyte=84 rcvdbyte=0 msg='URL belongs to a denied
          category in policy' crlevel='critical' craction=4096 crscore=50
          direction='outgoing' url='/' action='dropped'
          syslog.hostname='morrishittu.ddns.net' usr.name='user1.test'
          eventtype='ftgd_blk' policyid=50 identidx=0 sessionid=815428740
          status='detected' proto=6 utm_service='http'
          attackname='Adobe.Flash.newfunction.Handling.Code.Execution'
          network.client.port=33782 network.destination.port=5041 attackid=17570
          sensor='all_default' count=1
          ref='http://www.fortinet.com/ids/VID17570' incidentserialno=116664577
      grok:
        supportRules: ""
        matchRules: rule %{data::keyvalue("=", "/:")}
    - type: string-builder-processor
      name: Define `fortigate_service` equal to `cds.fortigate.%{type}`
      enabled: true
      template: cds.fortigate.%{type}
      target: fortigate_service
      replaceMissing: false
    - type: service-remapper
      name: Define `fortigate_service` as the official service of the log
      enabled: true
      sources:
        - fortigate_service
    - type: attribute-remapper
      name: Map `srcip` to `network.client.ip`
      enabled: true
      sources:
        - srcip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `srcport` to `network.client.port`
      enabled: true
      sources:
        - srcport
      sourceType: attribute
      target: network.client.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `dstip` to `network.destination.ip`
      enabled: true
      sources:
        - dstip
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `dstport` to `network.destination.port`
      enabled: true
      sources:
        - dstport
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user` to `usr.name`
      enabled: true
      sources:
        - user
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `hostname` to `syslog.hostname`
      enabled: true
      sources:
        - hostname
      sourceType: attribute
      target: syslog.hostname
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `stage` to `fortigate_stage`
      enabled: true
      sources:
        - stage
      sourceType: attribute
      target: fortigate_stage
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `status` to `fortigate_status`
      enabled: true
      sources:
        - status
      sourceType: attribute
      target: fortigate_status
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `severity` to `fortigate_severity`
      enabled: true
      sources:
        - severity
      sourceType: attribute
      target: fortigate_severity
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `devname` to `fortigate_devname`
      enabled: true
      sources:
        - devname
      sourceType: attribute
      target: fortigate_devname
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
    - type: geo-ip-parser
      name: Extracting  geolocation information from client.ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: geo-ip-parser
      name: Extracting geolocation information from destination.ip
      enabled: true
      sources:
        - network.destination.ip
      target: network.destination.geoip
      ip_processing_behavior: do-nothing
