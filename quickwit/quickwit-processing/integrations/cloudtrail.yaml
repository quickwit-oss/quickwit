      - Source Code
    name: Error Type
    path: error.kind
    source: log
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: Request ID
    path: http.request_id
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - AWS
    name: Account
    path: account
    source: tag
  - groups:
      - AWS
    name: S3 Bucket
    path: aws.s3.bucket
    source: log
    type: string
  - groups:
      - AWS
    name: Event Source
    path: eventSource
    source: log
    type: string
  - groups:
      - AWS
    name: Is ReadOnly Operation
    path: readOnly
    source: log
    type: boolean
  - groups:
      - AWS
    name: Region
    path: region
    source: tag
  - groups:
      - AWS
    name: Requested Bucket Name
    path: requestParameters.bucketName
    source: log
    type: string
  - facetType: range
    groups:
      - AWS
    name: S3 Lifecycle Expiration Period
    path: requestParameters.LifecycleConfiguration.Rule.Expiration.Days
    source: log
    type: double
    unit:
      family: time
      name: day
  - groups:
      - AWS
    name: Requested EventBus Name
    path: requestParameters.eventBusName
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Role Name
    path: requestParameters.roleName
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Role Arn
    path: requestParameters.roleArn
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Role Session Name
    path: requestParameters.roleSessionName
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Instance ID
    path: requestParameters.instanceId
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Policy ARN
    path: requestParameters.policyArn
    source: log
    type: string
  - groups:
      - AWS
    name: Requested User Name
    path: requestParameters.userName
    source: log
    type: string
  - groups:
      - AWS
    name: Resource Account ID
    path: resource.accountId
    source: log
    type: string
  - groups:
      - AWS
    name: Resource ARN
    path: resource.ARN
    source: log
    type: string
  - groups:
      - AWS
    name: Resource Type
    path: resource.type
    source: log
    type: string
  - groups:
      - AWS Elastic Container Registry
    name: Container Image Hash
    path: responseElements.image.imageId.imageDigest
    source: log
    type: string
  - groups:
      - AWS Elastic Container Registry
    name: Container Image Tag
    path: responseElements.image.imageId.imageTag
    source: log
    type: string
  - groups:
      - AWS Elastic Container Registry
    name: Container Repository Name
    path: responseElements.image.repositoryName
    source: log
    type: string
  - groups:
      - AWS
    name: Requested Role ARN
    path: responseElements.role.arn
    source: log
    type: string
  - groups:
      - AWS
    name: Snapshot ID
    path: responseElements.snapshotId
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role ID
    path: responseElements.assumedRoleUser.assumedRoleId
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role User ARN
    path: responseElements.assumedRoleUser.arn
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role User Name
    path: responseElements.assumedRoleUser.userName
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role Access Key ID
    path: responseElements.credentials.accessKeyId
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role Federated User ARN
    path: responseElements.federatedUser.arn
    source: log
    type: string
  - groups:
      - AWS
    name: AWS User Account ID
    path: userIdentity.accountId
    source: log
    type: string
  - groups:
      - AWS
    name: AWS User Account ID (Friendly Name)
    path: userIdentity.accountIdFriendlyName
    source: log
    type: string
  - groups:
      - AWS
    name: AWS User Access Key ID
    path: userIdentity.accessKeyId
    source: log
    type: string
  - groups:
      - AWS
    name: AWS User ARN
    path: userIdentity.arn
    source: log
    type: string
  - groups:
      - AWS
    name: Assumed Role
    path: userIdentity.assumed_role
    source: log
    type: string
  - groups:
      - AWS
    name: Event InvokedBy
    path: userIdentity.invokedBy
    source: log
    type: string
  - groups:
      - AWS
    name: Session Name
    path: userIdentity.session_name
    source: log
    type: string
  - groups:
      - AWS
    name: AWS User Type
    path: userIdentity.type
    source: log
    type: string
pipeline:
  type: pipeline
  name: AWS CloudTrail
  enabled: true
  filter:
    query: source:cloudtrail
  processors:
    - type: pipeline
      name: Amazon Security Lake
      enabled: true
      filter:
        query: "@metadata.product.name:CloudTrail"
      processors:
        - type: attribute-remapper
          name: Map `actor.invoked_by` to `userIdentity.invokedBy`
          enabled: true
          sources:
            - actor.invoked_by
          sourceType: attribute
          target: userIdentity.invokedBy
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.session.is_mfa` to `userIdentity.sessionContext.attributes.mfaAuthenticated`
          enabled: true
          sources:
            - actor.session.is_mfa
          sourceType: attribute
          target: userIdentity.sessionContext.attributes.mfaAuthenticated
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.uid_alt` to `userIdentity.principalId`
          enabled: true
          sources:
            - actor.user.uid_alt
          sourceType: attribute
          target: userIdentity.principalId
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `api.service.name` to `eventSource`
          enabled: true
          sources:
            - api.service.name
          sourceType: attribute
          target: eventSource
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.uid` to `userIdentity.arn`
          enabled: true
          sources:
            - actor.user.uid
          sourceType: attribute
          target: userIdentity.arn
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.type` to `userIdentity.type`
          enabled: true
          sources:
            - actor.user.type
          sourceType: attribute
          target: userIdentity.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.credential_uid` to `userIdentity.accessKeyId`
          enabled: true
          sources:
            - actor.user.credential_uid
          sourceType: attribute
          target: userIdentity.accessKeyId
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `actor.user.account.uid` to `userIdentity.accountId`
          enabled: true
          sources:
            - actor.user.account.uid
          sourceType: attribute
          target: userIdentity.accountId
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: grok-parser
          name: Parse `requestParameters`
          enabled: true
          source: api.request.data
          samples:
            - '{"name":"test"}'
          grok:
            supportRules: ""
            matchRules: |
              parse_request_parameters %{data:requestParameters:json}
        - type: grok-parser
          name: Parse `responseElements`
          enabled: true
          source: api.response.data
          samples:
            - '{"name":"test"}'
          grok:
            supportRules: ""
            matchRules: |
              parse_response_elements %{data:responseElements:json}
    - type: attribute-remapper
      name: Map `requestID` to `http.request_id`
      enabled: true
      sources:
        - requestID
      sourceType: attribute
      target: http.request_id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `sourceIPAddress`, `src_endpoint.ip` to `network.client.ip`
      enabled: true
      sources:
        - sourceIPAddress
        - src_endpoint.ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `errorCode`, `api.response.error` to `error.kind`
      enabled: true
      sources:
        - errorCode
        - api.response.error
      sourceType: attribute
      target: error.kind
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `errorMessage`, `api.response.message` to `error.message`
      enabled: true
      sources:
        - errorMessage
        - api.response.message
      sourceType: attribute
      target: error.message
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userAgent`, `http_request.user_agent` to `http.useragent`
      enabled: true
      sources:
        - userAgent
        - http_request.user_agent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: user-agent-parser
      name: ""
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
      combineVersionDetails: false
    - type: category-processor
      name: Define logs as error if they have an error message
      enabled: true
      categories:
        - filter:
            query: "@error.message:* OR @error.kind:*"
          name: Error
      target: level
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
    - type: attribute-remapper
      name: Map `eventName`, `api.operation` to `evt.name`
      enabled: true
      sources:
        - eventName
        - api.operation
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userIdentity.userName` to `usr.name`
      enabled: true
      sources:
        - userIdentity.userName
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userIdentity.userName` to `usr.id`
      enabled: true
      sources:
        - userIdentity.userName
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: category-processor
      name: Categorise Root User
      enabled: true
      categories:
        - filter:
            query: "@userIdentity.type:Root"
          name: Root
      target: usr.id
    - type: attribute-remapper
      name: Map `userIdentity.sessionContext.sessionIssuer.userName` to `userIdentity.assumed_role`
      enabled: true
      sources:
        - userIdentity.sessionContext.sessionIssuer.userName
      sourceType: attribute
      target: userIdentity.assumed_role
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map attribute `recipientAccountId`, `aws_account` to tag `account`
      enabled: true
      sources:
        - recipientAccountId
        - aws_account
      sourceType: attribute
      target: account
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
    - type: grok-parser
      name: Parsing Session Name
      enabled: true
      source: userIdentity.arn
      samples:
        - arn:aws:iam::862849134031:user/paul
        - arn:aws:sts::862849134031:assumed-role/DatadogAWSIntegrationRole/DatadogAWSIntegration
      grok:
        supportRules: ""
        matchRules: "parsing_session_name %{notSpace:}/%{regex(\"[\\\\w+=,.@-]*\"):userIdentity.session_name}\n"
    - type: attribute-remapper
      name: Map attribute `awsRegion`, `cloud.region` to tag `region`
      enabled: true
      sources:
        - awsRegion
        - cloud.region
      sourceType: attribute
      target: region
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
    - type: string-builder-processor
      name: extract resource.type
      enabled: true
      template: "%{resources.type}"
      target: resource.type
      replaceMissing: false
    - type: string-builder-processor
      name: extract resource.accountId
      enabled: true
      template: "%{resources.accountId}"
      target: resource.accountId
      replaceMissing: false
    - type: string-builder-processor
      name: extract resource.ARN
      enabled: true
      template: "%{resources.ARN}"
      target: resource.ARN
      replaceMissing: false
    - type: grok-parser
      name: Parse Policy FederatedToken
      enabled: true
      source: requestParameters.policy
      samples:
        - '{"Version": "2012-10-17","Statement": [{"Effect": "Allow","Action":
          "*","Resource": "*"}]}'
      grok:
        supportRules: ""
        matchRules: |
          parse_session_policy %{data:requestParameters.SessionPolicyARN:json}
    #OCSF transformations
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: attribute-remapper
          name: Map `eventName` to `ocsf.api.operation`
          enabled: true
          sources:
            - eventName
          sourceType: attribute
          target: ocsf.api.operation
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventSource` to `ocsf.api.service.name`
          enabled: true
          sources:
            - eventSource
          sourceType: attribute
          target: ocsf.api.service.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `apiVersion` to `ocsf.api.version`
          enabled: true
          sources:
            - apiVersion
          sourceType: attribute
          target: ocsf.api.version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `errorCode` to `ocsf.api.response.error`
          enabled: true
          sources:
            - errorCode
          sourceType: attribute
          target: ocsf.api.response.error
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `errorMessage` to `ocsf.api.response.error_message`
          enabled: true
          sources:
            - errorMessage
          sourceType: attribute
          target: ocsf.api.response.error_message
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `requestParameters` to `ocsf.api.request.data`
          enabled: true
          sources:
            - requestParameters
          sourceType: attribute
          target: ocsf.api.request.data
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `responseElements` to `ocsf.api.response.data`
          enabled: true
          sources:
            - responseElements
          sourceType: attribute
          target: ocsf.api.response.data
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `requestID` to `ocsf.api.request.uid`
          enabled: true
          sources:
            - requestID
          sourceType: attribute
          target: ocsf.api.request.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.accountId` to `ocsf.actor.user.account.uid`
          enabled: true
          sources:
            - userIdentity.accountId
          sourceType: attribute
          target: ocsf.actor.user.account.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.accessKeyId` to `ocsf.actor.user.credential_uid`
          enabled: true
          sources:
            - userIdentity.accessKeyId
          sourceType: attribute
          target: ocsf.actor.user.credential_uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.userName` to `ocsf.actor.user.name`
          enabled: true
          sources:
            - userIdentity.userName
          sourceType: attribute
          target: ocsf.actor.user.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.type` to `ocsf.actor.user.type`
          enabled: true
          sources:
            - userIdentity.type
          sourceType: attribute
          target: ocsf.actor.user.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.type` to `ocsf.actor.user.type`
          enabled: true
          sources:
            - userIdentity.type
          sourceType: attribute
          target: ocsf.actor.user.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.onBehalfOf.userId`, `userIdentity.principalId` to `ocsf.actor.user.uid_alt`
          enabled: true
          sources:
            - userIdentity.onBehalfOf.userId
            - userIdentity.principalId
          sourceType: attribute
          target: ocsf.actor.user.uid_alt
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.onBehalfOf.identityStoreArn`, `userIdentity.arn` to `ocsf.actor.user.uid`
          enabled: true
          sources:
            - userIdentity.onBehalfOf.identityStoreArn
            - userIdentity.arn
          sourceType: attribute
          target: ocsf.actor.user.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.sessionContext.attributes.creationDate` to `ocsf.actor.session.created_time_dt`
          enabled: true
          sources:
            - userIdentity.sessionContext.attributes.creationDate
          sourceType: attribute
          target: ocsf.actor.session.created_time_dt
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.sessionContext.attributes.mfaAuthenticated` to `ocsf.actor.session.is_mfa`
          enabled: true
          sources:
            - userIdentity.sessionContext.attributes.mfaAuthenticated
          sourceType: attribute
          target: ocsf.actor.session.is_mfa
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.sessionContext.sessionIssuer.arn` to `ocsf.actor.session.issuer`
          enabled: true
          sources:
            - userIdentity.sessionContext.sessionIssuer.arn
          sourceType: attribute
          target: ocsf.actor.session.issuer
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.invokedBy` to `ocsf.actor.invoked_by`
          enabled: true
          sources:
            - userIdentity.invokedBy
          sourceType: attribute
          target: ocsf.actor.invoked_by
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `userIdentity.webIdFederationData.federatedProvider`, `userIdentity.identityProvider` to `ocsf.actor.idp.name`
          enabled: true
          sources:
            - userIdentity.webIdFederationData.federatedProvider
            - userIdentity.identityProvider
          sourceType: attribute
          target: ocsf.actor.idp.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `awsRegion` to `ocsf.cloud.region`
          enabled: true
          sources:
            - awsRegion
          sourceType: attribute
          target: ocsf.cloud.region
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add `ocsf.cloud.provider`
          enabled: true
          template: AWS
          target: ocsf.cloud.provider
          replaceMissing: true
        - type: attribute-remapper
          name: Map `userAgent` to `ocsf.http_request.user_agent`
          enabled: true
          sources:
            - userAgent
          sourceType: attribute
          target: ocsf.http_request.user_agent
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventVersion` to `ocsf.metadata.product.version`
          enabled: true
          sources:
            - eventVersion
          sourceType: attribute
          target: ocsf.metadata.product.version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventID` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - eventID
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventType` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - eventType
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `eventCategory` to `ocsf.metadata.product.feature.name`
          enabled: true
          sources:
            - eventCategory
          sourceType: attribute
          target: ocsf.metadata.product.feature.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: CloudTrail
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: AWS
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add version
          enabled: true
          template: 1.3.0
          target: ocsf.metadata.version
          replaceMissing: false
        - type: string-builder-processor
          name: Add OCSF profiles
          enabled: true
          template: "[cloud,datetime]"
          target: ocsf.metadata.profiles
          replaceMissing: false
        - type: grok-parser
          name: Profiles string to array
          enabled: true
          source: ocsf.metadata.profiles
          samples:
            - "[date,time]"
          grok:
            supportRules: ""
            matchRules: ProfileStrToArray %{data:ocsf.metadata.profiles:array("[]",",")}
        - type: grok-parser
          name: Parsing event time
          enabled: true
          source: eventTime
          samples:
            - "2023-07-19T21:25:09Z"
