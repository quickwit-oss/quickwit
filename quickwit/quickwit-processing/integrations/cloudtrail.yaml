# If you update the facet list, you must update line 141 of
# logs-backend/jobs/src/test/java/com/dd/logs/jobs/job/integrations/FacetsUpdateJobHandlerTest.java
# For questions see #security-monitoring or logs-backend slack channels.
id: cloudtrail
metric_id: amazon-cloudtrail
backend_only: false
facets:
