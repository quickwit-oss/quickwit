id: cequence
backend_only: true
facets:
  - groups:
      - Web Access
    name: Referer
    path: http.referer
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Cequence
    name: Rule ID Array
    path: rule_id_array
    source: log
  - groups:
      - Cequence
    name: Header Value Content Type
    path: header_value_content_type
    source: log
  - groups:
      - Cequence
    name: Matched Rule IDs
    path: rules_ids
    source: log
  - groups:
      - Cequence
    name: ISP
    path: isp
    source: log
  - groups:
      - Cequence
    name: Username
    path: username
    source: log
  - groups:
      - Cequence
    name: URI
    path: uri
    source: log
  - groups:
      - Cequence
    name: Organization
    path: organization
    source: log
  - groups:
      - Cequence
    name: HTTP Fingerprint
    path: http_fingerprint
    source: log
  - groups:
      - Cequence
    name: Server IP
    path: server_ip
    source: log
  - groups:
      - Cequence
    name: Confidence Score
    path: confidence_score
    source: log
pipeline:
  type: pipeline
  name: Cequence
  enabled: true
  filter:
    query: source:cequence
  processors:
    - type: attribute-remapper
      name: Map `expert_rules_weight` to `confidence_score`
      enabled: true
      sources:
        - expert_rules_weight
      sourceType: attribute
      target: confidence_score
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `experimental_rules_weight` to `experimental_confidence_score`
      enabled: true
      sources:
        - experimental_rules_weight
      sourceType: attribute
      target: experimental_confidence_score
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `header_value_true_client_ip`, `client_ip` to `network.client.ip`
      enabled: true
      sources:
        - header_value_true_client_ip
        - client_ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoIP processor
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: string-builder-processor
      name: '%{rule_info.rule_id} - in attribute botdefense_rule_id'
      enabled: true
      template: '%{rule_info.rule_id}'
      target: botdefense_rule_id
      replaceMissing: false
    - type: string-builder-processor
      name: '%{risk_contributors.score} - in attribute risk_score'
      enabled: true
      template: '%{risk_contributors.score}'
      target: risk_score
      replaceMissing: false
    - type: string-builder-processor
      name: '%{risk_contributors.contributor} - in attribute risk_contributor'
      enabled: true
      template: '%{risk_contributors.contributor}'
      target: risk_contributor
      replaceMissing: false
    - type: string-builder-processor
      name: '%{expert_rules_info.rule_id} - in attribute rule_ids'
      enabled: true
      template: '%{expert_rules_info.rule_id}'
      target: rule_ids
      replaceMissing: false
    - type: grok-parser
      name: Sentinel Risk score Array
      enabled: true
      source: risk_score
      samples:
        - '2'
      grok:
        supportRules: ''
        matchRules: "test_rule %{data:risk_score_array:array}\n# %{data:users:array(“[]“,”,“)}"
    - type: grok-parser
      name: Sentinel Risk Contributor Array
      enabled: true
      source: risk_contributor
      samples:
        - Out of spec value found in response body
      grok:
        supportRules: ''
        matchRules: "test_rule %{data:risk_contributor_array:array}\n# %{data:users:array(“[]“,”,“)}"
    - type: grok-parser
      name: Botdefense Rule Id Array
      enabled: true
      source: botdefense_rule_id
      samples:
        - HR20,N9
      grok:
        supportRules: ''
        matchRules: "test_rule %{data:botdefense_rule_id_array:array}\n# %{data:users:array(“[]“,”,“)}"
    - type: grok-parser
      name: Rule Id Array
      enabled: true
      source: rule_ids
      samples:
        - C20,C9
      grok:
        supportRules: ''
        matchRules: "test_rule %{data:rule_id_array:array}\n# %{data:users:array(“[]“,”,“)}"
    - type: string-builder-processor
      name: '%{extractedData.name} - in attribute extracted_name_and_values'
      enabled: true
      template: '%{extractedData.name}'
      target: extracted_name_and_values
      replaceMissing: false
    - type: grok-parser
      name: API Call Data Array
      enabled: true
      source: extracted_name_and_values
      samples:
        - amount,product_id,merchant_id
      grok:
        supportRules: ''
        matchRules: "test_rule2 %{data:api_call_data:array}\n# %{data:users:array(“[]“,”,“)}"
    - type: attribute-remapper
      name: Map `header_value_referer` to `http.referer`
      enabled: true
      sources:
        - header_value_referer
      sourceType: attribute
      target: http.referer
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `header_value_user_agent` to `http.useragent`
      enabled: true
      sources:
        - header_value_user_agent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: user-agent-parser
      name: Parsing User Agent
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
      combineVersionDetails: false
