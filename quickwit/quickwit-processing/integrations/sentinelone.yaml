id: sentinelone
backend_only: false
facets:
  - groups:
      - DNS
    name: Answer Name
    path: dns.answer.name
    source: log
  - groups:
      - DNS
    name: Question Name
    path: dns.question.name
    source: log
  - groups:
      - DNS
    name: Question Type
    path: dns.question.type
    source: log
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - Web Access
    name: Method
    path: http.method
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Geoip
    name: Destination City Name
    path: network.destination.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Destination Continent Code
    path: network.destination.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Destination Continent Name
    path: network.destination.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Destination Country ISO Code
    path: network.destination.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Country Name
    path: network.destination.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision ISO Code
    path: network.destination.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision Name
    path: network.destination.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - SentinelOne
    name: SentinelOne hostname
    path: sentinelone.host_name
    source: log
    type: string
  - groups:
      - SentinelOne
    name: Agent group name
    path: sentinelone.agentRealtimeInfo.groupName
    source: log
    type: string
  - groups:
      - SentinelOne
    name: Analyst Verdict
    path: sentinelone.threatInfo.analystVerdict
    source: log
    type: string
  - groups:
      - SentinelOne
    name: Threat classification source
    path: sentinelone.threatInfo.classificationSource
    source: log
    type: string
  - groups:
      - SentinelOne
    name: threat confidence level
    path: sentinelone.threatInfo.confidenceLevel
    source: log
    type: string
  - groups:
      - SentinelOne
    name: Threat detection type
    path: sentinelone.threatInfo.detectionType
    source: log
    type: string
  - groups:
      - SentinelOne
    name: threatInfo.mitigationStatus
    path: sentinelone.threatInfo.mitigationStatus
    source: log
    type: string
pipeline:
  type: pipeline
  name: SentinelOne
  enabled: true
  filter:
    query: source:sentinelone
  processors:
    - type: date-remapper
      name: Define `createdAt`, `threatInfo.updatedAt`, `alertInfo.createdAt`, `event.time` as the official date of the log
      enabled: true
      sources:
        - createdAt
        - threatInfo.updatedAt
        - alertInfo.createdAt
        - event.time
    - type: attribute-remapper
      name: Map `agentRealtimeInfo.agentComputerName`, `agentRealtimeInfo.name`, `endpoint.name`, `data.origAgentName` to `sentinelone.host_name`
      enabled: true
      sources:
        - agentRealtimeInfo.agentComputerName
        - agentRealtimeInfo.name
        - endpoint.name
        - data.origAgentName
      sourceType: attribute
      target: sentinelone.host_name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.threatName`, `meta.event.name`, `ruleInfo.name`, `type` to `evt.name`
      enabled: true
      sources:
        - threatInfo.threatName
        - meta.event.name
        - ruleInfo.name
        - type
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.incidentStatus`, `alertInfo.incidentStatus` to `evt.outcome`
      enabled: true
      sources:
        - threatInfo.incidentStatus
        - alertInfo.incidentStatus
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.classification`, `event.category`, `data.eventCategory` to `evt.category`
      enabled: true
      sources:
        - threatInfo.classification
        - event.category
        - data.eventCategory
      sourceType: attribute
      target: evt.category
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.type` to `evt.type`
      enabled: true
      sources:
        - event.type
      sourceType: attribute
      target: evt.type
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `ruleInfo.severity`, `data.severity` to `evt.severity`
      enabled: true
      sources:
        - ruleInfo.severity
        - data.severity
      sourceType: attribute
      target: evt.severity
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `data.username`, `data.userName`, `threatInfo.initiatingUsername` to `usr.name`
      enabled: true
      sources:
        - data.username
        - data.userName
        - threatInfo.initiatingUsername
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userId`, `data.userId`, `threatInfo.initiatingUserid`, `user_id` to `usr.id`
      enabled: true
      sources:
        - userId
        - data.userId
        - threatInfo.initiatingUserid
        - user_id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: message-remapper
      name: Define `primaryDescription`, `ruleInfo.description`, `primary_description` as the official message of the log
      enabled: true
      sources:
        - primaryDescription
        - ruleInfo.description
        - primary_description
    - type: attribute-remapper
      name: Map `data.ipAddress`, `alertInfo.srcIp`, `src.ip.address`, `data.ip_address`, `data.srcIp` to `network.client.ip`
      enabled: true
      sources:
        - data.ipAddress
        - alertInfo.srcIp
        - src.ip.address
        - data.ip_address
        - data.srcIp
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `alertInfo.dstIp`, `dst.ip.address`, `data.dstIp` to `network.destination.ip`
      enabled: true
      sources:
        - alertInfo.dstIp
        - dst.ip.address
        - data.dstIp
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for destination ip
      enabled: true
      sources:
        - network.destination.ip
      target: network.destination.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `alertInfo.srcPort`, `src.port.number`, `data.srcPort` to `network.client.port`
      enabled: true
      sources:
        - alertInfo.srcPort
        - src.port.number
        - data.srcPort
      sourceType: attribute
      target: network.client.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `alertInfo.dstPort`, `dst.port.number`, `data.dstPort` to `network.destination.port`
      enabled: true
      sources:
        - alertInfo.dstPort
        - dst.port.number
        - data.dstPort
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.dns.request`, `data.dnsRequest` to `dns.question.name`
      enabled: true
      sources:
        - event.dns.request
        - data.dnsRequest
      sourceType: attribute
      target: dns.question.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.dns.type` to `dns.question.type`
      enabled: true
      sources:
        - event.dns.type
      sourceType: attribute
      target: dns.question.type
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.dns.response`, `data.dnsResponse` to `dns.answer.name`
      enabled: true
      sources:
        - event.dns.response
        - data.dnsResponse
      sourceType: attribute
      target: dns.answer.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `url.address` to `http.url`
      enabled: true
      sources:
        - url.address
      sourceType: attribute
      target: http.url
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event.url.action` to `http.method`
      enabled: true
      sources:
        - event.url.action
      sourceType: attribute
      target: http.method
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `agentRealtimeInfo.groupName` to `sentinelone.agentRealtimeInfo.agentgroupName`
      enabled: true
      sources:
        - agentRealtimeInfo.groupName
      sourceType: attribute
      target: sentinelone.agentRealtimeInfo.agentgroupName
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.analystVerdict` to `sentinelone.threatInfo.analystVerdict`
      enabled: true
      sources:
        - threatInfo.analystVerdict
      sourceType: attribute
      target: sentinelone.threatInfo.analystVerdict
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.confidenceLevel` to `sentinelone.threatInfo.confidenceLevel`
      enabled: true
      sources:
        - threatInfo.confidenceLevel
      sourceType: attribute
      target: sentinelone.threatInfo.confidenceLevel
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.classificationSource` to `sentinelone.threatInfo.classificationSource`
      enabled: true
      sources:
        - threatInfo.classificationSource
      sourceType: attribute
      target: sentinelone.threatInfo.classificationSource
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.detectionType` to `sentinelone.threatInfo.detectionType`
      enabled: true
      sources:
        - threatInfo.detectionType
      sourceType: attribute
      target: sentinelone.threatInfo.detectionType
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `threatInfo.mitigationStatus` to `sentinelone.threatInfo.mitigationStatus`
      enabled: true
      sources:
        - threatInfo.mitigationStatus
      sourceType: attribute
      target: sentinelone.threatInfo.mitigationStatus
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
