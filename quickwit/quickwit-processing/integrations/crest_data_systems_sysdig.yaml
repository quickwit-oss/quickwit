id: crest_data_systems_sysdig
metric_id: crest-data-systems-sysdig
backend_only: false
facets:
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Severity
    path: sysdig_severity
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Command
    path: comm
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Client Port
    path: connectionEvents.clientPort
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Host Name
    path: sysdig_hostName
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Container
    path: newProcessEvents.event_labels.container.name
    source: tag
  - groups:
      - Crest Data Systems Sysdig
    name: Process Name
    path: newProcessEvents.name
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Namespace
    path: labels.kubernetes.namespace.name
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Policy Name
    path: sysdig_policy_name
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Service
    path: sysdig_service
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Container Name
    path: labels.container.name
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Server Port
    path: connectionEvents.serverPort
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Client IP
    path: connectionEvents.clientIpv4
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Kubernetes Namespace
    path: newProcessEvents.event_labels.kubernetes.namespace.name
    source: tag
  - groups:
      - Crest Data Systems Sysdig
    name: Policy Id
    path: content.policyId
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Command Line
    path: newProcessEvents.commandLine
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Type
    path: sysdig_type
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Server IP
    path: connectionEvents.serverIpv4
    source: log
  - groups:
      - Crest Data Systems Sysdig
    name: Container Id
    path: newProcessEvents.containerId
    source: log
pipeline:
  type: pipeline
  name: Sysdig by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_sysdig
  processors:
    - type: date-remapper
      name: Define `syslog.timestamp` as the official date of the log
      enabled: true
      sources:
        - syslog.timestamp
    - type: attribute-remapper
      name: Map `labels.host.hostName`, `hostname`, `hostName` to `sysdig_hostName`
      enabled: true
      sources:
        - labels.host.hostName
        - hostname
        - hostName
      sourceType: attribute
      target: sysdig_hostName
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - name: Map sysdig_severity based on severity
      enabled: true
      source: severity
      target: sysdig_severity
      lookupTable: "0,High\n1,High\n2,High\n3,High\n4,Medium\n5,Medium\n6,Low\n7,Info"
      type: lookup-processor
    - type: attribute-remapper
      name: Map `name` to `sysdig_policy_name`
      enabled: true
      sources:
        - name
      sourceType: attribute
      target: sysdig_policy_name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map tag `service` to attribute `sysdig_service`
      enabled: true
      sources:
        - service
      sourceType: tag
      target: sysdig_service
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `type` to `sysdig_type`
      enabled: true
      sources:
        - type
      sourceType: attribute
      target: sysdig_type
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `user.username` to `usr.name`
      enabled: true
      sources:
        - user.username
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `clientIpv4Dot` to `network.client.ip`
      enabled: true
      sources:
        - clientIpv4Dot
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `serverIpv4Dot` to `network.destination.ip`
      enabled: true
      sources:
        - serverIpv4Dot
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `serverPort` to `network.destination.port`
      enabled: true
      sources:
        - serverPort
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `clientPort` to `network.client.port`
      enabled: true
      sources:
        - clientPort
      sourceType: attribute
      target: network.client.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
