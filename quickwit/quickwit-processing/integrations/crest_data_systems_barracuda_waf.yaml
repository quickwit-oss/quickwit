pipeline:
  type: pipeline
  name: Barracuda WAF by Crest Data Systems
  enabled: true
  filter:
    query: source:crest_data_systems_barracuda_waf
  processors:
    - type: grok-parser
      name: Parsing Attributes for Barracuda WAF
      enabled: true
      source: message
      samples:
        - <190>Sep  5 17:49:57 barracuda CEF:0|Barracuda|WAF|1200|2002|SSH|6|time=2023-09-05 17:49:57.007 +0530  unitName=barracuda logType=NF severity=INFO protocol=TCP src=10.50.5.41 spt=17000 dst=10.50.7.87 dpt=22 act=ALLOW aclName=SSH details=MGMT/LAN/WAN interface traffic:allow  timeEpoch=1693916397007  uniqueId=18a6548fdcf-489459bc
        - <137>Jun 27 11:03:27 barracuda CEF:0|Barracuda|WAF|1200|61|RESPONSE_HEADER_SUPPRESSED|6|src=172.20.240.249 spt=52000 dst=10.50.7.87 dpt=80 actionTaken=CLOAK attackDescription=RESPONSE_HEADER_SUPPRESSED attackDetails=[header\="server"] attackGroup=Outbound Attacks attackId=29061 logType=WF app=HTTP request=/west.php requestMethod=GET rt=1687265417668  userAgent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36" referer="-"
        - <142>Jun 27 11:03:27 barracuda CEF:0|Barracuda|WAF|1200|1000|GET|5|src=172.20.240.249 spt=52000 dst=10.50.7.87 dpt=80 app=HTTP request=/west.php in=1291 out=1822 requestMethod=GET httpStatus=404 host=10.50.7.87 query="-" referer="-" rt=1687265417668  logType=TR httpVersion=HTTP/1.1 timeTaken=2 serverTime=1 userAgent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36"
        - <142>Jun 27 11:03:27 barracuda CEF:0|Barracuda|WAF|1200|2005|CONFIG|5|duser=admin changeType=SET clientType=GUI commandName=config loginIp=172.20.13.97 loginPort=56534 transactionId=136 rt=1687338841442  logType=AUDIT objectType=syslog_server objectName=DD_Test variable=log_timestamp_hostname oldValue="No" newValue="Yes"
        - <132>Sep  6 05:14:09 Barracuda CEF:0|BarracudaNetworks|WAAS|BNWAS-1.0|WAF|WAF|4| time=2023-09-06 05:14:09.682 +0000 unitName=7c474ffbdb-fc5c2 logType=TR dst=10.238.0.24 dpt=9552 src=43.163.220.47 spt=43378 loginId="-" certificateUser="-" requestMethod=GET protocol=TLSv1.2 host=20.221.97.105 httpVersion=HTTP/1.1 httpStatus=404 out=699 in=536 cacheHit=0 timeTaken=232 serverIp=104.192.142.18 serverPort=443 serverTime=150 sessionId= responseType=SERVER profileMatched=DEFAULT protected=PASSIVE wfMatched=VALID request=/Display/chan/IB61I7MYA query="-" referer=http://20.221.97.105/Display/chan/IB61I7MYA  userAgent='Mozilla/5.0 proxyIp=43.163.220.47 proxyPort=43378 authenticatedUser="-" timeEpoch=1693977249682 cookie=secure_id_EZRPZ3EL95P213EWTYSMZTE31PT86LYH=391xe-xTepRPYmzzYTiVFYzXxRSTPGC_Kuu7cRDI9k7pwGe74UwWzlZEUIbV29AmmpntVpHyuHm_uxzWHAFIrBpi-X4cOyMxUq8VTSlX3etRCtfWBFKg0fzYTi0InLw-1szUleeTI52756HXBwUSX9PlXlcl5BEjszyJwvaMASvYhC4N
      grok:
        supportRules: ''
        matchRules: 'custom_log_format \<%{integer:id}\>((%{date("MMM d HH:mm:ss"):date}|%{date("MMM  d HH:mm:ss"):date})? %{word:hostname})?(%{regex("(\\s)*"):})?CEF\:0\|%{regex("[0-9a-zA-Z.-_]*"):device_vendor}\|%{regex("[0-9a-zA-Z.-_]*"):product}\|%{regex("[0-9a-zA-Z.-]*"):device_version}\|%{regex("[0-9a-zA-Z.-]*"):signature_id}\|%{regex("[0-9a-zA-Z.-_]*"):Name}\|%{integer:severityLevel}\|(%{regex("(\\s)*"):})?%{data::keyvalue("=",";().,-: ")}( cookie=%{data:cookie})?( referer=%{data:referer})?'
    - type: attribute-remapper
      name: Map `hostname` to `host`
      enabled: true
      sources:
        - hostname
      sourceType: attribute
      target: host
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `adminName`, `authenticatedUser`, `certificateUser`, `audit_user_text` to `usr.name`
      enabled: true
      sources:
        - adminName
        - authenticatedUser
        - certificateUser
        - audit_user_text
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `audit_user_tooltip` to `usr.email`
      enabled: true
      sources:
        - audit_user_tooltip
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `src` to `network.client.ip`
      enabled: true
      sources:
        - src
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `spt` to `network.client.port`
      enabled: true
      sources:
        - spt
      sourceType: attribute
      target: network.client.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `dst` to `network.destination.ip`
      enabled: true
      sources:
        - dst
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `dpt` to `network.destination.port`
      enabled: true
      sources:
        - dpt
      sourceType: attribute
      target: network.destination.port
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `httpStatus` to `http.status_code`
      enabled: true
      sources:
        - httpStatus
      sourceType: attribute
      target: http.status_code
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `userAgent` to `http.useragent`
      enabled: true
      sources:
        - userAgent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `requestMethod` to `http.method`
      enabled: true
      sources:
        - requestMethod
      sourceType: attribute
      target: http.method
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `referer` to `http.referer`
      enabled: true
      sources:
        - referer
      sourceType: attribute
      target: http.referer
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `httpVersion` to `http.version`
      enabled: true
      sources:
        - httpVersion
      sourceType: attribute
      target: http.version
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `request` to `http.url`
      enabled: true
      sources:
        - request
      sourceType: attribute
      target: http.url
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoIP Parser for Client IP
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: geo-ip-parser
      name: GeoIP Parser for Destination IP
      enabled: true
      sources:
        - network.destination.ip
      target: network.destination.geoip
      ip_processing_behavior: do-nothing
    - type: status-remapper
      name: Define `severityLevel` as the official status of the log
      enabled: true
      sources:
        - severityLevel
    - type: date-remapper
      name: Define `rt`, `timeEpoch` as the official date of the log
      enabled: true
      sources:
        - rt
        - timeEpoch
    - type: attribute-remapper
      name: Map `proto`, `protocol` to `cds.barracuda.waf.proto`
      enabled: true
      sources:
        - proto
        - protocol
      sourceType: attribute
      target: cds.barracuda.waf.proto
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `logType` to `cds.barracuda.waf.logType`
      enabled: true
      sources:
        - logType
      sourceType: attribute
      target: cds.barracuda.waf.logType
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `name`, `aclName` to `barracuda-acl-policy-name`
      enabled: true
      sources:
        - name
        - aclName
      sourceType: attribute
      target: barracuda-acl-policy-name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `in` to `network.bytes_read`
      enabled: true
      sources:
        - in
      sourceType: attribute
      target: network.bytes_read
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `out` to `network.bytes_written`
      enabled: true
      sources:
        - out
      sourceType: attribute
      target: network.bytes_written
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `rule` to `cds.barracuda.waf.rule`
      enabled: true
      sources:
        - rule
      sourceType: attribute
      target: cds.barracuda.waf.rule
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `msg` to `cds.barracuda.waf.msg`
      enabled: true
      sources:
        - msg
      sourceType: attribute
      target: cds.barracuda.waf.msg
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: user-agent-parser
      name: Extract details from `http.useragent`
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: true
      combineVersionDetails: false
    - type: pipeline
      name: Barracuda WAF Access
      enabled: true
      filter:
        query: '@cds.barracuda.waf.logType:TR'
      processors:
        - type: string-builder-processor
          name: Define `tr_source_ip_port` equal to %{network.client.ip}:%{network.client.port}
          enabled: true
          template: '%{network.client.ip}:%{network.client.port}'
          target: tr_source_ip_port
          replaceMissing: false
        - type: string-builder-processor
          name: Define `tr_dest_ip_port` equal to %{network.destination.ip}:%{network.destination.port}
          enabled: true
          template: '%{network.destination.ip}:%{network.destination.port}'
          target: tr_dest_ip_port
          replaceMissing: false
        - type: string-builder-processor
          name: Define `tr_server_ip_port` equal to %{serverIp}:%{serverPort}
          enabled: true
          template: '%{serverIp}:%{serverPort}'
          target: tr_server_ip_port
          replaceMissing: false
    - type: pipeline
      name: Barracuda WAF Web Firewall
      enabled: true
      filter:
        query: '@cds.barracuda.waf.logType:WF'
      processors:
        - type: string-builder-processor
          name: Define `wf_source_ip_port` equal to %{network.client.ip}:%{network.client.port}
          enabled: true
          template: '%{network.client.ip}:%{network.client.port}'
          target: wf_source_ip_port
          replaceMissing: false
        - type: string-builder-processor
          name: Define `wf_dest_ip_port` equal to %{network.destination.ip}:%{network.destination.port}
          enabled: true
          template: '%{network.destination.ip}:%{network.destination.port}'
          target: wf_dest_ip_port
          replaceMissing: false
    - type: pipeline
      name: Barracuda WAF Network Firewall
      enabled: true
      filter:
        query: '@cds.barracuda.waf.logType:NF'
      processors:
        - type: string-builder-processor
          name: Define `nf_source_ip_port` equal to %{network.client.ip}:%{network.client.port}
          enabled: true
          template: '%{network.client.ip}:%{network.client.port}'
          target: nf_source_ip_port
          replaceMissing: false
        - type: string-builder-processor
          name: Define `nf_dest_ip_port` equal to %{network.destination.ip}:%{network.destination.port}
          enabled: true
          template: '%{network.destination.ip}:%{network.destination.port}'
          target: nf_dest_ip_port
          replaceMissing: false
    - type: pipeline
      name: Barracuda WAF Service Manage
      enabled: true
      filter:
        query: -service:*.checkpoint
      processors:
        - type: attribute-remapper
          name: Map tag `service` to attribute `barracuda_service`
          enabled: true
          sources:
            - service
          sourceType: tag
          target: barracuda_service
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
