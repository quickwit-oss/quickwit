id: rapdev-glassfish
backend_only: false
facets:
  - groups:
      - Source Code
    name: Logger Name
    path: logger.name
    source: log
  - groups:
      - Source Code
    name: Thread Name
    path: logger.thread_name
    source: log
  - groups:
      - Glassfish
    name: Glassfish Level Number
    path: glassfish.level_number
    source: log
  - groups:
      - Glassfish
    name: Glassfish Version
    path: glassfish.version
    source: log
  - groups:
      - Glassfish
    name: Glassfish Logger Name
    path: glassfish.logger_name
    source: log
pipeline:
  type: pipeline
  name: Glassfish by RapDev
  enabled: true
  filter:
    query: source:rapdev-glassfish
  processors:
    - type: grok-parser
      name: Parse Glassfish Logs
      enabled: true
      source: message
