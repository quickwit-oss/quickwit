      grok:
        supportRules: "_timestamp \\[%{date(\"yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ\"):timestamp}\\]\n_version \\[(GF %{notSpace:glassfish.version})?\\]\n_level \\[%{word:level}\\]\n_logger \\[((%{notSpace:log.identifier})?\\] \\[(%{notSpace:glassfish.logger_name})?\\] \\[tid: %{data:logger:keyvalue(\"=\", \"()\")})?\\]\n_level_num \\[(levelValue: %{number:glassfish.level_number})?\\]\n_message %{data:message}"
        matchRules: odl %{_timestamp} %{_version} %{_level} %{_logger} %{_level_num} %{_message}
    - type: attribute-remapper
      name: Map `logger._ThreadID` to `logger.thread_id`
      enabled: true
      sources:
        - logger._ThreadID
      sourceType: attribute
      target: logger.thread_id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `logger._ThreadName` to `logger.thread_name`
      enabled: true
      sources:
        - logger._ThreadName
      sourceType: attribute
      target: logger.thread_name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `logger_name` to `logger.name`
      enabled: true
      sources:
        - logger_name
      sourceType: attribute
      target: logger.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: message-remapper
      name: Define `message` as the official message of the log
      enabled: true
      sources:
        - message
