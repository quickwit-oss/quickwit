id: gitlab-audit-events
metric_id: gitlab-audit-events
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
pipeline:
  type: pipeline
  name: "GitLab Audit Events"
  enabled: true
  filter:
    query: "source:gitlab-audit-events"
  processors:
    - type: grok-parser
      name: Extract date to epoch milliseconds
      enabled: true
      source: created_at
      samples:
        - 1999-01-01T00:01:02.123Z
      grok:
        supportRules: ""
        matchRules: |
          DateExtractionRule %{date("yyyy-MM-dd'T'HH:mm:ss.SSSZ"):date_ms}
    - type: date-remapper
      name: Define `date_ms` as the official date of the log
      enabled: true
      sources:
        - date_ms
    - type: attribute-remapper
      name: Map `details.ip_address` to `network.client.ip`
      enabled: true
      sources:
        - details.ip_address
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `id` to `evt.id`
      enabled: true
      sources:
        - id
      sourceType: attribute
      target: evt.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `author_id` to `usr.id`
      enabled: true
      sources:
        - author_id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `details.author_email` to `usr.email`
      enabled: true
      sources:
        - details.author_email
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `details.author_name` to `usr.name`
      enabled: true
      sources:
        - details.author_name
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `details.custom_message` to `custom_message`
      enabled: true
      sources:
        - details.custom_message
      sourceType: attribute
      target: custom_message
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `details.action` to `action`
      enabled: true
      sources:
        - details.action
      sourceType: attribute
      target: action
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event_name` to `evt.name`
      enabled: true
      sources:
        - event_name
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
