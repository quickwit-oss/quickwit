id: google.security.command.center
metric_id: google-cloud-security-command-center
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Web Access
    name: User-Agent
    path: http.useragent
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - Event
    name: Event Type
    path: evt.type
    source: log
  - groups:
      - Event
    name: Event Severity
    path: evt.severity
    source: log
  - groups:
      - Google Security Command Center
    name: Finding State
    path: finding_state
    source: log
  - groups:
      - Google Security Command Center
    name: State Change
    path: state_change
    source: log
  - groups:
      - Google Security Command Center
    name: Mute State
    path: mute_state
    source: log
pipeline:
  type: pipeline
  name: Google Security Command Center
  enabled: true
  filter:
    query: source:google.security.command.center
  processors:
    - type: arithmetic-processor
      name: event_time.milliseconds = event_time.seconds * 1000
      enabled: true
      expression: event_time.seconds * 1000
      target: event_time.milliseconds
      replaceMissing: true
    - type: date-remapper
      name: Define `event_time.milliseconds` as the official date of the log
      enabled: true
      sources:
        - event_time.milliseconds
    - type: attribute-remapper
      name: Map `finding_class_state` to `evt.category`
      enabled: true
      sources:
        - finding_class_state
      sourceType: attribute
      target: evt.category
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `category` to `evt.name`
      enabled: true
      sources:
        - category
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `finding_severity` to `evt.severity`
      enabled: true
      sources:
        - finding_severity
      sourceType: attribute
      target: evt.severity
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `access.user_name` to `usr.name`
      enabled: true
      sources:
        - access.user_name
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `access.principal_email` to `usr.email`
      enabled: true
      sources:
        - access.principal_email
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `access.caller_ip` to `network.client.ip`
      enabled: true
      sources:
        - access.caller_ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `access.user_agent` to `http.useragent`
      enabled: true
      sources:
        - access.user_agent
      sourceType: attribute
      target: http.useragent
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: user-agent-parser
      name: Parse User Agent
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
      combineVersionDetails: false
