id: browser
backend_only: true # browser integration is linked to RUM SDK and is for now only defined in logs-backend
facets:
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Web Access
    name: Browser
    path: http.useragent_details.browser.family
    source: log
  - groups:
      - Web Access
    name: Device
    path: http.useragent_details.device.family
    source: log
  - groups:
      - Web Access
    name: OS
    path: http.useragent_details.os.family
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Session ID
    path: session_id
    source: log
  - groups:
      - Web Access
    name: Page Path
    path: view.url_details.path
    source: log
  - groups:
      - Web Access
    name: Page Referrer
    path: view.referrer_details.path
    source: log
  - groups:
      - RUM
    name: View Id
    path: view.id
    source: log
  - groups:
      - RUM
    name: Application Id
    path: application_id
    source: log
  - groups:
      - RUM
    name: User Action Id
    path: user_action.id
    source: log
pipeline:
  type: pipeline
  name: Web Browser logs
  enabled: true
  filter:
    query: source:browser
  processors:
    - type: url-parser
      name: Parsing the backend endpoint url
      enabled: true
      sources:
        - http.url
      target: http.url_details
    - type: user-agent-parser
      name: ''
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
    - type: url-parser
      name: Parsing the url of the current page
      enabled: true
      sources:
        - view.url
      target: view.url_details
    - type: url-parser
      name: Parsing the url of the previous page
      enabled: true
      sources:
        - view.referrer
      target: view.referrer_details
    - type: geo-ip-parser
      name: ''
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
