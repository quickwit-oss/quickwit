        query: service:cds.upguard.risks
      processors:
        - type: attribute-remapper
          name: Map `category` to `cds.upguard.category`
          enabled: true
          sources:
            - category
          sourceType: attribute
          target: cds.upguard.category
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `finding` to `cds.upguard.finding`
          enabled: true
          sources:
            - finding
          sourceType: attribute
          target: cds.upguard.finding
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `risk` to `cds.upguard.risk_details`
