[package]
name = "pomsky-intake"
description = "Pomsky intake and processing service: runs Vector with a default pipeline config"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pomsky-intake"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
bytesize = { workspace = true }
arc-swap = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
murmur3 = { workspace = true }
# `std` is required for protobuf map<> field support (generated code uses HashMap).
prost = { workspace = true, features = ["std"] }
quickwit-common = { workspace = true }
quickwit-opentelemetry = { workspace = true }
quickwit-parquet-engine = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Vector's `GenerateConfig` trait exposes `toml::Value` from Vector's 0.9
# dependency. Keep this crate on the same package version for those impls.
toml = { version = "0.9.8", default-features = false, features = ["serde", "display", "parse"] }
tracing = { workspace = true }
typetag = { workspace = true }
vector = { workspace = true }
vector-lib = { workspace = true }
warp = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
glob = { workspace = true }
prost-build = { workspace = true }

[package.metadata.cargo-machete]
# tokio is a direct dep for the binary (main.rs) and its `tracing` feature is
# required by vector-buffers (tokio::task::Builder needs tokio_unstable + tracing).
# prost is used by the generated code in src/codegen/ (see build.rs + src/protos.rs
# `include!`), which cargo-machete can't analyze.
ignored = ["prost", "tokio"]

[features]
