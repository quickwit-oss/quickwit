[package]
name = "quickwit-aws"
description = "Set up AWS config and clients"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aws-config = { workspace = true }
aws-runtime = { workspace = true }
aws-sdk-kinesis = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true, optional = true }
aws-smithy-async = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-smithy-runtime-api = { workspace = true, features = ["http-1x"] }
aws-smithy-types = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true, features = ["client-proxy", "http1"] }
mini-moka = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

quickwit-common = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }

[features]
kinesis = ["aws-sdk-kinesis"]
sqs = ["aws-sdk-sqs"]

[package.metadata.cargo-machete]
# tracing is only referenced from inside quickwit_common's rate_limited_* macros
# (via an absolute `::tracing::` path), so it doesn't show up textually in this crate.
ignored = ["tracing"]
