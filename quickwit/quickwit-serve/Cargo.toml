quickwit-storage = { workspace = true, features = ["testsuite"] }
quickwit-doc-mapper = { workspace = true }

[features]
metrics = ["quickwit-indexing/metrics"]
datafusion = ["dep:datafusion", "dep:datafusion-sql", "dep:quickwit-datafusion"]
pprof = [
  "dep:pprof"
]
jemalloc-profiled = [
  "quickwit-common/jemalloc-profiled"
]
testsuite = []
sqs-for-tests = [
  "quickwit-indexing/sqs",
  "quickwit-indexing/sqs-test-helpers"
]
lambda = [
  "quickwit-lambda-client"
]

[[bench]]
name = "routing_filter_bench"
harness = false
required-features = ["testsuite"]
