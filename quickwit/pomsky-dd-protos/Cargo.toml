[package]
name = "pomsky-dd-protos"
description = "Vendored Datadog-external protobuf definitions and generated Rust types"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# `std` is required for protobuf map<> field support (generated code uses HashMap).
prost = { workspace = true, features = ["std"] }

[build-dependencies]
prost-build = { workspace = true }

[package.metadata.cargo-machete]
# `prost` is used by the generated code in $OUT_DIR (see build.rs + lib.rs
# `include!`), which cargo-machete can't analyze.
ignored = ["prost"]
