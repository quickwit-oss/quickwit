[package]
name = "quickwit-datafusion"
description = "DataFusion query execution and storage integration for Quickwit"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
url = "2"

quickwit-common = { workspace = true }
quickwit-df-core = { workspace = true, features = ["grpc"] }
quickwit-search = { workspace = true }
quickwit-storage = { workspace = true }

datafusion = "53"
datafusion-distributed = "1.0"
object_store = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

quickwit-common = { workspace = true, features = ["testsuite"] }
quickwit-config = { workspace = true, features = ["testsuite"] }
