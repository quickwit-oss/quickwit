# Delete possibly remaining index
method: DELETE
endpoint: indexes/simple
status_code: null
---
# Create index
method: POST
endpoint: indexes/
json:
  version: "0.7"
  index_id: simple
  doc_mapping:
    timestamp_field: ts
    mode: dynamic
    field_mappings:
      - name: ts
        type: datetime
        fast: true
      - name: not_fast
        type: datetime
        fast: true
    dynamic_mapping:
      tokenizer: default
      expand_dots: true
      fast: true
---
# Ingest documents
method: POST
endpoint: simple/ingest
params:
  commit: force
ndjson:
  - {"ts": 1684993001, "not_fast": 1684993001, "auto_date": "2023-05-25T10:00:00Z"}
  - {"ts": 1684993002, "not_fast": 1684993002, "auto_date": "2023-05-25T11:00:00Z"}
---
# Ingest documents split #2
method: POST
endpoint: simple/ingest
params:
  commit: force
ndjson:
  - {"ts": 1684993003, "not_fast": 1684993003}
  - {"ts": 1684993004, "not_fast": 1684993004}
  # a missing timestamp
  - {"not_fast": 1684993003}
---
method: DELETE
endpoint: indexes/nested
status_code: null
---
method: POST
endpoint: indexes/
json:
  version: "0.7"
  index_id: nested
  doc_mapping:
    index_field_presence: true
    # default mode is dynamic
    field_mappings:
      - name: json_text
        type: json
        indexed: true
      - name: json_fast
        type: json
        stored: true
        fast: true
      - name: object_multi
        type: object
        field_mappings:
          - name: object_text_field
            type: text
          - name: object_fast_field
            type: u64
            fast: true
      - name: text_fast
        type: text
        fast: true
        indexed: false
      - name: text_raw
        type: text
        fast: false
        indexed: true
        tokenizer: raw

---
method: POST
endpoint: nested/ingest
params:
  commit: force
ndjson:
  - {"json_text": {"field_a": "hello", "field_b": "world"}}
  - {"json_text": {"field_a": "hi"}}
  - {"json_fast": {"field_c": 1}}
  - {"object_multi": {"object_text_field": "multi hello"}}
  - {"object_multi": {"object_fast_field": 1}}
  - {"object_multi": {"object_fast_field": 2}}
  - {"text_raw": "indexed-with-raw-tokenizer-dashes"}
  - {"text_raw": "indexed with raw tokenizer dashes"}
  - {"text_fast": "fast-text-value-dashes"}
  - {"text_fast": "fast text value whitespaces"}
---
method: DELETE
endpoint: indexes/millisec
status_code: null
---
method: POST
endpoint: indexes/
json:
  version: "0.7"
  index_id: millisec
  doc_mapping:
    timestamp_field: ts
    mode: strict
    field_mappings:
      - name: ts
        type: datetime
        fast: true
        input_formats: ["rfc3339"]
        fast_precision: milliseconds
---
method: POST
endpoint: millisec/ingest
params:
  commit: force
ndjson:
  - {"ts": "2022-12-16T10:00:56.297Z"}
  - {"ts": "2022-12-16T10:00:57.000Z"}
  - {"ts": "2022-12-16T10:00:57.297Z"}
---
method: DELETE
endpoint: indexes/cursor
status_code: null
---
method: POST
endpoint: indexes/
json:
  version: "0.7"
  index_id: cursor
  doc_mapping:
    timestamp_field: ts
    mode: strict
    field_mappings:
      - name: ts
        type: datetime
        fast: true
        input_formats: ["rfc3339"]
        fast_precision: milliseconds
      - name: ts_micros
        type: datetime
        fast: true
        input_formats: ["rfc3339"]
        fast_precision: microseconds
      - name: id
        type: u64
---
# A single batch lands in a single split, so docs are addressed in ingestion order: the tied docs
# 2, 3, and 4 keep that order, and the address order differs from the timestamp order.
method: POST
endpoint: cursor/ingest
params:
  commit: force
ndjson:
  - {"ts": "2022-12-16T10:00:00.003Z", "ts_micros": "2022-12-16T10:00:00.003Z", "id": 5}
  - {"ts": "2022-12-16T10:00:00.002Z", "ts_micros": "2022-12-16T10:00:00.002Z", "id": 2}
  - {"ts": "2022-12-16T10:00:00.002Z", "ts_micros": "2022-12-16T10:00:00.002Z", "id": 3}
  - {"ts": "2022-12-16T10:00:00.001Z", "ts_micros": "2022-12-16T10:00:00.001Z", "id": 1}
  - {"ts": "2022-12-16T10:00:00.002Z", "ts_micros": "2022-12-16T10:00:00.002Z", "id": 4}
