endpoint: api/v1/datadog/search
params:
  query: "service:*"
expected:
  num_hits: 6
---
endpoint: api/v1/datadog/search
params:
  query: "service:service123"
expected:
  num_hits: 5
---
endpoint: api/v1/datadog/search
params:
  query: "service:blub"
expected:
  num_hits: 0
---
endpoint: api/v1/datadog/search
params:
  query: "service:override-service"
expected:
  num_hits: 1
  hits:
    - { "service": "override-service", "host": "override-host", "source": "override-source"}
---
# Only message is required
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
  [
    {
      "message": "Test log message"
    }
  ]
status_code: 200
---
# Accept plain/text
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: "some text"
status_code: 200
---
# Accept single object
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
    {
      "message": "Test log message",
      "status": "INFO",
      "timestamp": 1740411608806,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    }
status_code: 200
---
# Accept json array without message field
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
    [{
      "service": "service123",
      "text": "Test log message"
    }]
status_code: 200
---
# Accept any header
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: header? nono, we accept everything
data: |
    "accept this header, mkay?"
status_code: 200

