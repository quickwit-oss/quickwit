# Delete possibly remaining index
method: DELETE
endpoint: api/v1/indexes/datadog
status_code: null
---
# Create index
method: POST
api_root: http://localhost:7280/api/v1/
endpoint: indexes/
json:
  version: "0.9"
  index_id: datadog
  indexing_settings:
    commit_timeout_secs: 1
  doc_mapping: !include ../../config/cloudprem/datadog-logs.yaml::doc_mapping
  search_settings: !include ../../config/cloudprem/datadog-logs.yaml::search_settings
---
# Set routing table to route all logs to datadog index
method: PUT
endpoint: api/v1/index-routing-table
json:
  - filter: "*"
    index_id: datadog
---
# Ingest documents
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
  [
    {
      "message": "Test log message",
      "status": "INFO",
      "timestamp": 1762360556600,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    },
    {
      "message": "Test log message",
      "status": "INFO",
      "timestamp": 1762360556700,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    },
    {
      "message": "Error message",
      "status": "ERROR",
      "timestamp": 1762360556600,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    },
    {
      "message": "Other error message",
      "status": "ERROR",
      "timestamp": 1762361446281,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    }
  ]
---
# Ingest documents that are overridden by query parameters
method: POST
endpoint: /api/v2/logs?ddsource=override-source&ddtags=override:tag1&hostname=override-host&service=override-service
headers:
  Content-Type: application/json
data: |
  [
    {
      "message": "Test log message",
      "status": "INFO",
      "timestamp": 1740411608806,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    }
  ]
---
# Ingest document with error.message, error.stack, and title for extra_fts testing
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
  [
    {
      "message": "{\"error\":{\"message\":\"connection refused by remote host\",\"stack\":\"RuntimeError at handle_request line 42\"},\"title\":\"payment service crash\"}",
      "status": "ERROR",
      "timestamp": 1762360556800,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "java",
      "ddtags": "env:dev"
    }
  ]
sleep_after: 10
