# Delete possibly remaining index
method: DELETE
endpoint: api/v1/indexes/datadog
status_code: null
---
# Create index
method: POST
api_root: http://localhost:7280/api/v1/
endpoint: indexes/
json:
  version: "0.9"
  index_id: datadog
  indexing_settings:
    commit_timeout_secs: 1
  doc_mapping:
    mode: dynamic
    timestamp_field: timestamp
    field_mappings:
      - name: timestamp
        type: datetime
        fast: true
        input_formats:
          - rfc3339
      - name: service
        type: text
        fast: true
---
# Ingest documents
method: POST
endpoint: /api/v2/logs
headers:
  Content-Type: application/json
data: |
  [
    {
      "message": "Test log message",
      "status": "INFO",
      "timestamp": 1740411608806,
      "hostname": "test-host",
      "service": "service123",
      "ddsource": "rust",
      "ddtags": "env:dev,region:us-east"
    }
  ]
sleep_after: 10
