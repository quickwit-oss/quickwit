[overrides]
# These crates do not specify a homepage in their metadata.
"openssl-macros" = { origin = "https://github.com/sfackler/rust-openssl" }

# rust-license-tool can't find the license for crunchy-0.2.2, but it's MIT
# according to the crate's Cargo.toml.
"crunchy-0.2.2" = { license = "MIT", origin = "https://github.com/eira-fransham/crunchy" }

# `ring` has a custom license that is mostly "ISC-style" but parts of it also fall under OpenSSL licensing.
"ring-0.17.8" = { license = "ISC AND Custom" }

"event-percolation" = { license = "Datadog" }

# Vector subcrates don't set license metadata in their Cargo.toml.
# Vector is licensed under MPL-2.0.
"codecs-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
"enrichment-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
"opentelemetry-proto-0.1.0" = { license = "Apache-2.0", origin = "https://github.com/open-telemetry/opentelemetry-rust/tree/main/opentelemetry-proto" }
"vector-buffers-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
"vector-core-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
"vector-lib-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
"vector-stream-0.1.0" = { license = "MPL-2.0", origin = "https://github.com/vectordotdev/vector" }
