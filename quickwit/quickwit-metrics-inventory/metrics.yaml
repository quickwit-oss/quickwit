  module: quickwit_storage::metrics
  kind: counter
  description: Number of failed GetObject attempts, counted per attempt (retried attempts included), labeled by error class (throttled, transient, timeout, other). Use class="throttled" to measure S3 rate limiting.
quickwit_storage_object_storage_get_errors_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Number of GetObject errors.
quickwit_storage_object_storage_get_slice_in_flight_count:
  module: quickwit_storage::metrics
  kind: gauge
  description: Number of GetObject for which the memory was allocated but the download is still in progress.
quickwit_storage_object_storage_get_slice_in_flight_num_bytes:
  module: quickwit_storage::metrics
  kind: gauge
  description: Memory allocated for GetObject requests that are still in progress.
quickwit_storage_object_storage_gets_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Number of objects fetched. Might be lower than get_slice_timeout_outcome if queries are debounced.
quickwit_storage_object_storage_put_attempt_errors_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Number of failed S3 PutObject and UploadPart attempts, counted per attempt (retried attempts included), labeled by error class. Use class="throttling" to measure S3 rate limiting.
quickwit_storage_object_storage_put_errors_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Number of S3 object uploads that failed after retries were exhausted.
quickwit_storage_object_storage_puts_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Number of objects uploaded. May differ from object_storage_requests_parts due to multipart upload.
quickwit_storage_object_storage_request_duration_seconds:
  module: quickwit_storage::metrics
  kind: histogram
  description: Duration of object storage requests in seconds.
quickwit_storage_object_storage_requests_total:
  module: quickwit_storage::metrics
  kind: counter
  description: Total number of object storage requests performed.
quickwit_storage_object_storage_upload_num_bytes:
  module: quickwit_storage::metrics
  kind: counter
  description: Amount of data uploaded to an object storage.
quickwit_thread_pool_ongoing_tasks:
  module: quickwit_common::thread_pool
  kind: gauge
  description: number of tasks being currently processed by threads in the thread pool
quickwit_thread_pool_pending_tasks:
  module: quickwit_common::thread_pool
  kind: gauge
  description: number of tasks waiting in the queue before being processed by the thread pool
quickwit_tls_cert_reloads_total:
  module: quickwit_transport::tls
  kind: counter
  description: 'Total number of TLS certificate hot-reload attempts, labeled by `result` (`success`: a new cert was applied without a restart; `failure`: the attempt failed and the current cert was kept).'
quickwit_write_bytes:
  module: quickwit_common::io
  kind: counter
  description: Number of bytes written by a given component in [indexer, merger, deleter, split_downloader_{merge,delete}]
