[package]
name = "quickwit-doc-mapper"
description = "Index schema and document mapping"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
time = { workspace = true, optional = true }
base64 = { workspace = true }
fnv = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
nom = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_borrow = { workspace = true }
siphasher = { workspace = true }
tantivy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

quickwit-common = { workspace = true }
quickwit-datetime = { workspace = true }
quickwit-macros = { workspace = true }
quickwit-proto = { workspace = true }
quickwit-query = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-json = { workspace = true }
binggan = { workspace = true }
matches = { workspace = true }
serde_yaml = { workspace = true }
time = { workspace = true }

quickwit-common = { workspace = true, features = ["testsuite"] }
quickwit-query = { workspace = true }

[features]
testsuite = []
# Builds tantivy documents straight from Arrow record batches (Parquet bulk load).
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:time"]

[[bench]]
name = "doc_to_json_bench"
harness = false

[[bench]]
name = "routing_expression_bench"
harness = false
