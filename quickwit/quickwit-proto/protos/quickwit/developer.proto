syntax = "proto3";

import "metrics.proto";

package quickwit.developer;

service DeveloperService {
  rpc GetDebugInfo(GetDebugInfoRequest) returns (GetDebugInfoResponse);
  rpc PullMetrics(PullMetricsRequest) returns (PullMetricsResponse);
  rpc GetNodeDiagnostics(GetNodeDiagnosticsRequest) returns (GetNodeDiagnosticsResponse);
}

message GetDebugInfoRequest {
  // Restricts the debug info to the given roles.
  repeated string roles = 1;
}

message GetDebugInfoResponse {
  bytes debug_info_json = 1;
}

message PullMetricsRequest {}

message PullMetricsResponse {
    repeated cloudprem.metrics.MetricFamily metric_families = 1;
}

message GetNodeDiagnosticsRequest {}

message GetNodeDiagnosticsResponse {
    string build_info_json = 1;
    string runtime_info_json = 2;
    string node_config_json = 3;
}
