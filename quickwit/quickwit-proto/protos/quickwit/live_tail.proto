syntax = "proto3";

package quickwit.live_tail;

import "quickwit/common.proto";

// Hosted by indexer nodes. Streams the documents persisted by the local ingester for an index
// that match a query.
service LiveTailService {
  // Opens a live tail session. The stream never ends on its own: it ends when the client drops it
  // or when the node shuts down. Dead nodes are detected through cluster membership.
  rpc OpenLiveTail(OpenLiveTailRequest) returns (stream LiveTailMessage);
}

message OpenLiveTailRequest {
  // Uniquely identifies the session for logging and debugging purposes.
  string session_id = 1;
  quickwit.common.IndexUid index_uid = 2;
  // JSON-serialized `QueryAst`. It must be resolved: user queries must have been parsed with the
  // index default search fields by the caller.
  string query_ast_json = 3;
  // Maximum number of documents per second sent by this node for this session. Extra matching
  // documents are dropped and reported in `LiveTailDropped` messages.
  uint32 max_docs_per_sec = 4;
  // Maximum size of the gRPC messages that the caller accepts. The node sends messages no larger
  // than this and its own `grpc.max_message_size`. Must be positive.
  uint64 max_message_num_bytes = 5;
}

message LiveTailMessage {
  oneof message {
    LiveTailHits hits = 1;
    LiveTailDropped dropped = 2;
  }
}

message LiveTailHits {
  // Matching documents, as newline-delimited JSON objects, in the order they were persisted by
  // the ingester.
  bytes docs_ndjson = 1;
}

enum LiveTailDropReason {
  LIVE_TAIL_DROP_REASON_UNSPECIFIED = 0;
  // The session did not keep up with the ingestion throughput.
  LIVE_TAIL_DROP_REASON_LAGGED = 1;
  // More documents matched than `max_docs_per_sec`.
  LIVE_TAIL_DROP_REASON_RATE_LIMITED = 2;
  // The document is larger than the maximum size of a gRPC message.
  LIVE_TAIL_DROP_REASON_TOO_LARGE = 3;
}

message LiveTailDropped {
  LiveTailDropReason reason = 1;
  // Number of documents dropped. For `LAGGED`, this is the number of batches: the documents of
  // lagged batches are not inspected.
  uint64 num_dropped = 2;
}
