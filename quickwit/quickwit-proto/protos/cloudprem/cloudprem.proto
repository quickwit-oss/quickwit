syntax = "proto3";

package cloudprem;

option go_package = "github.com/DataDog/dd-source/domains/event-platform/shared/libs/cloudprem-proto";
option java_package = "com.dd.event_platform.cloudprem.proto";

// We voluntarily avoid the multiple files option:
// Java does not make it possible to alias classnames, or import a package.
// We want to have a way to qualify the protobuf object class
// in a non ambiguous way. The static class will help with this.
option java_multiple_files = false;
option java_outer_classname = "CloudPremProto";

import "google/protobuf/any.proto";
import "search.proto";
import "metrics.proto";
import "index.proto";

service CloudPremService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc FetchOne(FetchOneRequest) returns (FetchOneResponse);
  rpc Aggregate(AggregationRequest) returns (AggregationResponse);
  // Gather metrics information from all nodes in the cluster, and returns a list of `NodeMetrics` objects.
  rpc PullClusterMetrics(PullClusterMetricsRequest) returns (PullClusterMetricsResponse);

  // These are endpoints to use the capabilities of the underlying quickwit searcher
  rpc RootSearch(quickwit.search.SearchRequest) returns (quickwit.search.SearchResponse);
  rpc RootListTerms(quickwit.search.ListTermsRequest) returns (quickwit.search.ListTermsResponse);
  rpc RootListFields(quickwit.search.ListFieldsRequest) returns (quickwit.search.ListFieldsResponse);

  // Returns the list of indexes
  rpc GetIndexes(GetIndexesRequest) returns (GetIndexesResponse);

  // Creates a new index.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // Updates an existing index.
  rpc UpdateIndex(UpdateIndexRequest) returns (UpdateIndexResponse);

  // Deletes an existing index.
  rpc DeleteIndex(DeleteIndexRequest) returns (DeleteIndexResponse);

  // Gets the index routing table.
  rpc GetIndexRoutingTable(GetIndexRoutingTableRequest) returns (GetIndexRoutingTableResponse);

  // Sets the index routing table.
  rpc SetIndexRoutingTable(SetIndexRoutingTableRequest) returns (SetIndexRoutingTableResponse);

  // Returns diagnostics of every node in the cluster.
  rpc GetClusterDiagnostics(GetClusterDiagnosticsRequest) returns (GetClusterDiagnosticsResponse);

  // Elasticsearch HTTP passthrough for Trino ES connector.
  rpc EsQuery(EsHttpRequest) returns (EsHttpResponse);

  // Executes a DataFusion SQL or Substrait query via the OSS DataFusion session builder.
  // Requires QW_ENABLE_DATAFUSION_ENDPOINT=true and the Searcher role.
  rpc SubstraitSearch(CloudpremSubstraitRequest) returns (CloudpremSubstraitResponse);

  // Response are sent to the bridge by the front, which initialised the connection
  rpc InvertedRequestStream(stream AnyResponse) returns (stream AnyRequest);
}

message AnyRequest {
    uint64 req_id = 1;
    Context context = 2;

    oneof request {
        PingRequest ping = 11;
        ListRequest list = 12;
        FetchOneRequest fetch_one = 13;
        AggregationRequest aggregation = 14;
        PullClusterMetricsRequest pull_cluster_metrics = 15;
        quickwit.search.SearchRequest root_search = 17;
        quickwit.search.ListTermsRequest root_list_terms = 18;

        // Same as a ping, but not propagated further
        PingRequest local_ping = 21;
        
        GetIndexesRequest get_indexes = 22;
        CreateIndexRequest create_index = 23;
        UpdateIndexRequest update_index = 24;
        DeleteIndexRequest delete_index = 25;
        quickwit.search.ListFieldsRequest root_list_fields = 26;
        GetIndexRoutingTableRequest get_index_routing_table = 27;
        SetIndexRoutingTableRequest set_index_routing_table = 28;
        CloudpremSubstraitRequest substrait_search = 29;
        EsHttpRequest es_query = 30;
        GetClusterDiagnosticsRequest get_cluster_diagnostics = 31;

        CancelRequest cancel = 99;
    }
}

message AnyResponse {
    uint64 req_id = 1;
    uint32 grpc_code = 2;

    oneof response {
        // this packet serves to identify which cluster this connection is about. It must be the 1st message transmitted, and cannot be transmitted again later.
        // If originating from outside Datadog, the message should be sanitized with the proper orgId before being transmitted.
        // Violation of these constraints could lead to cluster impresonation, so all relevant component should enforce them and terminate any violating stream.
        ClusterIdentify cluster_identify = 9;
        // this is a pseudoresponse returned when an error occured
        string grpc_message = 10;
        PingResponse ping = 11;
        ListResponse list = 12;
        FetchOneResponse fetch_one = 13;
        AggregationResponse aggregation = 14;
        PullClusterMetricsResponse pull_cluster_metrics = 15;
        quickwit.search.SearchResponse root_search = 17;
        quickwit.search.ListTermsResponse root_list_terms = 18;

        // Same as a ping, but not propagated further
        PingResponse local_ping = 21;
        
        GetIndexesResponse get_indexes = 22;
        CreateIndexResponse create_index = 23;
        UpdateIndexResponse update_index = 24;
        DeleteIndexResponse delete_index = 25;
        quickwit.search.ListFieldsResponse root_list_fields = 26;
        GetIndexRoutingTableResponse get_index_routing_table = 27;
        SetIndexRoutingTableResponse set_index_routing_table = 28;
        CloudpremSubstraitResponse substrait_search = 29;
        EsHttpResponse es_query = 30;
        GetClusterDiagnosticsResponse get_cluster_diagnostics = 31;

    }
}

message Context {
        map<string, string> values = 1;
}

message ClusterIdentify {
    // org_id is used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
    int64 org_id = 1;
    // This is a uuid. it may be unset for older Pomsky versions
    // This uuid has been generated by the cluster itself.
    string cluster_remote_uid = 2;
    string name = 3;
}

message PullClusterMetricsRequest {
}

message PullClusterMetricsResponse {
    // One `NodeMetrics` object per node in the cluster.
    repeated NodeMetrics node_metrics = 1;
}

message NodeMetrics {
    string node_id = 1;
    // A http status code expressing the success or the cause of failure of pull metrics for this
    // specific node.
    // The usage of http status code is arbitrary here. It can be the result of a conversion from a grpc status code,
    // or the interpretation of a timeout for instance.
    uint32 status_code = 2;
    // `node_labels` contains the list of labels that should be associated to the metrics of that node.
    // e.g. the service. Note that cloudprem-bridge may extend the set of labels with cluster-level information.
    // (region etc.)
    repeated cloudprem.metrics.Label node_labels = 3;
    // The actual metrics of the node.
    repeated cloudprem.metrics.MetricFamily metric_families = 4;
}

message PingRequest {
  // org_id is used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 1;
  Scope scope = 2;
}

message PingResponse {}

message GetIndexesRequest {
  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message GetIndexesResponse {
  repeated cloudprem.index.IndexMetadata indexes = 1;
}

message CreateIndexRequest {
  // Unique identifier for the index to create.
  string index_id = 1;

  optional cloudprem.index.IndexConfig index_config = 2;

  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message CreateIndexResponse {
  // Metadata of the created index.
  cloudprem.index.IndexMetadata index_metadata = 1;
}

message UpdateIndexRequest {
  // Unique identifier for the index to update.
  string index_id = 1;

  cloudprem.index.IndexConfig index_config = 2;

  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message UpdateIndexResponse {
  // Metadata of the updated index.
  cloudprem.index.IndexMetadata index_metadata = 1;
}

message DeleteIndexRequest {
  // Unique identifier for the index to delete.
  string index_id = 1;

  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message DeleteIndexResponse {
  // Empty response indicating successful deletion.
}

// A routing rule maps a filter pattern to an index.
message IndexRoutingRule {
  string filter = 1;
  string index_id = 2;
}

message GetIndexRoutingTableRequest {
  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message GetIndexRoutingTableResponse {
  // The routing table as an ordered list of routing rules.
  repeated IndexRoutingRule routing_table = 1;
}

message SetIndexRoutingTableRequest {
  // The routing table as an ordered list of routing rules.
  repeated IndexRoutingRule routing_table = 1;

  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message SetIndexRoutingTableResponse {
  // Empty response indicating successful update.
}

message NodeDiagnostics {
  // A http status code expressing the success or the cause of failure of getting diagnostics for
  // this specific node.
  // Similar to NodeMetrics, the usage of http status code is arbitrary here. It can be the result of a
  // conversion from a grpc status code, or the interpretation of a timeout for instance.
  uint32 status_code = 1;
  string build_info_json = 2;
  string runtime_info_json = 3;
  string node_config_json = 4;
  string env_info_json = 5;
}

message GetClusterDiagnosticsRequest {
  // org_id,cluster_id are used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 998;
  string cluster_id = 999;
}

message GetClusterDiagnosticsResponse {
  map<string, NodeDiagnostics> cluster_diagnostics = 1;
}

message ListRequest {
  // this is always a com.dd.queryparser.proto.QueryNode, but we can't import logs-backend protobuf from here
  google.protobuf.Any query = 1;
  uint32 num_events_to_fetch = 2;
  bool should_compute_count = 3;
  repeated string columns = 4;
  bool fetch_only_requested_columns = 9;
  repeated SortKV sort = 5;
  // org_id is used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 6;
  optional EventTracker search_after = 7;
  Scope scope = 8;
  // Quickwit index ID patterns to search (e.g. ["datadog-logs", "datadog-metrics"]).
  // If empty, defaults to "datadog*" for backward compatibility.
  repeated string index_id_patterns = 10;
  // When true, pomsky may batch this request with other concurrent requests that
  // share the same query predicate. Set by cloudprem-bridge when the
  // logs-cloudprem-search-request-batching feature flag is enabled for the org.
  bool enable_request_batching = 11;
}

message SortKV {
  bool ascending = 1;
  string name = 2;
  string path = 3;
}

message ListResponse {
  uint64 count = 1;
  repeated Stream streams = 2;
  Statistics statistics = 3;
}

message Statistics {
  uint64 hit_count = 1;
  uint64 scanned_count = 2;
  uint64 result_memory_size = 3;
  uint64 max_result_memory_size = 4;
}

message Stream {
  repeated Event events = 1;
}

message Event {
  EventTracker tracker = 1;
  string content_json = 2;
}

message EventTracker {
  // A unique id tied to the event.
  string id = 1;

  // The epoch in milliseconds marking when the event was created.
  uint64 epoch_ms = 2;

  // An extra int to break ties.
  int32 tiebreaker = 3;

  optional string fragment_id = 4;

  optional uint64 row_number = 5;
}

message FetchOneRequest {
  EventTracker event_tracker = 1;
  // org_id is used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 2;
  // this is always a com.dd.queryparser.proto.QueryNode, but we can't import logs-backend protobuf from here
  google.protobuf.Any restriction_query = 3;
  Scope scope = 4;
  // Quickwit index ID patterns to search (e.g. ["datadog-logs", "datadog-metrics"]).
  // If empty, defaults to "datadog*" for backward compatibility.
  repeated string index_id_patterns = 5;
}

message FetchOneResponse {
  optional Event event = 1;
  Statistics statistics = 2;
}

message AggregationRequest {
  // this is always a com.dd.queryparser.proto.QueryNode, but we can't import logs-backend protobuf from here
  google.protobuf.Any query = 1;
  Aggregation aggregation = 2;
  // org_id is used for routing in cloudprem-bridge (which shares this api), ignored in pomsky
  int64 org_id = 3;
  Scope scope = 4;
  // Quickwit index ID patterns to search (e.g. ["datadog-logs", "datadog-metrics"]).
  // If empty, defaults to "datadog*" for backward compatibility.
  repeated string index_id_patterns = 5;
  // When true, pomsky may batch this request with other concurrent requests that
  // share the same query predicate. Set by cloudprem-bridge when the
  // logs-cloudprem-search-request-batching feature flag is enabled for the org.
  bool enable_request_batching = 6;
}

message Aggregation {
  oneof Aggregation {
    AttributeGroupBy attribute_group_by = 1;
    TimeGrouping time_group_by = 2;
    HistogramGroupBy histogram_group_by = 3;
    FlatFieldsGroupBy flat_fields_group_by = 4;
    Computes computes = 5;
    ListCompute list_compute = 6;
    AnyCompute any_compute = 7;
    MetricCompute metric_compute = 8;
  }
}

message AttributeGroupBy {
  ExpressionNode expression = 1;
  uint32 limit = 2;
  SortByExprAndAgg sort = 3;
  optional string missing = 4;
  optional string total = 5;
  Aggregation child = 6;
  optional string include = 7;
}

message TimeGrouping {
  string output = 1;
  string path = 2;
  string time_zone = 3;
  optional uint64 interval_ns = 4;
  // string based rollup
  reserved 5;
  optional Rollup rollup = 7;
  Aggregation child = 6;
}

message Rollup {
  RollupType type = 1;
  uint64 quantity = 2;
  string time_zone = 3;
  optional string alignment = 4;

  enum RollupType {
    INVALID = 0;
    YEAR = 1;
    MONTH = 2;
    WEEK = 3;
    DAY = 4;
    HOUR = 5;
    MINUTE = 6;
  }
}

message HistogramGroupBy {
  string output = 1;
  string path = 2;
  string attribute = 3;
  Bucket bucket = 4;
}

message Bucket {
  double interval = 1;
  double min = 2;
  double max = 3;
  bool with_out_of_bounds_bucket = 4;
}

message FlatFieldsGroupBy {
  repeated Field fields = 1;
  repeated string outputs = 2;
  uint32 limit = 3;
  SortByExprAndAgg sort = 4;
  optional string total = 5;
  Aggregation child = 6;
}

message Field {
  ExpressionNode expression = 1;
  optional string missing = 2;
}

message Computes {
  repeated Aggregation aggregation = 1;
  repeated TimeGrouping time_grouping = 2;
}

message ListCompute {
  ExpressionNode sort = 1;
  repeated ExpressionNode to_list = 2;
  uint32 limit = 3;
  bool ascending = 4;
  string id = 5;
}

message AnyCompute {
  repeated ExpressionNode to_list = 1;
  uint32 limit = 2;
  string id = 3;
}

message MetricCompute {
  ExpressionNode expression = 1;
  string id = 2;
  string type = 3;
}

message AggregationResponse {
  repeated AggregationResult result = 1;
  Statistics statistics = 2;
}

message AggregationResult {
  repeated string key = 1;
  repeated AggValue value = 2;
}

message SortByExprAndAgg {
  bool ascending = 1;
  optional ExprAndAgg expr_and_agg = 2;
  SortType type = 3;
  enum SortType {
    INVALID = 0;
    TIME = 1;
    FIELD = 2;
    METRIC = 3;
  }
}

message ExprAndAgg {
  ExpressionNode expr = 1;
  string agg_function = 2;
}

message ExpressionNode {
  // this is always a com.dd.calc_fields.proto.CalcNode
  google.protobuf.Any calcNode = 1;
}

message CancelRequest {
}

message Scope {
  repeated string included_indices = 1;
  repeated string excluded_indices = 2;
}


/*
 * everything below is exactly the same as com.dd.event.store.reader.proto.Value
 * We can't afford an Any here as it would add one type-url per entry
 */

message AggValue {
  oneof value {
    string string_value = 1;
    int64 int64_value = 2;
    uint64 uint64_value = 3;
    double float64_value = 4;
    bytes sketch_value = 5;
    bytes hll_value = 6;
    Avg avg_value = 7;
    FirstLast first_last_value = 8;
    Highlight highlight_value = 9;
    bytes hll_data_sketch_value = 10;
  }
}

message Highlight {
  // We support multiple FTS columns, so in order to distinguish their highlighted version,
  // we'll use a map from column name to highlighted text.
  map<string, string> highlight = 1;
}

message Avg {
  double sum = 1;
  uint64 count = 2;
}

message FirstLast {
  // This is repeated in case the FIRST/LAST function was called with
  // limit > 1. For now though, we only support limit == 1.
  repeated FirstLastEntry entries = 1;
}

message FirstLastEntry {
  bytes sort_by = 1;
  reserved 2, 3, 4, 5;

  // This field contains an encoded FirstLastValues message.
  bytes encoded_values = 6;
}

message EsHttpRequest {
    string method = 1;
    string path = 2;
    bytes body = 3;
    map<string, string> headers = 4;
    int64 org_id = 998;
    string cluster_id = 999;
}

message EsHttpResponse {
    uint32 status_code = 1;
    bytes body = 2;
}

message CloudpremSubstraitRequest {
  int64 org_id = 1;
  Scope scope = 2;

  oneof query {
    bytes substrait_plan = 3;
    string string_query = 4;
  }

  message QuerySource {
    string source = 1;
    string query_name = 2;
    string client_id = 3;
  }
  QuerySource source = 5;

  message Tag {
    string key = 1;
    string value = 2;
  }
  repeated Tag tags = 6;

  map<string, string> settings = 7;
}

message CloudpremSubstraitResponse {
  bytes arrow_ipc_bytes = 1;
}
