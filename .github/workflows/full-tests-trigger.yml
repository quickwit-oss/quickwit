name: Full test suite trigger

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  queue-eligibility:
    name: Queue eligibility
    if: ${{ github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_SHA,
              state: 'success',
              context: 'full-test-suite',
              description: 'Full tests run in the merge queue',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_SHA,
              state: 'success',
              context: 'code-coverage',
              description: 'Code coverage runs in the merge queue',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  dispatch:
    name: Request merge queue tests
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Requesting full tests for merge group $GITHUB_SHA"
