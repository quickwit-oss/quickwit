name: Full test suite trigger

# A maintainer can run the expensive full suite by submitting a PR review
# beginning with `/ci-run-full-tests`. Review events include the immutable
# commit SHA that the review covers, so the suite cannot drift to a later push.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize full test suite
    if: ${{ startsWith(github.event.review.body, '/ci-run-full-tests') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Check the actual review author rather than github.actor: re-runs change
      # the actor while retaining the original review event payload.
      - name: Check reviewer has maintain/admin permission
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REVIEWER: ${{ github.event.review.user.login }}
        with:
          script: |
            const reviewer = process.env.REVIEWER;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: reviewer,
            });
            core.info(`${reviewer} has permission: ${data.permission}`);
            if (!['maintain', 'admin'].includes(data.permission)) {
              core.setFailed(
                `@${reviewer} has '${data.permission}' permission on this repo, ` +
                `but triggering the full test suite requires 'maintain' or 'admin'.`
              );
            }

  full-tests:
    name: Run full test suite
    needs: authorize
    uses: ./.github/workflows/full-tests.yml
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    with:
      sha: ${{ github.event.review.commit_id }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
