name: Full test suite trigger

# `full-tests.yml` ("full-tests / make test-all") is a required status check
# but never runs on its own — see the comment there for why. This workflow
# is the trigger: a reviewer submits a PR review whose body starts with
# `/ci-run-full-tests`, and if that reviewer actually holds `maintain` or
# `admin` permission on this repo, this sets a pending status on the
# reviewed commit and dispatches full-tests.yml against it.
#
# Deliberately checks the real collaborator permission level via the API
# rather than `github.event.review.author_association` — that field can
# only tell you OWNER/MEMBER/COLLABORATOR/etc, none of which distinguish
# "has write access" from "has maintain/admin access". As of 2026-08-17,
# quickwit-oss/quickwit has 57 collaborators with at least write access but
# only 24 with maintain/admin — author_association would have let all 57
# trigger this, not just the intended 24.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  statuses: write
  actions: write

concurrency:
  group: full-tests-trigger-${{ github.event.review.commit_id }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger full test suite
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.review.body, '/ci-run-full-tests') }}
    timeout-minutes: 5
    steps:
      - name: Check reviewer has maintain/admin permission
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            core.info(`${context.actor} has permission: ${data.permission}`);
            if (!['maintain', 'admin'].includes(data.permission)) {
              core.setFailed(
                `@${context.actor} has '${data.permission}' permission on this repo, ` +
                `but triggering the full test suite requires 'maintain' or 'admin'.`
              );
            }

      - name: Set commit status to pending
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.review.commit_id }}',
              state: 'pending',
              context: 'full-tests / make test-all',
              description: `Triggered by @${context.actor}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${{ github.event.pull_request.number }}`,
            })

      # Dispatch against `main` (a ref guaranteed to exist in this repo),
      # not the PR's own branch: for fork PRs, the head branch name only
      # exists in the fork, not here, and workflow_dispatch's `ref` must
      # name a branch/tag in *this* repo. full-tests.yml's own checkout
      # step is what actually fetches `inputs.sha` — that's the exact
      # commit under review, regardless of which ref ran the dispatch.
      - name: Dispatch full-tests.yml
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'full-tests.yml',
              ref: 'main',
              inputs: {
                sha: '${{ github.event.review.commit_id }}',
                pr_number: '${{ github.event.pull_request.number }}',
              },
            })
