name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - trigger-ci-workflow
    paths:
      - "quickwit/**"
      - "!quickwit/quickwit-ui/**"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CP_ENABLE_REVERSE_CONNECTION: false
  QW_DISABLE_TELEMETRY: 1
  QW_TEST_DATABASE_URL: postgres://quickwit-dev:quickwit-dev@localhost:5432/quickwit-metastore-dev
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: -Dwarnings -Arustdoc::private_intra_doc_links
  RUSTFLAGS: -Dwarnings --cfg tokio_unstable

# Ensures that we cancel running jobs for the same PR / same workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-16-core-latest
    timeout-minutes: 60
    permissions:
      actions: write
      checks: write
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      statuses: write
    services:
      # PostgreSQL service container
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: quickwit-dev
          POSTGRES_PASSWORD: quickwit-dev
          POSTGRES_DB: quickwit-metastore-dev
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Cleanup Disk Space
        run: |
          df -h

          if [ "$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')" -lt 30 ]; then
            echo "Less than 30GiB available. Running cleanup..."
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/swift
            sudo rm -rf /usr/local/.ghcup
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            df -h
          else
            echo "30GiB or more available. Skipping cleanup."
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override ADMS registry for GitHub Actions
        run: |
          # GitHub Actions can't access internal ADMS registry, use crates.io instead
          cat > .cargo/config.toml << 'EOF'
          # Keep existing target configs but remove ADMS registry
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "target-cpu=x86-64-v2", "--cfg", "tokio_unstable"]

          [build]
          rustdocflags = ["--cfg", "tokio_unstable"]
          EOF

      - name: Install Ubuntu packages
        run: sudo apt update && sudo apt-get -y install protobuf-compiler
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v.6.2.0
        with:
          python-version: '3.11'
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: modified
        with:
          filters: |
            rust_src:
              - quickwit/**/*.rs
              - quickwit/**/*.toml
              - quickwit/**/*.proto
              - quickwit/rest-api-tests/**
              - .github/workflows/ci.yml
      - name: Setup stable Rust Toolchain
        if: steps.modified.outputs.rust_src == 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.modified.outputs.rust_src == 'true'
        with:
          workspaces: "./quickwit -> target"

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-pomchi
        with:
          scope: DataDog/PomChi
          policy: access

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-event-percolation
        with:
          scope: DataDog/event-percolation
          policy: access_pomsky

      - name: Configure git rewrite (STS tokens)
        env:
          POMCHI_TOKEN: ${{ steps.octo-sts-pomchi.outputs.token }}
          EP_TOKEN: ${{ steps.octo-sts-event-percolation.outputs.token }}
        run: |
          echo "::add-mask::${POMCHI_TOKEN}"
          echo "::add-mask::${EP_TOKEN}"
          git config --global url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "ssh://git@github.com/DataDog/PomChi"
          git config --global --add url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "[email protected]:DataDog/PomChi"
          git config --global url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "ssh://git@github.com/DataDog/event-percolation"
          git config --global --add url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "[email protected]:DataDog/event-percolation"
      - name: Install nextest
        if: always() && steps.modified.outputs.rust_src == 'true'
        uses: taiki-e/install-action@aba36d755ec7ca22d38b12111787c26115943952
        with:
          tool: cargo-nextest
      - name: cargo build
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo build --features=postgres --tests --bin quickwit
        working-directory: ./quickwit
      - name: cargo nextest
        env:
          QW_MAX_LOG_PAST_AGE_HOURS: 10000000000
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo nextest run --features=postgres --retries 1
        working-directory: ./quickwit
      - name: Install python packages
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: |
          pip install --user --require-hashes -r ${{ github.workspace }}/.github/workflows/requirements.txt
          pipenv install --deploy --ignore-pipfile
        working-directory: ./quickwit/rest-api-tests
      - name: Run REST API tests
        env:
          QW_MAX_LOG_PAST_AGE_HOURS: 100000000000
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: pipenv run python3 ./run_tests.py --binary ../target/debug/quickwit
        working-directory: ./quickwit/rest-api-tests

  lints:
    name: Lints
    runs-on: ubuntu-16-core-latest
    timeout-minutes: 60
    permissions:
      actions: write
      checks: write
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override ADMS registry for GitHub Actions
        run: |
          # GitHub Actions can't access internal ADMS registry, use crates.io instead
          cat > .cargo/config.toml << 'EOF'
          # Keep existing target configs but remove ADMS registry
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "target-cpu=x86-64-v2", "--cfg", "tokio_unstable"]

          [build]
          rustdocflags = ["--cfg", "tokio_unstable"]
          EOF

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: modified
        with:
          filters: |
            rust_src:
              - quickwit/**/*.rs
              - quickwit/**/*.toml
              - quickwit/**/*.proto
              - .github/workflows/ci.yml
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-pomchi
        with:
          scope: DataDog/PomChi
          policy: access

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-event-percolation
        with:
          scope: DataDog/event-percolation
          policy: access_pomsky

      - name: Configure git rewrite (STS tokens)
        env:
          POMCHI_TOKEN: ${{ steps.octo-sts-pomchi.outputs.token }}
          EP_TOKEN: ${{ steps.octo-sts-event-percolation.outputs.token }}
        run: |
          echo "::add-mask::${POMCHI_TOKEN}"
          echo "::add-mask::${EP_TOKEN}"
          git config --global url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "ssh://git@github.com/DataDog/PomChi"
          git config --global --add url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "[email protected]:DataDog/PomChi"
          git config --global url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "ssh://git@github.com/DataDog/event-percolation"
          git config --global --add url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "[email protected]:DataDog/event-percolation"
      - name: Install Ubuntu packages
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install protobuf-compiler libcurl4-openssl-dev
      - name: Setup nightly Rust Toolchain (for rustfmt)
        if: steps.modified.outputs.rust_src == 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
          components: rustfmt
      - name: Setup stable Rust Toolchain
        if: steps.modified.outputs.rust_src == 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Setup cache
        if: steps.modified.outputs.rust_src == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./quickwit -> target"
          shared-key: "quickwit-cargo"
      - name: Install cargo deny
        if: always() && steps.modified.outputs.rust_src == 'true'
        uses: taiki-e/cache-cargo-install-action@a8b9ecf8e0c0ea09d7481cfc583a5203ecd585b5 # v3.0.5
        with:
          # 0.18 requires rustc 1.85
          tool: cargo-deny@0.17.0
      - name: Install cargo machete
        if: always() && steps.modified.outputs.rust_src == 'true'
        uses: taiki-e/cache-cargo-install-action@a8b9ecf8e0c0ea09d7481cfc583a5203ecd585b5 # v3.0.5
        with:
          tool: cargo-machete
      - name: cargo clippy
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo clippy --workspace --tests --all-features
        working-directory: ./quickwit
      - name: cargo deny
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo deny check licenses
        working-directory: ./quickwit
      - name: cargo machete
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo machete
        working-directory: ./quickwit
      - name: cargo doc
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo doc --no-deps
        working-directory: ./quickwit
      - name: License headers check
        if: always()
        run: bash scripts/check_license_headers.sh
        working-directory: ./quickwit
      - name: rustfmt
        if: always() && steps.modified.outputs.rust_src == 'true'
        run: cargo +nightly fmt --all -- --check
        working-directory: ./quickwit

  thirdparty-license:
    name: Check Datadog third-party license file
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override ADMS registry for GitHub Actions
        run: |
          # GitHub Actions can't access internal ADMS registry, use crates.io instead
          cat > .cargo/config.toml << 'EOF'
          # Keep existing target configs but remove ADMS registry
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "target-cpu=x86-64-v2", "--cfg", "tokio_unstable"]

          [build]
          rustdocflags = ["--cfg", "tokio_unstable"]
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-pomchi
        with:
          scope: DataDog/PomChi
          policy: access

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a
        id: octo-sts-event-percolation
        with:
          scope: DataDog/event-percolation
          policy: access_pomsky

      - name: Configure git rewrite (STS tokens)
        env:
          POMCHI_TOKEN: ${{ steps.octo-sts-pomchi.outputs.token }}
          EP_TOKEN: ${{ steps.octo-sts-event-percolation.outputs.token }}
        run: |
          echo "::add-mask::${POMCHI_TOKEN}"
          echo "::add-mask::${EP_TOKEN}"
          git config --global url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "ssh://git@github.com/DataDog/PomChi"
          git config --global --add url."https://x-access-token:${POMCHI_TOKEN}@github.com/DataDog/PomChi".insteadOf "[email protected]:DataDog/PomChi"
          git config --global url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "ssh://git@github.com/DataDog/event-percolation"
          git config --global --add url."https://x-access-token:${EP_TOKEN}@github.com/DataDog/event-percolation".insteadOf "[email protected]:DataDog/event-percolation"

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dd-rust-license-tool
        run: dd-rust-license-tool --help || cargo install --git https://github.com/DataDog/rust-license-tool.git --force

      - name: Check Datadog third-party license file
        run: dd-rust-license-tool --config quickwit/license-tool.toml --manifest-path quickwit/Cargo.toml check
