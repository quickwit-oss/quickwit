name: UI CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "quickwit/quickwit-ui/**"
      - ".github/workflows/ui-ci.yml"
  push:
    branches:
      - trigger-ci-workflow

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check & unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quickwit/quickwit-ui/node_modules
          key: ${{ runner.os }}-ui-node-modules-${{ hashFiles('quickwit/quickwit-ui/yarn.lock') }}
      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn --cwd quickwit-ui install --frozen-lockfile
        working-directory: ./quickwit
      - name: Lint
        run: yarn --cwd quickwit-ui lint
        working-directory: ./quickwit
      - name: Type check
        run: yarn --cwd quickwit-ui type
        working-directory: ./quickwit
      - name: Unit tests
        run: yarn --cwd quickwit-ui test
        working-directory: ./quickwit
