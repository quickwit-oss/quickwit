name: Metrics inventory

on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: --cfg tokio_unstable
  INVENTORY: quickwit/quickwit-metrics-inventory/metrics.yaml

concurrency:
  group: metrics-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metrics-inventory:
    name: Metrics inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Filter at the step level rather than with trigger `paths:`, so that the
      # job always reports a status and can be used as a required check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: modified
        with:
          filters: |
            metrics:
              - quickwit/**/*.rs
              - quickwit/**/Cargo.toml
              - quickwit/Cargo.lock
              - quickwit/quickwit-metrics-inventory/**
              - .github/workflows/metrics-inventory.yml
      - name: Install build dependencies
        if: steps.modified.outputs.metrics == 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install protobuf-compiler libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        if: steps.modified.outputs.metrics == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.modified.outputs.metrics == 'true'
        with:
          workspaces: quickwit -> target
          shared-key: metrics-inventory
      - name: Generate inventory
        if: steps.modified.outputs.metrics == 'true'
        run: bash quickwit/quickwit-metrics-inventory/scripts/run.sh > "$RUNNER_TEMP/metrics-inventory.yaml"
      - name: Check committed inventory is up to date
        if: steps.modified.outputs.metrics == 'true'
        run: |
          status=0
          diff -u "$INVENTORY" "$RUNNER_TEMP/metrics-inventory.yaml" > "$RUNNER_TEMP/metrics-inventory.diff" || status=$?
          if (( status == 0 )); then
            echo 'The committed metrics inventory is up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( status > 1 )); then
            exit "$status"
          fi

          # Metric names only (labels stripped): the second level of the YAML
          # mapping `module: { metric{labels}: { kind, description } }`.
          metric_names() {
            sed -nE "s/^  [\"']?([^\"'{: ]+).*/\1/p" "$1" | sort -u
          }
          removed=$(comm -23 <(metric_names "$INVENTORY") <(metric_names "$RUNNER_TEMP/metrics-inventory.yaml"))

          {
            echo '## Metrics inventory is out of date'
            echo
            echo "The generated metrics inventory differs from the committed \`$INVENTORY\`."
            echo 'Run `make metrics-inventory` to regenerate it, then commit the result.'
            echo
            echo '- If the difference comes from added metrics, changed descriptions, kinds,'
            echo '  or labels, regenerating the inventory is enough.'
            echo '- If you **removed** a metric, regenerate the inventory, but be very cautious:'
            echo '  identify every user of that metric (dashboards, monitors, alerts, SLOs,'
            echo '  documentation, downstream consumers), assess the impact, and communicate'
            echo '  the removal before merging.'
            if [[ -n "$removed" ]]; then
              echo
              echo '### Removed metrics'
              echo
              sed 's/.*/- `&`/' <<< "$removed"
            fi
            echo
            echo '### Diff'
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/metrics-inventory.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$RUNNER_TEMP/metrics-inventory.diff"
          echo "::error title=Metrics inventory out of date::Run 'make metrics-inventory' to regenerate $INVENTORY and commit it. For added metrics or changed descriptions, regenerating is enough. If you removed a metric, regenerate but be very cautious: identify all users of the metric, assess the impact, and communicate the removal. See the job summary for details."
          if [[ -n "$removed" ]]; then
            while read -r name; do
              echo "::error title=Metric removed::$name was removed. Identify all users of this metric, assess the impact, and communicate the removal before merging."
            done <<< "$removed"
          fi
          exit 1
