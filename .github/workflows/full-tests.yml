name: Full test suite

# Runs `make test-all` (--all-features plus failpoints) against every
# broker/backend service. A maintainer's submitted PR review invokes this as a
# reusable workflow; merge-queue commits run it automatically.
on:
  workflow_call:
    inputs:
      sha:
        description: "Immutable PR head SHA to test"
        required: true
        type: string
      pr_number:
        description: "PR number whose head SHA is tested"
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK:
        required: false
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  STATUS_CONTEXT: "full-tests / make test-all"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  validate-inputs:
    name: Validate target
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      review_triggered: ${{ steps.validate.outputs.review_triggered }}
    steps:
      - name: Validate target SHA
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REVIEW_TRIGGERED: ${{ inputs.sha != '' }}
          SHA: ${{ inputs.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const reviewTriggered = process.env.REVIEW_TRIGGERED === 'true';
            const sha = process.env.SHA;
            const prNumber = process.env.PR_NUMBER;

            if (!/^[0-9a-fA-F]{40}$/.test(sha)) {
              core.setFailed(`sha must be a 40-character hex commit SHA, got: ${sha}`);
              return;
            }

            if (reviewTriggered) {
              if (!/^[0-9]+$/.test(prNumber)) {
                core.setFailed(`pr_number must be numeric, got: ${prNumber}`);
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              if (pr.state !== 'open') {
                core.setFailed(`PR #${prNumber} is ${pr.state}, not open.`);
                return;
              }
              if (pr.head.sha.toLowerCase() !== sha.toLowerCase()) {
                core.setFailed(
                  `PR #${prNumber} head is ${pr.head.sha}, not reviewed SHA ${sha}. ` +
                  'Submit a new /ci-run-full-tests review for the current head.'
                );
                return;
              }
            }

            core.setOutput('sha', sha);
            core.setOutput('pr_number', reviewTriggered ? prNumber : '');
            core.setOutput('review_triggered', String(reviewTriggered));

  set-pending:
    name: Set pending status
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SHA: ${{ needs.validate-inputs.outputs.sha }}
          STATUS_CONTEXT: ${{ env.STATUS_CONTEXT }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Running full test suite...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  full-tests:
    name: All-features tests + failpoints (make test-all)
    needs: [validate-inputs, set-pending]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This is the only job that checks out and executes PR-authored code, and
    # it is deliberately non-privileged. CodeQL flags this checkout
    # (actions/untrusted-checkout): that is expected here, and is mitigated by
    # isolation rather than by avoiding the checkout, which would defeat the
    # entire purpose of the job. Specifically:
    #   - no secrets: this job never references `secrets.*`. DISCORD_WEBHOOK is
    #     only read by `on-failure`, which has `permissions: {}` and does not
    #     check out code.
    #   - no write scopes: `contents: read` is the minimum `actions/checkout`
    #     needs. The jobs holding `statuses: write` (set-pending,
    #     report-status) never check out or run PR code.
    #   - `persist-credentials: false`, so the token is not left in .git/config
    #     for the untrusted build steps to pick up.
    #   - the ref is never arbitrary fork input: the review path tests the exact
    #     commit a maintain/admin reviewer approved, and the merge_group path
    #     tests a candidate the merge queue built.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-inputs.outputs.sha }}
          persist-credentials: false

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libsasl2-dev libcurl4-openssl-dev

      # apt's protobuf-compiler is too old for proto3 optional fields required
      # by the substrait crate enabled through the datafusion feature.
      - name: Install protoc
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: protoc

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v.6.2.0
        with:
          python-version: '3.11'

      - name: Setup stable Rust Toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./quickwit -> target"
          shared-key: "quickwit-cargo-full"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-nextest

      - name: Start Docker services
        run: make docker-compose-up

      - name: Install python packages
        run: |
          pip install --user --require-hashes -r ${{ github.workspace }}/.github/workflows/requirements.txt
          pipenv install --deploy --ignore-pipfile
        working-directory: ./quickwit/quickwit-cli/tests

      - name: Prepare LocalStack S3
        run: pipenv run ./prepare_tests.sh
        working-directory: ./quickwit/quickwit-cli/tests

      - name: make test-all
        run: make -C quickwit test-all
        env:
          QW_TEST_DATABASE_URL: postgres://quickwit-dev:quickwit-dev@localhost:5432/quickwit-metastore-dev

  report-status:
    name: Report final status
    needs: [validate-inputs, full-tests]
    if: ${{ always() && needs.validate-inputs.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SHA: ${{ needs.validate-inputs.outputs.sha }}
          RESULT: ${{ needs.full-tests.result }}
          STATUS_CONTEXT: ${{ env.STATUS_CONTEXT }}
        with:
          script: |
            const state = process.env.RESULT === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SHA,
              state,
              context: process.env.STATUS_CONTEXT,
              description: state === 'success' ? 'Full test suite passed' : 'Full test suite failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  on-failure:
    name: Send failure notification
    needs: [validate-inputs, full-tests]
    if: >-
      ${{ always() && github.repository_owner == 'quickwit-oss' &&
      needs.validate-inputs.result == 'success' && needs.full-tests.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      TARGET: >-
        ${{ needs.validate-inputs.outputs.review_triggered == 'true' &&
        format('PR #{0}', needs.validate-inputs.outputs.pr_number) ||
        format('merge-group commit {0}', needs.validate-inputs.outputs.sha) }}
    steps:
      - name: Send message
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          nodetail: true
          color: "#FF0000"
          title: ""
          description: |
            ### ❌ ${{ env.TARGET }}

            The full test suite (`make test-all`) failed.

            **[View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**
