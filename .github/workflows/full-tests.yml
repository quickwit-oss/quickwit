name: Full test suite

on:
  workflow_run:
    workflows: [Full test suite trigger]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Set pending status
    if: >-
      ${{ github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'full-test-suite',
              description: 'Running full test suite on merge group...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  full-tests:
    name: make test-all
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    cache-mode: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libsasl2-dev libcurl4-openssl-dev

      # apt's protobuf-compiler is too old for proto3 optional fields required
      # by the substrait crate enabled through the datafusion feature.
      - name: Install protoc
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: protoc

      - name: Setup stable Rust Toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Setup cache (read-only)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./quickwit -> target"
          shared-key: "quickwit-cargo"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-nextest

      - name: Run full test suite
        run: make test-all

  report-status:
    name: Report final status
    needs: [prepare, full-tests]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ needs.full-tests.result }}
        with:
          script: |
            const state = process.env.RESULT === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state,
              context: 'full-test-suite',
              description: state === 'success' ? 'Full test suite passed' : 'Full test suite failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  on-failure:
    name: Send failure notification
    needs: [prepare, full-tests]
    if: >-
      ${{ always() && github.repository_owner == 'quickwit-oss' &&
      needs.prepare.result == 'success' && needs.full-tests.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Send message
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          nodetail: true
          color: "#FF0000"
          title: ""
          description: |
            ### ❌ Merge queue

            The full test suite (`make test-all`) failed.

            **[View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**
