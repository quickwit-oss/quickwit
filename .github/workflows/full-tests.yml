name: Full test suite

on:
  workflow_run:
    workflows: [Full test suite trigger]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Set pending status
    if: >-
      ${{ github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'full-test-suite',
              description: 'Running full tests on merge group...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'code-coverage',
              description: 'Running code coverage on merge group...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  full-tests:
    name: make test-all
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libsasl2-dev libcurl4-openssl-dev

      - name: Install protoc
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: protoc

      - name: Setup stable Rust Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Setup cache (read-only)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./quickwit -> target"
          shared-key: "quickwit-cargo"
          save-if: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-nextest

      - name: Run full test suite
        run: make test-all

  coverage:
    name: Code coverage
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

  report-full-tests:
    name: Report full test status
    needs: [prepare, full-tests]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RESULT: ${{ needs.full-tests.result }}
        with:
          script: |
            const passed = process.env.TEST_RESULT === 'success';
            const state = passed ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state,
              context: 'full-test-suite',
              description: passed ? 'Full test suite passed' : 'Full test suite failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  report-coverage:
    name: Report code coverage status
    needs: [prepare, coverage]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const passed = process.env.COVERAGE_RESULT === 'success';
            const state = passed ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state,
              context: 'code-coverage',
              description: passed ? 'Code coverage passed' : 'Code coverage failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  on-failure:
    name: Send failure notification
    needs: [prepare, full-tests, coverage]
    if: >-
      ${{ always() && github.repository_owner == 'quickwit-oss' &&
      needs.prepare.result == 'success' &&
      (needs.full-tests.result == 'failure' || needs.coverage.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Send message
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          nodetail: true
          color: "#FF0000"
          title: ""
          description: |
            ### ❌ Merge queue

            The full test suite (`make test-all`) or code coverage failed.

            **[View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**
