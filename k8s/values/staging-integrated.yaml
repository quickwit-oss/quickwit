        - -template=/template/dd-api-key.tpl:/secrets/dd-api-key.env:chmod 600 /secrets/dd-api-key.env
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 200m
          memory: 200Mi
      securityContext:
        runAsUser: 1005
      volumeMounts:
        - name: dd-api-key-template
          mountPath: /template/dd-api-key.tpl
          subPath: dd-api-key.tpl
        - name: dd-api-key
          mountPath: /secrets

  extraVolumes:
    - name: dd-api-key
      emptyDir:
        medium: Memory
    - name: dd-api-key-template
      configMap:
        name: pomsky-staging-cloudprem-dd-api-key-template
        items:
          - key: dd-api-key.tpl
            path: dd-api-key.tpl

  extraVolumeMounts:
    - name: dd-api-key
      mountPath: /secrets/dd-api-key.env
      subPath: dd-api-key.env
      readOnly: true

config:
  # S3-based storage paths for integrated staging
  default_index_root_uri: s3://logs-cloudprem-staging/integrated/indexes

  # S3-based metastore (no PostgreSQL dependency)
  metastore_uri: s3://logs-cloudprem-staging/integrated/metastore

  ingest_api:
    max_queue_memory_usage: 2GiB # memory capacity * 0.3 (half of staging)
    max_queue_disk_usage: 5GiB # max queue mem usage * 2 (half of staging)

  searcher:
    lambda:
      function_name: cloudprem-search
      max_splits_per_invocation: 8
      offload_threshold: 0
      auto_deploy:
        execution_role_arn: arn:aws:iam::727006795293:role/cloudprem-lambda-execution

# ConfigMap entry that is rendered by consul-template into the DD_API_KEY file for reverse connection
# Secret stored at: kv/k8s/logs-cloudprem/cloudprem/pomsky-staging/dd_api_key with key dd_api_key
extraConfigMaps:
  - name: dd-api-key-template
    data:
      dd-api-key.tpl: |
        {% with secret "kv/k8s/logs-cloudprem/cloudprem/pomsky-staging/dd_api_key" %}{% .Data.data.dd_api_key %}{% end %}
