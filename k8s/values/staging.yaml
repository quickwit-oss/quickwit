image:
  repository: 727006795293.dkr.ecr.us-east-1.amazonaws.com/pomsky
  tag: edge
  pullPolicy: Always

cloudprem:
  index:
    minShards: 240 # number of indexers * number of * vCPUs * 2
  reverseConnection:
    enabled: true

datadog:
  site: dd.datad0g.com

environment:
  QW_ENABLE_OPENTELEMETRY_OTLP_EXPORTER: true
  # disable mtls verification: we don't have a reverse-proxy doing decapsulation
  # and putting the certificate into a header in staging
  CP_DISABLE_CERTIFICATE_VERIFICATION: true

podAnnotations:
  # https://docs.datadoghq.com/containers/kubernetes/prometheus/?tab=kubernetesadv2
  # https://docs.datadoghq.com/containers/guide/template_variables/
  ad.datadoghq.com/pomsky.checks: |
      {
        "openmetrics": {
          "instances": [
            {
              "openmetrics_endpoint": "http://%%host%%:7280/metrics",
              "namespace": "cloudprem",
              "metrics": [".*"]
            }
          ]
        }
      }
  emissary.datadoghq.com/inject-lifecycle: "inject"

tolerations:
  - key: node
    operator: Equal
    effect: NoSchedule
    value: nodeless

  - key: cpu_arch
    operator: Equal
    effect: NoSchedule
    value: arm64

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: "node-role.kubernetes.io/nodeless"
            operator: Exists
          - key: "node.datadoghq.com/cpu_arch"
            operator: In
            values:
              - arm64

metastore:
  replicaCount: 2

  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi

  initContainers:
    # Loads pgpass.tpl and injects the password (loaded from Vault) for the OrgStore metastore db into it,
    # rendering the output into a /quickwit/pgpass file
    - name: consul-template-init
      # Note that this is a hard-coded US1 staging image, should not be copied directly for other envs
      image: 727006795293.dkr.ecr.us-east-1.amazonaws.com/consul-template:0.40.0-dd
      args:
        - -once
        - -template=/template/pgpass.tpl:/quickwit/pgpass:chmod 600 /quickwit/pgpass
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 200m
          memory: 200Mi
      securityContext:
        runAsUser: 1005
      volumeMounts:
        - name: pgpass-template
          mountPath: /template/pgpass.tpl
          subPath: pgpass.tpl
        - name: pgpass
          mountPath: /quickwit

  # Additional volumes for the source template and rendered pgpass file
  extraVolumes:
    - name: pgpass
      emptyDir:
        medium: Memory
    - name: pgpass-template
      configMap:
        name: pomsky-cloudprem-pgpass-template
        items:
          - key: pgpass.tpl
            path: pgpass.tpl

  # Mounts the pgpass file for connecting to OrgStore
  extraVolumeMounts:
    - name: pgpass
      mountPath: /quickwit/pgpass
      subPath: pgpass
      readOnly: true

  extraEnv:
    # Points sqlx to the appropriate pgpass file location
    PGPASSFILE: /quickwit/pgpass
    DD_API_KEY: "dummy-not-used-by-non-searcher-pods"

control_plane:
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi
  extraEnv:
    DD_API_KEY: "dummy-not-used-by-non-searcher-pods"

indexer:
  replicaCount: 50

  extraEnv:
    DD_API_KEY: "dummy-not-used-by-non-searcher-pods"

  resources:
    limits:
      cpu: 4
      memory: 16Gi
    requests:
      cpu: 4
      memory: 16Gi

  persistentVolume:
    enabled: true
    storage: 200Gi
    storageClass: gp3
    annotations:
      ebs.csi.aws.com/iops: "8000"
      ebs.csi.aws.com/throughput: "500"

searcher:
  replicaCount: 40

  # Fabric Egress Gateway: allows searcher pods to reach lambda.us-east-1.amazonaws.com
  # for Lambda auto-deploy and invocation (offloaded leaf search)
  podAnnotations:
    beta.fabric.datadoghq.com/inject-lifecycle: "inject"
    beta.fabric.datadoghq.com/egress-gateway: "true"

  resources:
    limits:
      cpu: 16
      memory: 64Gi
    requests:
      cpu: 16
      memory: 64Gi

  initContainers:
    - name: consul-template-dd-api-key
      image: 727006795293.dkr.ecr.us-east-1.amazonaws.com/consul-template:0.40.0-dd
      args:
        - -once
        - -template=/template/dd-api-key.tpl:/quickwit/dd-api-key
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 200m
          memory: 200Mi
      securityContext:
        runAsUser: 1005
      volumeMounts:
        - name: dd-api-key-template
          mountPath: /template/dd-api-key.tpl
          subPath: dd-api-key.tpl
        - name: dd-api-key
          mountPath: /quickwit

  extraVolumes:
    - name: dd-api-key
      emptyDir:
        medium: Memory
    - name: dd-api-key-template
      configMap:
        name: pomsky-cloudprem-dd-api-key-template
        items:
          - key: dd-api-key.tpl
            path: dd-api-key.tpl

  extraVolumeMounts:
    - name: dd-api-key
      mountPath: /quickwit/dd-api-key
      subPath: dd-api-key
      readOnly: true

  extraEnv:
    DD_API_KEY_FILE: /quickwit/dd-api-key

janitor:
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi
  extraEnv:
    DD_API_KEY: "dummy-not-used-by-non-searcher-pods"

# ConfigMap entry that is rendered by consul-template into a pgpass file used for connecting to the OrgStore metastore DB
extraConfigMaps:
  - name: pgpass-template
    data:
      pgpass.tpl: |
        *:*:*:*:{% with secret "kv/orgstore/orgstore-logs-cloudprem-metastore/orgstore-logs-cloudprem-metastore-pg-proxy/k8s/logs-cloudprem/cloudprem/credentials" %}{% .Data.data.password %}{% end %}
  - name: dd-api-key-template
    data:
      dd-api-key.tpl: |
        {% with secret "kv/k8s/logs-cloudprem/cloudprem/dogfooding-cluster-reverse-connection-dd-api-key" %}{% .Data.data.value %}{% end %}


config:
  default_index_root_uri: s3://logs-cloudprem-staging/indexes

  # username for database is $namespace_$serviceAccount with underscores as separators
  metastore_uri: postgres://logs_cloudprem_cloudprem@orgstore-logs-cloudprem-metastore-pg-proxy.orgstore-logs-cloudprem-metastore.all-clusters.local-dc.fabric.dog/logs_cloudprem_metastore

  # Indexer settings
  indexer:
    split_store_max_num_bytes: 200G
    split_store_max_num_splits: 10000
  # Ingest API settings
  ingest_api:
    max_queue_memory_usage: 5GiB # memory capacity * 0.3
    max_queue_disk_usage: 10GiB # max queue mem usage * 2
  # Searcher settings
  searcher:
    fast_field_cache_capacity: 22G
    split_footer_cache_capacity: 4G
    partial_request_cache:
      capacity: 2G
      policy: s3-fifo
    predicate_cache:
      capacity: 5G
      policy: s3-fifo
    warmup_memory_budget: 20G
    max_num_concurrent_split_searches: 200
    aggregation_memory_limit: 500M
    # lambda:
    #   function_name: cloudprem-search
    #   max_splits_per_invocation: 8
    #   offload_threshold: 100
    #   auto_deploy:
    #     execution_role_arn: arn:aws:iam::727006795293:role/cloudprem-lambda-execution
