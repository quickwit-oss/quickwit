include:
  - local: .adms/npm/gitlab.yaml
  - local: .adms/python/gitlab.yaml
variables:
  BAZEL_CI_IMAGE: registry.ddbuild.io/images/bazel:5-gbi-jammy
  DOCKER_CI_IMAGE: registry.ddbuild.io/images/docker:27.3.1

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "pomsky/staging"
    - if: $CI_COMMIT_TAG

default:
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/".insteadOf "https://github.com/DataDog/"

stages:
  - build
  - publish
  - deploy

build_image:
  image: $DOCKER_CI_IMAGE
  stage: build
  tags:
    - arch:arm64
  rules:
    - changes:
        - .cargo/config.toml
        - .dockerignore
        - .gitlab-ci.yml
        - Dockerfile
        - quickwit/**/*
    - if: $CI_COMMIT_TAG
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    # push an unsigned image for public use, identify it with it's SHA to prevent race condition between pipelines
    - scripts/image-tool.sh --push --platform linux/amd64,linux/arm64 --repo cloudprem --tag $CI_COMMIT_SHA
    # and a signed image to pomsky for internal deployments
    - scripts/image-tool.sh --push --sign --repo pomsky

build_image_staging:
  image: $DOCKER_CI_IMAGE
  stage: build
  tags:
    - arch:arm64
  rules:
    - if: $CI_COMMIT_BRANCH == "pomsky/staging"
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - quickwit/**/*
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    # push a signed image to pomsky with staging tag for staging-integrated deployments
    - scripts/image-tool.sh --push --sign --repo pomsky --tag staging

verify_version:
  image: $DOCKER_CI_IMAGE
  stage: build
  tags:
    - arch:arm64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if echo "$CI_COMMIT_TAG" | grep -qE "^v[0-9]+\.[0-9]+\.[0-9]+$"; then
          CARGO_PKG_VERSION=$(cat quickwit/Cargo.toml | sed -nE 's/^version = "(.*)"/\1/p')
          if [ "$CI_COMMIT_TAG" != v"$CARGO_PKG_VERSION" ]; then
              exit 1
          fi
      fi

generate-docker-tag-names:
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/ci/auto_inject/gitlab:current
  stage: publish
  rules:
    - changes:
        - .gitlab-ci.yml
        - Dockerfile
        - quickwit/**/*
    - if: $CI_COMMIT_TAG
  variables:
    IMG_DESTINATION_BASE: cloudprem
  script:
    - .gitlab/list-docker-tags.sh
  artifacts:
    reports:
      dotenv: build.env

publish_public_images:
  stage: publish
  rules:
    - changes:
        - .gitlab-ci.yml
        - Dockerfile
        - quickwit/**/*
    - if: $CI_COMMIT_TAG
  trigger:
    project: DataDog/public-images
    branch: main
    strategy: depend
  needs:
    - job: generate-docker-tag-names
      artifacts: true
  variables:
    IMG_SOURCES: registry.ddbuild.io/cloudprem:$CI_COMMIT_SHA
    IMG_DESTINATIONS: $IMG_DESTINATIONS
    IMG_REGISTRIES: public
    IMG_SIGNING: "false"

deploy_to_staging:
  image: $BAZEL_CI_IMAGE
  stage: deploy
  tags:
    - arch:amd64
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - export PATH="$PATH:$CI_PROJECT_DIR/bazel-bin"
    - bzl run staging.publish --define image_digest=$(crane digest registry.ddbuild.io/pomsky:edge)

deploy_to_staging_integrated:
  image: $BAZEL_CI_IMAGE
  stage: deploy
  tags:
    - arch:amd64
  rules:
    - if: $CI_COMMIT_BRANCH == "pomsky/staging"
  script:
    - export PATH="$PATH:$CI_PROJECT_DIR/bazel-bin"
    - bzl run staging-integrated.publish --define image_digest=$(crane digest registry.ddbuild.io/pomsky:staging)
