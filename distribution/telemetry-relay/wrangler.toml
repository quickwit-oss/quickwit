name = "quickwit-telemetry-relay"
main = "src/relay.js"
compatibility_date = "2026-06-01"

# Serve the relay on the hostname Quickwit sends telemetry to. This requires the `quickwit.io`
# zone to be on the Cloudflare account.
# routes = [{ pattern = "telemetry.quickwit.io", custom_domain = true }]

# Workers Logs would retain request metadata, including client IP addresses. Keep it off.
[observability]
enabled = false

[vars]
DD_LOGS_URL = "https://http-intake.logs.datadoghq.com/api/v2/logs"

# Secrets, set with `npx wrangler secret put <NAME>`:
# - DD_API_KEY: Datadog API key used to send the logs.
# - INSTALL_ID_SECRET: key of the HMAC that replaces `hashed_host_username`. Changing it changes
#   every install ID, so set it once and keep it.
